<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>fiapup fur lab</title>
<style>
  :root { --bg: #c4e0f0; --panel: #fffaf0; --ink: #4a3a34; --soft: #6b7c96; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d2430; --panel: #262d3a; --ink: #e8dccf; --soft: #9aa8c0; } }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none;
    font: 13px/1.4 ui-rounded, system-ui, sans-serif; color: var(--ink);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #frame { position: fixed; inset: 0; touch-action: none; }
  #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #safe { position: fixed; inset: 0; pointer-events: none; visibility: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #keys { display: none; }
  #lab { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--panel); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; min-width: 200px;
    box-shadow: 0 4px 16px #0003; touch-action: auto; }
  #lab label { display: grid; grid-template-columns: 70px 1fr 28px; gap: 6px; align-items: center; }
  #lab button { font: inherit; border: 1px solid var(--soft); background: none; color: var(--ink);
    border-radius: 8px; padding: 4px 8px; }
  #lab .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #ms { color: var(--soft); }
</style>
</head>
<body>
<div id="frame"><canvas id="scene"></canvas><canvas id="text"></canvas></div>
<div id="safe"></div>
<div id="keys"></div>
<div id="lab">
  <strong>fur lab</strong>
  <label>shells <input id="shells" type="range" min="4" max="32" step="1" value="16"><span id="shellsN">16</span></label>
  <label>strands <input id="density" type="range" min="10" max="60" step="1" value="26"><span id="densityN">26</span></label>
  <div class="row">
    <button id="look">flat</button>
    <button id="zoom">zoomies</button>
    <button id="nap">nap</button>
  </div>
  <div id="ms">stroke the pup to comb it</div>
</div>
<script type="module">
// Stroke the pup to comb it: the comb holds for a moment, then springs back.
// ?flat shows the same pup flat, for comparison.
import { start } from "./shell.mjs";
const flat = new URLSearchParams(location.search).has("flat");
const game = await start({ fur: !flat });
game.fiapup.lab(Number(new URLSearchParams(location.search).get("reach")) || 120);
game.fiapup.world.touch.mode = true;
const fur = globalThis.__fiapupFur();
const $ = (id) => document.getElementById(id);
for (const [id, set] of [["shells", (v) => fur?.setShells(v)], ["density", (v) => fur?.setDensity(v)]]) {
  $(id).addEventListener("input", (e) => { $(id + "N").textContent = e.target.value; set(Number(e.target.value)); });
}
$("look").textContent = flat ? "fur" : "flat";
$("look").onclick = () => { location.search = flat ? "" : "?flat"; };
$("zoom").onclick = () => { game.fiapup.world.pup.energy = .95; game.fiapup.world.pup.state = "idle"; game.fiapup.stageTap?.("play"); };
$("nap").onclick = () => { game.fiapup.stageTap?.("bed"); };
for (const el of document.querySelectorAll("#lab, #lab *")) el.addEventListener("pointerdown", (e) => e.stopPropagation());
setInterval(() => { $("ms").textContent = `${globalThis.__fiapupFrameMs().toFixed(1)} ms a frame · ${fur ? fur.state.shells + " shells" : "flat"}`; }, 500);
</script>
</body>
</html>
