<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c4e0f0">
<title>fiapup</title>
<style>
  :root { --bg: #c4e0f0; --soft: #56667f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d2430; --soft: #9aa8c0; } }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none;
    font: 13px/1.4 ui-rounded, system-ui, sans-serif; color: var(--soft);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none; }
  #frame { position: fixed; inset: 0; touch-action: none; }
  body.keys #frame { bottom: 34px; }
  #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #safe { position: fixed; inset: 0; pointer-events: none; visibility: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #keys { display: none; position: fixed; left: 0; right: 0; bottom: 0; height: 34px;
    gap: 18px; justify-content: center; align-items: center; }
  body.keys #keys { display: flex; }
  kbd { font: inherit; padding: 1px 6px; border: 1px solid currentColor; border-radius: 5px; }
</style>
</head>
<body>
<div id="frame"><canvas id="scene"></canvas><canvas id="text"></canvas></div>
<div id="safe"></div>
<div id="keys">
  <span><kbd>WASD</kbd>/<kbd>arrows</kbd> hand</span>
  <span><kbd>space</kbd> A pet / pick up / throw</span>
  <span><kbd>C</kbd> B call</span>
  <span><kbd>T</kbd> X treat (hold)</span>
  <span><kbd>R</kbd> Y play</span>
  <span>or an Xbox pad · or the mouse</span>
</div>
<script type="module">
// The shell lives in shell.mjs (shared with fur-lab.html). ?fur draws the pup in fur.
import { start } from "./shell.mjs";
start();
</script>
</body>
</html>
