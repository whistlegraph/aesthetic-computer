<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>oskiewar</title>
  <meta name="description" content="Play oskiewar in your browser with a keyboard or two gamepads.">
  <meta name="theme-color" content="#ebf1f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07081c" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="oskiewar">
  <meta property="og:description" content="pick a pal. pick a fight.">
  <meta property="og:image" content="https://oskiewar.com/social/oskiewar-title.jpg">
  <meta property="og:image:secure_url" content="https://oskiewar.com/social/oskiewar-title.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="the multicolor oskiewar title screen">
  <meta property="og:video" content="https://oskiewar.com/social/oskiewar-title.mp4">
  <meta property="og:video:secure_url" content="https://oskiewar.com/social/oskiewar-title.mp4">
  <meta property="og:video:type" content="video/mp4">
  <meta property="og:video:width" content="720">
  <meta property="og:video:height" content="1280">
  <meta property="og:url" content="https://oskiewar.com/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="oskiewar">
  <meta name="twitter:image" content="https://oskiewar.com/social/oskiewar-title.jpg">
  <style>
    @font-face {
      font-family: "Comic Relief";
      src: url("./ComicRelief-Regular.ttf") format("truetype"),
        url("https://papers.aesthetic.computer/foundry/fonts/ComicRelief-Regular.ttf") format("truetype");
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07081c; }
    @media (prefers-color-scheme: light) { html, body { background: #ebf1f8; } }
    @supports (height: 100dvh) { html, body { height: 100dvh; } }
    body { display: grid; place-items: center; font-family: "Comic Relief", "Comic Sans MS", Arial, sans-serif;
      cursor: url("/aesthetic.computer/cursors/precise.svg") 12 12, auto; }
    body.selection-hover {
      cursor: url("/aesthetic.computer/cursors/active.svg") 12 12, pointer; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh;
      min-width: 0; min-height: 0; display: block; cursor: inherit; }
    @supports (height: 100dvh) { canvas { height: 100dvh; } }
    button, input, label { cursor: inherit; }
    button:hover, input:hover, label:hover {
      cursor: url("/aesthetic.computer/cursors/active.svg") 12 12, pointer; }
    #status { position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap; }
    /* Invisible ruler for the device's own occlusions. Reading env() straight
       from JS is not a thing, so the values are worn as padding and measured
       off the computed style. */
    #inset-probe { position: fixed; visibility: hidden; pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
        env(safe-area-inset-bottom) env(safe-area-inset-left); }
    /* Whoever is signed in owns the bottom-left corner: handle first, then the
       door out. It used to float in the middle of the title screen, under the
       wordmark, which put a person's name in the same band as the game's own
       type and made the logout button read as a menu item. The build stamp
       moved to the top-left to clear this corner (see drawTitleScreen). */
    #account { position: fixed; z-index: 6;
      left: max(14px, env(safe-area-inset-left), var(--inset-left, 0px));
      bottom: max(14px, env(safe-area-inset-bottom), var(--inset-bottom, 0px));
      display: flex; flex-direction: row; align-items: center; gap: 10px; }
    .touch-enabled #account {
      top: max(12px, env(safe-area-inset-top), var(--inset-top, 0px));
      bottom: auto;
    }
    /* The silent auth check answers well after the first paint. In a row that
       is fine — the handle appears to the left of a button that has not moved
       — where the old stacked layout made the door jump a second in. */
    #account-handle { white-space: nowrap;
      font: 700 19px/1 "Comic Relief", "Comic Sans MS", Arial, sans-serif;
      color: #f3f6ff; text-shadow: 2px 3px 0 rgba(4, 7, 18, .65); }
    #account-handle[hidden] { display: none; }
    #logout { appearance: none; padding: 7px 11px; border: 2px solid #6e768d;
      border-radius: 8px; background: #b0b8ca; color: #171b28;
      font: 700 15px/1 "Comic Relief", "Comic Sans MS", Arial, sans-serif;
      box-shadow: 2px 3px 0 rgba(20, 25, 38, .35); cursor: pointer;
      transition: transform .12s ease, background .12s ease,
        box-shadow .12s ease; }
    #logout:hover { background: #d9dfee; transform: translate(-1px, -2px);
      box-shadow: 4px 6px 0 rgba(20, 25, 38, .4); }
    #logout:active { transform: translate(1px, 2px);
      box-shadow: 1px 1px 0 rgba(20, 25, 38, .35); }
    body:not(.title-open) #account, body.social-preview #account { display: none; }
    body.midi-out #account { display: none; }
    body:not(.title-open) #logout, body.social-preview #logout { display: none; }
    /* Scoring from a DAW is anonymous dummy play, so the account door is shut
       and the corner it occupied is free for the midi lamp. */
    body.midi-out #logout { display: none; }
    /* The midi lamp is drawn by the game in its HUD status lane, not here — an
       overlay could never match the bug and the clock, which live in game
       units inside the title-safe frame. */
  </style>
</head>
<body>
  <canvas id="screen" width="1920" height="1080" aria-label="oskiewar two-player stick fight"></canvas>
  <div id="inset-probe" aria-hidden="true"></div>
  <div id="status" role="alert" aria-live="polite"></div>
  <div id="account">
    <span id="account-handle" hidden></span>
    <button id="logout" type="button">log in</button>
  </div>
  <script>
    const canvas = document.querySelector("#screen");
    const context = canvas.getContext("2d");
    const keys = [new Set(), new Set()];
    const touchPointers = new Map();
    const selectTaps = [];
    globalThis.__oskiewarTouch = { taps: selectTaps,
      pointer: { x: 0, y: 0, active: false } };
    const touchEnabled = new URLSearchParams(location.search).has("touch") ||
      navigator.maxTouchPoints > 0 || matchMedia("(pointer: coarse)").matches;
    document.body.classList.toggle("touch-enabled", touchEnabled);
    document.body.classList.add("title-open");
    document.body.classList.toggle("social-preview",
      new URLSearchParams(location.search).has("social-preview"));
    // Direct native/web route for the large destructible training opponent.
    // Pal select is intentionally retired; this keeps Spiderdummy reachable
    // without restoring a screen that no longer matches the front door.
    globalThis.__oskiewarOpponent =
      new URLSearchParams(location.search).get("opponent") || "";
    let titleOpen = true;
    const keyMap = new Map([
      ["KeyW", [0, "ArrowUp"]], ["KeyS", [0, "ArrowDown"]],
      ["KeyA", [0, "ArrowLeft"]], ["KeyD", [0, "ArrowRight"]],
      ["Space", [0, "A"]], ["Enter", [0, "B"]],
      ["ShiftLeft", [0, "X"]], ["ShiftRight", [0, "X"]],
      ["AltLeft", [0, "Y"]], ["AltRight", [0, "Y"]],
      ["Escape", [0, "Menu"]], ["Backspace", [0, "Menu"]],
      ["Tab", [0, "View"]],
      ["ArrowUp", [1, "ArrowUp"]], ["ArrowDown", [1, "ArrowDown"]],
      ["ArrowLeft", [1, "ArrowLeft"]], ["ArrowRight", [1, "ArrowRight"]],
      ["KeyK", [1, "A"]], ["KeyL", [1, "B"]], ["Semicolon", [1, "X"]],
      ["Quote", [1, "Y"]],
    ]);
    globalThis.__oskiewarToggleDebug = () => {
      keys[0].add("View");
      setTimeout(() => keys[0].delete("View"), 90);
    };
    let audioContext = null;
    const logout = document.querySelector("#logout");
    // The account door sounds like the rest of the furniture: a soft tick
    // on approach, a firmer knock on the way through — the curtain manner.
    logout.addEventListener("pointerenter", () =>
      globalThis.__oskiewarSfx?.drum?.("hat", .26, 0));
    let accountClient = null;
    let accountSignedIn = false;
    logout.addEventListener("click", async () => {
      globalThis.__oskiewarSfx?.drum?.("block", .85, 0);
      if (!accountSignedIn) {
        try {
          const client = await getAccountClient();
          await client?.loginWithRedirect({ authorizationParams: {
            redirect_uri: location.origin,
          }});
        } catch (_) {}
        return;
      }
      const target = new URL("https://hi.aesthetic.computer/v2/logout");
      target.searchParams.set("client_id", "LVdZaMbyXctkGfZDnpzDATB5nR0ZhmMt");
      // Return to the host you logged out from, not always the apex — coming
      // back to oskiewar.com from midi.oskiewar.com would silently drop you out
      // of midi mode. Auth0 checks this against its allowed logout URLs, so
      // both hosts have to be listed there.
      target.searchParams.set("returnTo", location.origin + "/");
      location.assign(target);
    });

    // The shell holds no session of its own: oskiewar.com is a different
    // registrable domain from aesthetic.computer, so neither cookie nor
    // localStorage crosses. The Auth0 SSO cookie on hi.aesthetic.computer is
    // the only shared ground, so ask it silently — no redirect, no interruption
    // to a title screen someone may have opened just to play.
    const accountHandle = document.querySelector("#account-handle");
    const accountProfile = { handle: "", colors: [] };
    function loadAuth0() {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "/aesthetic.computer/dep/auth0-spa-js.production.js";
        script.crossOrigin = "anonymous";
        script.onload = resolve;
        script.onerror = () => reject(new Error("auth0 script failed"));
        document.head.appendChild(script);
      });
    }
    async function getAccountClient() {
      if (accountClient) return accountClient;
      if (!globalThis.auth0) await loadAuth0();
      accountClient = await globalThis.auth0?.createAuth0Client({
        domain: "https://hi.aesthetic.computer",
        clientId: "LVdZaMbyXctkGfZDnpzDATB5nR0ZhmMt",
        cacheLocation: "localstorage",
        useRefreshTokens: true,
        authorizationParams: { redirect_uri: location.origin },
      });
      return accountClient;
    }
    async function showAccountHandle() {
      // A silent check also fails when oskiewar.com is missing from Auth0's
      // allowed web origins, which is indistinguishable here from being logged
      // out — so an unknown session shows no handle and still offers the door,
      // rather than hiding the way out from someone who is actually signed in.
      try {
        const client = await getAccountClient();
        if (!client) return;
        await client.checkSession();
        const sub = (await client.getUser())?.sub;
        if (!sub) return;
        // Same endpoint the fight coordinator verifies against, and it answers
        // cross-origin, so the handle needs no proxy route of its own.
        const response = await fetch(
          "https://aesthetic.computer/handle?for=" + encodeURIComponent(sub));
        if (!response.ok) return;
        const handle = (await response.json())?.handle;
        if (!handle) return;
        accountHandle.textContent = "@" + handle;
        accountHandle.hidden = false;
        accountSignedIn = true;
        logout.textContent = "log out";
        accountProfile.handle = "@" + String(handle).toUpperCase();
        try {
          const colorsResponse = await fetch("https://aesthetic.computer/api/handle-colors?handle=" +
            encodeURIComponent(handle), { cache: "no-store" });
          const colors = colorsResponse.ok ? (await colorsResponse.json())?.colors : null;
          accountProfile.colors = Array.isArray(colors) ? colors : [];
        } catch (_) {}
      } catch (_) {}
    }
    // The poster and the loop are burned headless from this same shell, and a
    // handle is nobody's business in an Open Graph card.
    if (!document.body.classList.contains("social-preview")) showAccountHandle();

    // Keep a stable 1080-unit vertical coordinate system while allowing the
    // horizontal game surface to follow the browser's actual aspect ratio.
    // 16:9 therefore remains exactly 1920x1080, while 9:16 becomes 608x1080
    // instead of a letterboxed landscape image.
    let logicalWidth = 1920;
    let logicalHeight = 1080;
    // Hardware occlusions in logical units: home indicator, notch, rounded
    // corners. env() covers the browsers; the iOS shell pins its scroll view
    // so env() reads zero there, and the app injects the real insets as
    // __oskiewarSafeInsets in CSS pixels instead. The deeper source wins.
    const logicalInset = { top: 0, right: 0, bottom: 0, left: 0 };
    const insetProbe = document.querySelector("#inset-probe");
    function resizeCanvas() {
      const bounds = canvas.getBoundingClientRect();
      const width = Math.max(1, bounds.width);
      const height = Math.max(1, bounds.height);
      logicalHeight = 1080;
      logicalWidth = Math.max(480, Math.min(2880,
        Math.round(logicalHeight * width / height)));
      const probe = getComputedStyle(insetProbe);
      const native = globalThis.__oskiewarSafeInsets || {};
      const scale = logicalHeight / height;
      for (const edge of ["top", "right", "bottom", "left"]) {
        const measured = Math.max(
          parseFloat(probe["padding-" + edge]) || 0,
          Number(native[edge]) || 0);
        logicalInset[edge] = Math.round(measured * scale);
        // The DOM furniture (the account corner) reads the same merged
        // answer through these variables, because env() alone is blind to
        // the natively injected insets.
        document.documentElement.style.setProperty("--inset-" + edge,
          measured + "px");
      }
      const density = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
      const pixelWidth = Math.round(logicalWidth * density);
      const pixelHeight = Math.round(logicalHeight * density);
      if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
        context.setTransform(density, 0, 0, density, 0, 0);
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = "high";
      }
    }
    resizeCanvas();
    globalThis.__oskiewarInsetsChanged = resizeCanvas;
    addEventListener("resize", resizeCanvas, { passive: true });
    window.visualViewport?.addEventListener("resize", resizeCanvas,
      { passive: true });
    if (typeof ResizeObserver === "function")
      new ResizeObserver(resizeCanvas).observe(document.documentElement);

    function gameView() {
      return { width: logicalWidth, height: logicalHeight,
        aspect: logicalWidth / logicalHeight,
        orientation: logicalWidth < logicalHeight ? "portrait" : "landscape",
        inset: { ...logicalInset } };
    }

    function ensureAudio() {
      if (!audioContext) audioContext = new AudioContext();
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    // Cached ElevenLabs female:3 rendition of "Oskie War". Separate media
    // elements create a compact feedback echo without requiring cross-origin
    // Web Audio access to the public AC audio CDN.
    const titleVoiceUrl = "https://art.aesthetic.computer/tts-cache/4f0fe9fc3486f07488f3d20685a8b635d1e8a3aad77f00c378f89f70aa77cf23.mp3";
    const titleVoiceEchoes = [1, .3, .12].map((volume) => {
      const voice = new Audio(titleVoiceUrl);
      voice.preload = "auto";
      voice.volume = volume;
      return voice;
    });
    function titleVoice() {
      for (const [index, voice] of titleVoiceEchoes.entries()) {
        setTimeout(() => {
          voice.currentTime = 0;
          voice.play().catch(() => {});
        }, index * 155);
      }
    }

    function titleBeep() {
      const ac = ensureAudio();
      const now = ac.currentTime;
      const oscillator = ac.createOscillator();
      const envelope = ac.createGain();
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(620, now);
      oscillator.frequency.exponentialRampToValueAtTime(930, now + .1);
      envelope.gain.setValueAtTime(.28, now);
      envelope.gain.exponentialRampToValueAtTime(.001, now + .13);
      oscillator.connect(envelope).connect(ac.destination);
      oscillator.start(now);
      oscillator.stop(now + .14);
    }

    function dismissTitle() {
      if (!titleOpen) return false;
      titleOpen = false;
      document.body.classList.remove("title-open");
      return true;
    }

    function tapTitle(point = null) {
      if (!titleOpen) return false;
      const button = globalThis.__oskiewarTouch?.titleButton;
      const inside = !point || button && point.x >= button.x &&
        point.x <= button.x + button.width && point.y >= button.y &&
        point.y <= button.y + button.height;
      if (!inside) {
        ensureAudio();
        drum("block", .32, 0);
        return true;
      }
      dismissTitle();
      keys[0].add("A");
      ensureAudio();
      globalThis.__oskiewarSfx?.unlock().catch(() => {});
      setTimeout(() => keys[0].delete("A"), 90);
      return true;
    }

    function color(values) {
      const [r = 255, g = 255, b = 255, a = 255] = values;
      return `rgba(${r}, ${g}, ${b}, ${a / 255})`;
    }

    function wipe(...ink) {
      context.fillStyle = color(ink);
      context.fillRect(0, 0, logicalWidth, logicalHeight);
    }

    function box(x, y, width, height, ...ink) {
      context.fillStyle = color(ink);
      context.fillRect(x, y, width, height);
    }

    function line(x1, y1, x2, y2, width, ...ink) {
      context.strokeStyle = color(ink);
      context.lineWidth = width;
      context.lineCap = "round";
      context.beginPath();
      context.moveTo(x1, y1);
      context.lineTo(x2, y2);
      context.stroke();
    }

    function triangle(x1, y1, x2, y2, x3, y3, ...ink) {
      context.fillStyle = color(ink);
      context.beginPath();
      context.moveTo(x1, y1);
      context.lineTo(x2, y2);
      context.lineTo(x3, y3);
      context.closePath();
      context.fill();
    }

    const blockGlyphs = {
      A:[14,17,17,31,17,17,17], B:[30,17,17,30,17,17,30], C:[14,17,16,16,16,17,14],
      D:[30,17,17,17,17,17,30], E:[31,16,16,30,16,16,31], F:[31,16,16,30,16,16,16],
      G:[14,17,16,23,17,17,15], H:[17,17,17,31,17,17,17], I:[31,4,4,4,4,4,31],
      J:[7,2,2,2,18,18,12], K:[17,18,20,24,20,18,17], L:[16,16,16,16,16,16,31],
      M:[17,27,21,21,17,17,17], N:[17,25,21,19,17,17,17], O:[14,17,17,17,17,17,14],
      P:[30,17,17,30,16,16,16], Q:[14,17,17,17,21,18,13], R:[30,17,17,30,20,18,17],
      S:[15,16,16,14,1,1,30], T:[31,4,4,4,4,4,4], U:[17,17,17,17,17,17,14],
      V:[17,17,17,17,17,10,4], W:[17,17,17,21,21,21,10], X:[17,17,10,4,10,17,17],
      Y:[17,17,10,4,4,4,4], Z:[31,1,2,4,8,16,31],
      0:[14,17,19,21,25,17,14], 1:[4,12,4,4,4,4,14], 2:[14,17,1,2,4,8,31],
      3:[30,1,1,14,1,1,30], 4:[2,6,10,18,31,2,2], 5:[31,16,16,30,1,1,30],
      6:[14,16,16,30,17,17,14], 7:[31,1,2,4,8,8,8], 8:[14,17,17,14,17,17,14],
      9:[14,17,17,15,1,1,14], ".":[0,0,0,0,0,12,12], ":":[0,4,4,0,4,4,0],
      "-":[0,0,0,31,0,0,0], "/":[1,2,2,4,8,8,16], "!":[4,4,4,4,4,0,4],
      " ":[0,0,0,0,0,0,0], "?":[14,17,1,2,4,0,4],
    };

    function drawText(text, x, y, size, ink) {
      context.fillStyle = color(ink);
      context.font = `${size}px "Segoe UI", Arial, sans-serif`;
      context.textBaseline = "top";
      context.fillText(String(text), x, y);
    }

    function write(text, x, y, size, ...ink) {
      const cell = Math.max(2, Math.floor(size / 7));
      const originX = x;
      let penX = x;
      let penY = y;
      context.fillStyle = color(ink);
      for (const rawCharacter of String(text)) {
        if (rawCharacter === "\n") {
          penX = originX;
          penY += cell * 9;
          continue;
        }
        const rows = blockGlyphs[rawCharacter.toUpperCase()] || blockGlyphs["?"];
        for (let row = 0; row < 7; row++) {
          for (let column = 0; column < 5; column++) {
            if (!(rows[row] & (1 << (4 - column)))) continue;
            context.fillRect(penX + column * cell, penY + row * cell,
              Math.max(1, cell - 1), Math.max(1, cell - 1));
          }
        }
        penX += cell * 6;
      }
    }

    function systemWrite(text, x, y, size, ...ink) {
      drawText(text, x, y, size, ink);
    }

    function comicWrite(text, x, y, size, ...ink) {
      context.fillStyle = color(ink);
      context.font = `${size}px "Comic Relief", "Comic Sans MS", Arial, sans-serif`;
      context.textBaseline = "top";
      const lines = String(text).split("\n");
      for (let index = 0; index < lines.length; index++)
        context.fillText(lines[index], x, y + index * size * 1.15);
    }

    let clientErrorReportStatus = "";
    let clientErrorSequence = 0;
    const errorReportDelay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    async function postClientError(message) {
      const sequence = ++clientErrorSequence;
      const pieceId = `web-oskiewar-${Date.now()}-${sequence}`;
      let data;
      try { data = JSON.parse(String(message)); }
      catch { data = { message: String(message), stack: null }; }
      for (let attempt = 0; ; attempt++) {
        clientErrorReportStatus = `${attempt ? "retrying server post" : "posting to server"} ${pieceId}`;
        try {
          const response = await fetch("/api/piece-log", {
            method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ pieceId, phase: "error",
              meta: { slug: "oskiewar", host: location.host,
                platform: capabilities().platform, build: "cross-platform" },
              data }),
          });
          if (response.ok) {
            clientErrorReportStatus = `posted to server ${pieceId}`;
            return;
          }
        } catch {}
        clientErrorReportStatus = `retrying server post ${pieceId}`;
        await errorReportDelay(Math.min(30000, 750 * 2 ** Math.min(attempt, 5)));
      }
    }

    let simulationMonotonicMs = null;
    let lastSimulationMonotonicMs = null;
    function runtime() {
      return { monotonicUs: (simulationMonotonicMs ?? performance.now()) * 1000,
        simMonotonicUs: (simulationMonotonicMs ?? lastSimulationMonotonicMs ??
          performance.now()) * 1000,
        unixMs: Date.now(),
        audioLatencyMs: audioContext?.baseLatency ? audioContext.baseLatency * 1000 : 0,
        frameRate: 60, clientErrorReportStatus };
    }
    function telemetry(kind, message) {
      console.debug(kind, message);
      if (kind === "CLIENT_ERROR" && !clientErrorReportStatus) {
        clientErrorReportStatus = "queued for server";
        void postClientError(message);
      }
    }

    // Browsers hand out gamepad indices however they please and reuse freed
    // slots, so a seat is claimed on arrival and held until that exact pad
    // leaves. Player one never gets bumped when player two plugs in.
    const padSeats = [null, null];
    let sampledPads = [null, null];
    let oddPads = [];

    // The W3C standard layout. It only describes a pad that says it speaks
    // standard; anything else arranges its buttons its own way, and a guess
    // there hands the fighter the wrong punch.
    const padButtons = ["A", "B", "X", "Y", "LeftShoulder", "RightShoulder",
      "LeftTrigger", "RightTrigger", "View", "Menu", "LeftStick", "RightStick",
      "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];

    // Six and seven used to be nameless, because the triggers are analog and
    // the game reads them as `leftTrigger`/`rightTrigger` instead. Nothing in
    // the fight ever read those, so on a small pad — the 8BitDo Micro, whose
    // L2 and R2 are ordinary digital shoulders — two buttons did nothing at
    // all. They are aliases, not a new vocabulary: the triggers raise the same
    // attacks as the face buttons, which also means holding both is the A+X
    // grab chord without reaching across the pad.
    const padAliases = { LeftTrigger: "A", RightTrigger: "X" };

    // A digital trigger reports `pressed`; an analog one on a pad that never
    // latches only moves `value`. Half travel is a press either way.
    const padDown = (button) => button.pressed || button.value > .5;

    // Chrome only stamps `mapping: "standard"` on pads it recognizes by name,
    // and it does not recognize every pad that is nevertheless wired in the
    // standard order. Refusing those outright is what made an 8BitDo read as
    // no pad at all -- the trigger mapping below never got a chance to run.
    // A narrow table of known ids is a knowable layout rather than a guess,
    // and it still demands the button and axis count the layout implies.
    // Anything not on the table keeps going to oddPads, where the HUD names it.
    const knownStandardPads = [/8bitdo/i, /vendor:\s*2dc8/i, /\b2dc8\b/i];
    const standardLayout = (pad) => pad.mapping === "standard" ||
      (knownStandardPads.some((known) => known.test(pad.id || "")) &&
        (pad.buttons?.length || 0) >= 8 && (pad.axes?.length || 0) >= 2);

    function scanPads() {
      const live = [];
      oddPads = [];
      for (const pad of navigator.getGamepads?.() || []) {
        if (!pad || pad.connected === false) continue;
        if (standardLayout(pad)) live.push(pad);
        else oddPads.push(pad.id || `gamepad ${pad.index}`);
      }
      const present = (padIndex) => live.some((pad) => pad.index === padIndex);
      for (let seat = 0; seat < padSeats.length; seat++)
        if (padSeats[seat] !== null && !present(padSeats[seat]))
          padSeats[seat] = null;
      for (const pad of live) {
        if (padSeats.includes(pad.index)) continue;
        const seat = padSeats.indexOf(null);
        if (seat < 0) break;
        padSeats[seat] = pad.index;
      }
      return live;
    }

    function seatedPad(seat, live) {
      const padIndex = padSeats[seat];
      return padIndex === null ? null
        : live.find((pad) => pad.index === padIndex) || null;
    }

    function readBrowserPad(seat, live = scanPads()) {
      const source = seatedPad(seat, live);
      const down = new Set(keys[seat]);
      if (source) source.buttons.forEach((button, buttonIndex) => {
        const name = padButtons[buttonIndex];
        if (!name || !padDown(button)) return;
        down.add(name);
        if (padAliases[name]) down.add(padAliases[name]);
      });
      return {
        connected: Boolean(source) || down.size > 0 || seat === 0,
        down: [...down],
        // Sticks stay raw. `quantizedInput` gates at .48, the same number the
        // console reads, so a deadzone here would only stack onto that one.
        leftX: source?.axes?.[0] || 0,
        leftY: -(source?.axes?.[1] || 0),
        rightX: source?.axes?.[2] || 0,

        rightTrigger: source?.buttons?.[7]?.value || 0,

    function sampleGamepads() {

    let dummyPops = null;

        colorScheme: matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark",

        // Offline replay burns ask the game for world pixels only. This is a

        replayOven,

        reelHud,

    async function readLocalCountry() {

          cache: "no-store", credentials: "omit",

        return;

        filter.frequency.setValueAtTime(550, now);
        filter.frequency.exponentialRampToValueAtTime(4200, now + .22);
        filter.Q.value = .7;
        envelope.gain.setValueAtTime(.001, now);
        envelope.gain.exponentialRampToValueAtTime(.72, now + .04);
        envelope.gain.exponentialRampToValueAtTime(.001, now + .34);
        noise.connect(filter).connect(envelope).connect(output);
        noise.start(now); noise.stop(now + .34);
      } else if (name === "block") {
        const oscillator = ac.createOscillator();
        const envelope = ac.createGain();
        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(205, now);
        envelope.gain.setValueAtTime(0.75, now);
        envelope.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        oscillator.connect(envelope).connect(output);
        oscillator.start(now); oscillator.stop(now + 0.1);
      } else {
        const duration = name === "hat" ? 0.07 : name === "clap" ? 0.16 : 0.2;
        const noise = noiseSource(ac, duration);
        const filter = ac.createBiquadFilter();
        const envelope = ac.createGain();
        filter.type = name === "hat" ? "highpass" : "bandpass";
        filter.frequency.value = name === "hat" ? 6500 : 1700;
        filter.Q.value = name === "hat" ? 0.7 : 0.9;
        envelope.gain.setValueAtTime(0.9, now);
        envelope.gain.exponentialRampToValueAtTime(0.001, now + duration);
        noise.connect(filter).connect(envelope).connect(output);
        noise.start(now); noise.stop(now + duration);

    async function readDummyPops() {
      if (socialPreview) return;
      try {
        const response = await fetch(popsEndpoint, { cache: "no-store" });
        if (!response.ok) return;
        const body = await response.json();
        if (Number.isFinite(body?.pops) && Number.isFinite(body?.hours))
          dummyPops = { pops: body.pops, hours: body.hours };
      } catch {}
    }

    // Reporting is fire-and-forget: a pop that does not reach the counter is
    // worth less than a frame spent waiting on it. The local tally moves
    // straight away so the number you just earned is on screen when the round
    // hands you back to the title.
    function reportDummyPop() {
      if (socialPreview) return;
      if (dummyPops) dummyPops = { ...dummyPops, pops: dummyPops.pops + 1 };
      fetch(popsEndpoint, { method: "POST", keepalive: true,
        headers: { "content-type": "application/json" }, body: "{}" })
        .catch(() => {});
    }

    function gameSignal(event, player = -1, value = 0, value2 = 0) {
      if (event === "dummy-popped") reportDummyPop();
      dispatchEvent(new CustomEvent("oskiewar:signal", {
        detail: { event, player, value, value2, at: performance.now() },
      }));
    }

    async function saveReplay(payload) {
      try {
        const response = await fetch("https://aesthetic.computer/api/oskiewar-replays?surface=web", {
          method: "POST", headers: { "content-type": "application/json" }, body: payload,
        });
        if (!response.ok) throw new Error(`upload returned ${response.status}`);

      } catch (error) {

    const liveSockets = new Map();

      let retiresRoom = false;
      try { retiresRoom = Boolean(JSON.parse(payload).nextRoundId); } catch {}

        const socket = new WebSocket(`wss://session-server.aesthetic.computer/oskiewar-live?match=${encodeURIComponent(matchId)}&role=publisher&surface=web`);
        state = { socket, pending: payload, retire: retiresRoom };
        liveSockets.set(matchId, state);
        socket.addEventListener("open", () => {
          if (state.pending) socket.send(JSON.stringify({ type: "oskiewar:state",
            content: JSON.parse(state.pending) }));
          state.pending = "";
          if (state.retire) setTimeout(() => socket.close(1000, "next round"), 0);
        });
        socket.addEventListener("close", () => liveSockets.delete(matchId));

      state.retire ||= retiresRoom;
      if (state.socket.readyState === WebSocket.OPEN) {
        state.socket.send(JSON.stringify({ type: "oskiewar:state", content: JSON.parse(payload) }));
        if (state.retire) setTimeout(() => state.socket.close(1000, "next round"), 0);

    }

    function ac() {
      const player = accountProfile.handle ? accountProfile : {
        handle: "", colors: [[72,176,156],[118,214,188],
          [54,128,168],[230,205,92]], anonymous: true,
      };

        handle: accountProfile.handle, colors: accountProfile.colors,
      }] : [], player, moodHandle: "", mood: "", source: "web-auth" };

    addEventListener("keydown", (event) => {

      const mapped = keyMap.get(event.code);
      if (!mapped) {
        if (tapTitle()) event.preventDefault();
        return;

      globalThis.__oskiewarSfx?.unlock().catch(() => {});

      const bounds = canvas.getBoundingClientRect();

      // must land here too or the drawing and the hit test come apart.
      const cy = logicalHeight - 140 - logicalInset.bottom;

        [130 + logicalInset.left, [[0, -1, "ArrowUp"], [0, 1, "ArrowDown"],
          [-1, 0, "ArrowLeft"], [1, 0, "ArrowRight"]]],
        [logicalWidth - 130 - logicalInset.right, [[0, -1, "Y"], [0, 1, "A"],
          [-1, 0, "X"], [1, 0, "B"]]],

        event.preventDefault();
        dismissTitle();
        canvas.setPointerCapture?.(event.pointerId);
        touchPointers.set(event.pointerId, { key: touchKey });

          point.y >= updateButton.y && point.y <= updateButton.y + updateButton.height) {

      // Title interaction returns above, so starting the game never spends or
      // fires an item on the same click.
      if (!touchEnabled && event.button === 0 &&

      runtime, gamepad, controllers, capabilities, telemetry, gameSignal,

        loadedVersion = responseVersion(response);
        source = await response.text();
        setInterval(checkForUpdate, 2000);
      }
      const piece = new Function(
        "runtime", "gamepad", "controllers", "capabilities", "telemetry",
        "gameSignal", "saveReplay", "publishLive", "analytics", "ac", "drum", "wipe", "box",
        "line", "triangle", "write", "systemWrite", "comicWrite", "gameView",
        `${source}\nreturn { boot, sim, paint };`
      )(...["runtime", "gamepad", "controllers", "capabilities", "telemetry",
        "gameSignal", "saveReplay", "publishLive", "analytics", "ac", "drum", "wipe", "box",
        "line", "triangle", "write", "systemWrite", "comicWrite", "gameView"]
        .map((name) => globalThis.__fightHost[name]));
      piece.boot();
      // The tally is a title-screen ornament, so it is fetched alongside the
      // first frame rather than gating it, and refreshed slowly — the count
      // only has to be roughly true, and the local bump already covers the
      // pop you just earned.
      readDummyPops();
      if (!socialPreview) readLocalCountry();
      if (!socialPreview) setInterval(readDummyPops, 120000);
      let selectionHoverSoundKey = "";
      let titleHoverSoundKey = "";
      let previousPieceScreen = "title";
      const tabTitles = ["oskiewar", "oskie war", "os ki ewar", "osk ie war",
        "o skie war", "oskie w ar"];
      let previousTabTitle = -1;
      const syncTabTitle = () => {
        const index = Math.floor(performance.now() / 1250) % tabTitles.length;
        if (index === previousTabTitle) return;
        previousTabTitle = index;
        document.title = tabTitles[index];
      };
      const syncSelectionCursor = () => {
        const pieceScreen = globalThis.__oskiewarTouch?.screen || "";
        if (pieceScreen === "title" && previousPieceScreen !== "title") {
          if (updateAvailable) {
            document.querySelector("#status").textContent = "updating";
            location.reload();
            return;
          }
          titleOpen = true;
          document.body.classList.add("title-open");
        }
        // The title is a live round now, so leaving it is not always an
        // explicit dismiss. Follow the piece instead of waiting to be told,
        // or the account controls hang over a fight nobody wants them in.
        else if (pieceScreen && pieceScreen !== "title" && titleOpen)
          dismissTitle();
        previousPieceScreen = pieceScreen;
        const hover = globalThis.__oskiewarTouch?.hover || null;
        const titleHover = globalThis.__oskiewarTouch?.titleHover === true;
        // A letter of the wordmark is a thing you can grab, so say so.
        const titleGlyph = globalThis.__oskiewarTouch?.titleGlyph ?? -1;
        document.body.classList.toggle("selection-hover",
          Boolean(hover) || titleHover || titleGlyph >= 0);
        const key = hover ? [hover.back ? "back" : "", hover.option ?? ""].join(":") : "";
        if (key && key !== selectionHoverSoundKey && !titleOpen)
          oskiewarSfx.drum("hat", .26, 0);
        selectionHoverSoundKey = key;
        // The title's start word and grabbable wordmark letters tick on
        // approach like everything else — they were the one silent hover.
        const titleKey = titleHover ? "start"
          : titleGlyph >= 0 ? "glyph:" + titleGlyph : "";
        if (titleKey && titleKey !== titleHoverSoundKey)
          oskiewarSfx.drum("hat", .26, 0);
        titleHoverSoundKey = titleKey;
      };
      const driver = createFrameDriver({
        sample: globalThis.__fightHost.sampleInput,
        simulate(simulationAt) {
          simulationMonotonicMs = simulationAt;
          lastSimulationMonotonicMs = simulationAt;
          try { piece.sim(); }
          finally { simulationMonotonicMs = null; }
        },
        paint() {
          piece.paint();
          syncTabTitle();
          syncSelectionCursor();
        },
      });
      globalThis.__oskiewarFrameStats = driver.stats;
      const offlineRender = new URLSearchParams(location.search).has("offline-render");
      if (offlineRender) {
        globalThis.__oskiewarOfflineStep = () => driver.stepOffline();
        globalThis.__oskiewarOfflineReady = true;
      }
      addEventListener("visibilitychange", () =>
        driver.setVisible(document.visibilityState === "visible"));
      addEventListener("pointermove", syncSelectionCursor, { passive: true });
      addEventListener("pointerleave", () =>
        document.body.classList.remove("selection-hover"), { passive: true });
      if (!offlineRender) driver.start();
    }
    start().catch((error) => {
      console.error(error);
      document.querySelector("#status").textContent = `TEST ERROR: ${error.message}`;
    });
  </script>
</body>
</html>
