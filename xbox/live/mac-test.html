<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>oskiewar</title>
  <meta name="description" content="Play oskiewar in your browser with a keyboard or two gamepads.">
  <meta name="theme-color" content="#ebf1f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07081c" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="oskiewar">
  <meta property="og:description" content="pick a pal. pick a fight.">
  <meta property="og:image" content="https://oskiewar.com/social/oskiewar-title.jpg">
  <meta property="og:image:secure_url" content="https://oskiewar.com/social/oskiewar-title.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="the multicolor oskiewar title screen">
  <meta property="og:video" content="https://oskiewar.com/social/oskiewar-title.mp4">
  <meta property="og:video:secure_url" content="https://oskiewar.com/social/oskiewar-title.mp4">
  <meta property="og:video:type" content="video/mp4">
  <meta property="og:video:width" content="720">
  <meta property="og:video:height" content="1280">
  <meta property="og:url" content="https://oskiewar.com/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="oskiewar">
  <meta name="twitter:image" content="https://oskiewar.com/social/oskiewar-title.jpg">
  <style>
    @font-face {
      font-family: "Comic Relief";
      src: url("./ComicRelief-Regular.ttf") format("truetype"),
        url("https://papers.aesthetic.computer/foundry/fonts/ComicRelief-Regular.ttf") format("truetype");
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07081c; }
    @media (prefers-color-scheme: light) { html, body { background: #ebf1f8; } }
    @supports (height: 100dvh) { html, body { height: 100dvh; } }
    body { display: grid; place-items: center; font-family: "Comic Relief", "Comic Sans MS", Arial, sans-serif;
      cursor: url("/aesthetic.computer/cursors/precise.svg") 12 12, auto; }
    body.selection-hover {
      cursor: url("/aesthetic.computer/cursors/active.svg") 12 12, pointer; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh;
      min-width: 0; min-height: 0; display: block; cursor: inherit; }
    @supports (height: 100dvh) { canvas { height: 100dvh; } }
    button, input, label { cursor: inherit; }
    button:hover, input:hover, label:hover {
      cursor: url("/aesthetic.computer/cursors/active.svg") 12 12, pointer; }
    #status { position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap; }
    #update-ready { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 6; display: none; transform: translateX(-50%); padding: 10px 14px;
      border: 2px solid #f3f6ff; border-radius: 999px; background: #10172c;
      color: #f3f6ff; font: 700 18px/1.1 "Comic Relief", "Comic Sans MS", Arial, sans-serif;
      box-shadow: 0 4px 0 rgba(4, 7, 18, .55); white-space: nowrap;
      align-items: center; gap: 6px; }
    #update-ready.visible { display: flex; }
    #update-now { appearance: none; margin: 0; padding: 0; border: 0;
      background: transparent; color: inherit; font: inherit; }
    #update-now:active { transform: translateY(2px); }
    #auto-update-label { display: flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 400; }
    #auto-update { width: 16px; height: 16px; margin: 0; accent-color: #ff5070; }
    /* Scoring from a DAW is anonymous dummy play, so the account door is shut
       and the corner it occupied is free for the midi lamp. */
    body.midi-out #logout { display: none; }
    #midi-out { position: fixed; top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right)); z-index: 6; display: none;
      padding: 6px 8px; border: 2px solid #6e768d; border-radius: 8px;
      background: #171b28; box-shadow: 2px 3px 0 rgba(20, 25, 38, .35);
      line-height: 0; }
    body.midi-out #midi-out { display: block; }
    body.social-preview #midi-out { display: none; }
    #midi-out .key-white { fill: #b0b8ca; transition: fill .18s ease-out; }
    #midi-out .key-black { fill: #171b28; }
    /* The lamp answers every note that leaves, so the corner is also the
       cheapest possible confirmation that the bridge is really sending. */
    #midi-out.lit .key-white { fill: #6cf0a8; transition: none; }
    #touch-controls { --unit: clamp(50px, 12vmin, 72px); --gap: 6px;
      position: fixed; inset: 0; z-index: 3; display: none; pointer-events: none;
      user-select: none; -webkit-user-select: none; touch-action: none; }
    body.touch-enabled #touch-controls { display: block; }
    .touch-cluster { position: absolute; display: grid;
      grid-template: repeat(3, var(--unit)) / repeat(3, var(--unit));
      gap: var(--gap); pointer-events: none; }
    #touch-dpad { left: max(12px, env(safe-area-inset-left));
      bottom: max(12px, env(safe-area-inset-bottom)); }
    #touch-actions { right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom)); }
    .touch-button { appearance: none; -webkit-appearance: none;
      min-width: 0; min-height: 0; margin: 0; padding: 0;
      border: 2px solid rgba(236, 242, 255, .72); border-radius: 50%;
      background: rgba(8, 14, 34, .42); color: #f3f6ff;
      font: 700 clamp(20px, 5vmin, 32px)/1 "Comic Relief", "Comic Sans MS", Arial, sans-serif;
      text-transform: lowercase; text-shadow: 2px 3px 0 #080c18;
      box-shadow: 0 3px 0 rgba(4, 7, 18, .65); pointer-events: auto;
      touch-action: none; }
    .touch-button[aria-pressed="true"] { background: rgba(255, 80, 112, .76);
      transform: translateY(2px); box-shadow: 0 1px 0 rgba(4, 7, 18, .65); }
    .touch-up, .touch-y { grid-area: 1 / 2; }
    .touch-left, .touch-x { grid-area: 2 / 1; }
    .touch-right, .touch-b { grid-area: 2 / 3; }
    .touch-down, .touch-a { grid-area: 3 / 2; }
    #touch-system { position: absolute; left: 50%;
      bottom: calc(max(12px, env(safe-area-inset-bottom)) + var(--unit) * 2.35);
      transform: translateX(-50%); display: flex; gap: 8px; pointer-events: none; }
    #touch-system .touch-button { width: calc(var(--unit) * 1.2);
      height: calc(var(--unit) * .55); border-radius: 999px; font-size: 14px; }
    @media (max-height: 500px) {
      #touch-controls { --unit: clamp(44px, 15vh, 58px); }
      .touch-button { border-width: 1px; }
    }
  </style>
</head>
<body>
  <canvas id="screen" width="1920" height="1080" aria-label="oskiewar two-player stick fight"></canvas>
  <div id="status" role="alert" aria-live="polite"></div>
  <div id="midi-out" role="status" aria-label="midi out is on" title="midi out">
    <svg width="26" height="18" viewBox="0 0 26 18" aria-hidden="true">
      <rect class="key-white" x="0" y="0" width="26" height="18" rx="2"/>
      <rect class="key-black" x="3.5" y="0" width="2.6" height="11" rx="1"/>
      <rect class="key-black" x="9.1" y="0" width="2.6" height="11" rx="1"/>
      <rect class="key-black" x="17" y="0" width="2.6" height="11" rx="1"/>
      <rect class="key-black" x="21.4" y="0" width="2.6" height="11" rx="1"/>
      <rect class="key-black" x="7.4" y="11" width="1.1" height="7"/>
      <rect class="key-black" x="14.6" y="0" width="1.1" height="18"/>
      <rect class="key-black" x="20" y="11" width="1.1" height="7"/>
    </svg>
  </div>
  <div id="update-ready" role="status">
    <button id="update-now" type="button">update is ready</button>
    <label id="auto-update-label"><input id="auto-update" type="checkbox">auto update</label>
  </div>
  <div id="touch-controls" aria-label="touch controls">
    <div id="touch-dpad" class="touch-cluster" role="group" aria-label="movement">
      <button class="touch-button touch-up" data-key="ArrowUp" aria-label="jump" aria-pressed="false">↑</button>
      <button class="touch-button touch-left" data-key="ArrowLeft" aria-label="left" aria-pressed="false">←</button>
      <button class="touch-button touch-right" data-key="ArrowRight" aria-label="right" aria-pressed="false">→</button>
      <button class="touch-button touch-down" data-key="ArrowDown" aria-label="down" aria-pressed="false">↓</button>
    </div>
    <div id="touch-actions" class="touch-cluster" role="group" aria-label="actions">
      <button class="touch-button touch-y" data-key="Y" aria-label="use item" aria-pressed="false">y</button>
      <button class="touch-button touch-x" data-key="X" aria-label="punch, or swing what you hold" aria-pressed="false">x</button>
      <button class="touch-button touch-b" data-key="B" aria-label="shield" aria-pressed="false">b</button>
      <button class="touch-button touch-a" data-key="A" aria-label="kick" aria-pressed="false">a</button>
    </div>
    <div id="touch-system" role="group" aria-label="system controls">
      <button class="touch-button" data-key="View" aria-label="view" aria-pressed="false">view</button>
      <button class="touch-button" data-key="Menu" aria-label="menu" aria-pressed="false">menu</button>
    </div>
  </div>

  <script>
    const canvas = document.querySelector("#screen");
    const context = canvas.getContext("2d");
    const keys = [new Set(), new Set()];
    const touchControls = document.querySelector("#touch-controls");
    const touchPointers = new Map();
    const selectTaps = [];
    globalThis.__oskiewarTouch = { taps: selectTaps,
      pointer: { x: 0, y: 0, active: false } };
    const touchEnabled = new URLSearchParams(location.search).has("touch") ||
      navigator.maxTouchPoints > 0 || matchMedia("(pointer: coarse)").matches;
    document.body.classList.toggle("touch-enabled", touchEnabled);
    document.body.classList.add("title-open");
    let titleOpen = true;
    const keyMap = new Map([
      ["KeyW", [0, "ArrowUp"]], ["KeyS", [0, "ArrowDown"]],
      ["KeyA", [0, "ArrowLeft"]], ["KeyD", [0, "ArrowRight"]],
      ["Space", [0, "A"]], ["KeyB", [0, "X"]],
      ["KeyF", [0, "A"]], ["KeyG", [0, "B"]], ["KeyH", [0, "X"]],
      ["KeyV", [0, "Y"]], ["KeyR", [0, "Y"]],
      ["Escape", [0, "B"]], ["Backspace", [0, "B"]],
      ["Tab", [0, "View"]], ["KeyQ", [0, "View"]],
      ["Enter", [0, "Menu"]],
      ["ArrowUp", [1, "ArrowUp"]], ["ArrowDown", [1, "ArrowDown"]],
      ["ArrowLeft", [1, "ArrowLeft"]], ["ArrowRight", [1, "ArrowRight"]],
      ["KeyK", [1, "A"]], ["KeyL", [1, "B"]], ["Semicolon", [1, "X"]],
      ["Quote", [1, "Y"]],
    ]);
    let audioContext = null;

    // Keep a stable 1080-unit vertical coordinate system while allowing the
    // horizontal game surface to follow the browser's actual aspect ratio.
    // 16:9 therefore remains exactly 1920x1080, while 9:16 becomes 608x1080
    // instead of a letterboxed landscape image.
    function resizeCanvas() {
      const bounds = canvas.getBoundingClientRect();
      const width = Math.max(1, bounds.width);
      const height = Math.max(1, bounds.height);
      const logicalHeight = 1080;
      const logicalWidth = Math.max(480, Math.min(2880,
        Math.round(logicalHeight * width / height)));
      if (canvas.width !== logicalWidth) canvas.width = logicalWidth;
      if (canvas.height !== logicalHeight) canvas.height = logicalHeight;
    }
    resizeCanvas();
    addEventListener("resize", resizeCanvas, { passive: true });
    window.visualViewport?.addEventListener("resize", resizeCanvas,
      { passive: true });
    if (typeof ResizeObserver === "function")
      new ResizeObserver(resizeCanvas).observe(document.documentElement);

    function gameView() {
      return { width: canvas.width, height: canvas.height,
        aspect: canvas.width / canvas.height,
        orientation: canvas.width < canvas.height ? "portrait" : "landscape" };
    }

    function ensureAudio() {
      if (!audioContext) audioContext = new AudioContext();
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    // Cached ElevenLabs male:3 rendition of "Oskie War". Separate media
    // elements create a compact feedback echo without requiring cross-origin
    // Web Audio access to the public AC audio CDN.
    const titleVoiceUrl = "https://art.aesthetic.computer/tts-cache/f9af6e0d19a4896793f66cd146d9a72e4160cdab9b85ef35c15a707e52c2d2ba.mp3";
    const titleVoiceEchoes = [1, .3, .12].map((volume) => {
      const voice = new Audio(titleVoiceUrl);
      voice.preload = "auto";
      voice.volume = volume;
      return voice;
    });
    function titleVoice() {
      for (const [index, voice] of titleVoiceEchoes.entries()) {
        setTimeout(() => {
          voice.currentTime = 0;
          voice.play().catch(() => {});
        }, index * 155);
      }
    }

    function titleBeep() {
      const ac = ensureAudio();
      const now = ac.currentTime;
      const oscillator = ac.createOscillator();
      const envelope = ac.createGain();
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(620, now);
      oscillator.frequency.exponentialRampToValueAtTime(930, now + .1);
      envelope.gain.setValueAtTime(.28, now);
      envelope.gain.exponentialRampToValueAtTime(.001, now + .13);
      oscillator.connect(envelope).connect(ac.destination);
      oscillator.start(now);
      oscillator.stop(now + .14);
    }

    function dismissTitle() {
      if (!titleOpen) return false;
      titleOpen = false;
      document.body.classList.remove("title-open");
      return true;
    }

    function tapTitle(point = null) {
      if (!titleOpen) return false;
      const button = globalThis.__oskiewarTouch?.titleButton;
      const inside = !point || button && point.x >= button.x &&
        point.x <= button.x + button.width && point.y >= button.y &&
        point.y <= button.y + button.height;
      if (!inside) {
        ensureAudio();
        drum("block", .32, 0);
        return true;
      }
      dismissTitle();
      keys[0].add("A");
      ensureAudio();
      globalThis.__oskiewarSfx?.unlock().catch(() => {});
      setTimeout(() => keys[0].delete("A"), 90);
      return true;
    }

    function color(values) {
      const [r = 255, g = 255, b = 255, a = 255] = values;
      return `rgba(${r}, ${g}, ${b}, ${a / 255})`;
    }

    function wipe(...ink) {
      context.fillStyle = color(ink);
      context.fillRect(0, 0, canvas.width, canvas.height);
    }

    function box(x, y, width, height, ...ink) {
      context.fillStyle = color(ink);
      context.fillRect(x, y, width, height);
    }

    function line(x1, y1, x2, y2, width, ...ink) {
      context.strokeStyle = color(ink);
      context.lineWidth = width;
      context.lineCap = "round";
      context.beginPath();
      context.moveTo(x1, y1);
      context.lineTo(x2, y2);
      context.stroke();
    }

    function triangle(x1, y1, x2, y2, x3, y3, ...ink) {
      context.fillStyle = color(ink);
      context.beginPath();
      context.moveTo(x1, y1);
      context.lineTo(x2, y2);
      context.lineTo(x3, y3);
      context.closePath();
      context.fill();
    }

    const blockGlyphs = {
      A:[14,17,17,31,17,17,17], B:[30,17,17,30,17,17,30], C:[14,17,16,16,16,17,14],
      D:[30,17,17,17,17,17,30], E:[31,16,16,30,16,16,31], F:[31,16,16,30,16,16,16],
      G:[14,17,16,23,17,17,15], H:[17,17,17,31,17,17,17], I:[31,4,4,4,4,4,31],
      J:[7,2,2,2,18,18,12], K:[17,18,20,24,20,18,17], L:[16,16,16,16,16,16,31],
      M:[17,27,21,21,17,17,17], N:[17,25,21,19,17,17,17], O:[14,17,17,17,17,17,14],
      P:[30,17,17,30,16,16,16], Q:[14,17,17,17,21,18,13], R:[30,17,17,30,20,18,17],
      S:[15,16,16,14,1,1,30], T:[31,4,4,4,4,4,4], U:[17,17,17,17,17,17,14],
      V:[17,17,17,17,17,10,4], W:[17,17,17,21,21,21,10], X:[17,17,10,4,10,17,17],
      Y:[17,17,10,4,4,4,4], Z:[31,1,2,4,8,16,31],
      0:[14,17,19,21,25,17,14], 1:[4,12,4,4,4,4,14], 2:[14,17,1,2,4,8,31],
      3:[30,1,1,14,1,1,30], 4:[2,6,10,18,31,2,2], 5:[31,16,16,30,1,1,30],
      6:[14,16,16,30,17,17,14], 7:[31,1,2,4,8,8,8], 8:[14,17,17,14,17,17,14],
      9:[14,17,17,15,1,1,14], ".":[0,0,0,0,0,12,12], ":":[0,4,4,0,4,4,0],
      "-":[0,0,0,31,0,0,0], "/":[1,2,2,4,8,8,16], "!":[4,4,4,4,4,0,4],
      " ":[0,0,0,0,0,0,0], "?":[14,17,1,2,4,0,4],
    };

    function drawText(text, x, y, size, ink) {
      context.fillStyle = color(ink);
      context.font = `${size}px "Segoe UI", Arial, sans-serif`;
      context.textBaseline = "top";
      context.fillText(String(text), x, y);
    }

    function write(text, x, y, size, ...ink) {
      const cell = Math.max(2, Math.floor(size / 7));
      const originX = x;
      let penX = x;
      let penY = y;
      context.fillStyle = color(ink);
      for (const rawCharacter of String(text)) {
        if (rawCharacter === "\n") {
          penX = originX;
          penY += cell * 9;
          continue;
        }
        const rows = blockGlyphs[rawCharacter.toUpperCase()] || blockGlyphs["?"];
        for (let row = 0; row < 7; row++) {
          for (let column = 0; column < 5; column++) {
            if (!(rows[row] & (1 << (4 - column)))) continue;
            context.fillRect(penX + column * cell, penY + row * cell,
              Math.max(1, cell - 1), Math.max(1, cell - 1));
          }
        }
        penX += cell * 6;
      }
    }

    function systemWrite(text, x, y, size, ...ink) {
      drawText(text, x, y, size, ink);
    }

    function comicWrite(text, x, y, size, ...ink) {
      context.fillStyle = color(ink);
      context.font = `${size}px "Comic Relief", "Comic Sans MS", Arial, sans-serif`;
      context.textBaseline = "top";
      const lines = String(text).split("\n");
      for (let index = 0; index < lines.length; index++)
        context.fillText(lines[index], x, y + index * size * 1.15);
    }

    let clientErrorReportStatus = "";
    let clientErrorSequence = 0;
    const errorReportDelay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    async function postClientError(message) {
      const sequence = ++clientErrorSequence;
      const pieceId = `web-oskiewar-${Date.now()}-${sequence}`;
      let data;
      try { data = JSON.parse(String(message)); }
      catch { data = { message: String(message), stack: null }; }
      for (let attempt = 0; ; attempt++) {
        clientErrorReportStatus = `${attempt ? "retrying server post" : "posting to server"} ${pieceId}`;
        try {
          const response = await fetch("/api/piece-log", {
            method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ pieceId, phase: "error",
              meta: { slug: "oskiewar", host: location.host,
                platform: capabilities().platform, build: "cross-platform" },
              data }),
          });
          if (response.ok) {
            clientErrorReportStatus = `posted to server ${pieceId}`;
            return;
          }
        } catch {}
        clientErrorReportStatus = `retrying server post ${pieceId}`;
        await errorReportDelay(Math.min(30000, 750 * 2 ** Math.min(attempt, 5)));
      }
    }

    let simulationMonotonicMs = null;
    let lastSimulationMonotonicMs = null;
    function runtime() {
      return { monotonicUs: (simulationMonotonicMs ?? performance.now()) * 1000,
        simMonotonicUs: (simulationMonotonicMs ?? lastSimulationMonotonicMs ??
          performance.now()) * 1000,
        unixMs: Date.now(),
        audioLatencyMs: audioContext?.baseLatency ? audioContext.baseLatency * 1000 : 0,
        frameRate: 60, clientErrorReportStatus };
    }
    function telemetry(kind, message) {
      console.debug(kind, message);
      if (kind === "CLIENT_ERROR" && !clientErrorReportStatus) {
        clientErrorReportStatus = "queued for server";
        void postClientError(message);
      }
    }

    // Browsers hand out gamepad indices however they please and reuse freed
    // slots, so a seat is claimed on arrival and held until that exact pad
    // leaves. Player one never gets bumped when player two plugs in.
    const padSeats = [null, null];
    let sampledPads = [null, null];
    let oddPads = [];

    // The W3C standard layout. It only describes a pad that says it speaks
    // standard; anything else arranges its buttons its own way, and a guess
    // there hands the fighter the wrong punch.
    const padButtons = ["A", "B", "X", "Y", "LeftShoulder", "RightShoulder",
      null, null, "View", "Menu", "LeftStick", "RightStick",
      "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];

    function scanPads() {
      const live = [];
      oddPads = [];
      for (const pad of navigator.getGamepads?.() || []) {
        if (!pad || pad.connected === false) continue;
        if (pad.mapping === "standard") live.push(pad);
        else oddPads.push(pad.id || `gamepad ${pad.index}`);
      }
      const present = (padIndex) => live.some((pad) => pad.index === padIndex);
      for (let seat = 0; seat < padSeats.length; seat++)
        if (padSeats[seat] !== null && !present(padSeats[seat]))
          padSeats[seat] = null;
      for (const pad of live) {
        if (padSeats.includes(pad.index)) continue;
        const seat = padSeats.indexOf(null);
        if (seat < 0) break;
        padSeats[seat] = pad.index;
      }
      return live;
    }

    function seatedPad(seat, live) {
      const padIndex = padSeats[seat];
      return padIndex === null ? null
        : live.find((pad) => pad.index === padIndex) || null;
    }

    function readBrowserPad(seat, live = scanPads()) {
      const source = seatedPad(seat, live);
      const down = new Set(keys[seat]);
      if (source) source.buttons.forEach((button, buttonIndex) => {
        if (button.pressed && padButtons[buttonIndex])
          down.add(padButtons[buttonIndex]);
      });
      return {
        connected: Boolean(source) || down.size > 0 || seat === 0,
        down: [...down],
        // Sticks stay raw. `quantizedInput` gates at .48, the same number the
        // console reads, so a deadzone here would only stack onto that one.
        leftX: source?.axes?.[0] || 0,
        leftY: -(source?.axes?.[1] || 0),
        rightX: source?.axes?.[2] || 0,
        rightY: -(source?.axes?.[3] || 0),
        leftTrigger: source?.buttons?.[6]?.value || 0,
        rightTrigger: source?.buttons?.[7]?.value || 0,
      };
    }

    function sampleGamepads() {
      const live = scanPads();
      sampledPads = [readBrowserPad(0, live), readBrowserPad(1, live)];
    }

    function browserPad(index) {
      return sampledPads[index] || readBrowserPad(index);
    }
    function gamepad(index = 0) { return browserPad(index); }
    function controllers() {
      const live = scanPads();
      return [0, 1].map((index) => ({ index, connected: browserPad(index).connected,
        name: seatedPad(index, live)?.id || `KEYBOARD P${index + 1}`,
        standard: padSeats[index] !== null }));
    }
    function capabilities() {
      const mac = navigator.userAgent.includes("Mac");
      const hasGamepad = padSeats.some((padIndex) => padIndex !== null);
      return { platform: mac ? "macos" : "web",
        inputFamily: touchEnabled ? "touch" : hasGamepad ? "xbox" : "keyboard",
        colorScheme: matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark",
        socialPreview: new URLSearchParams(location.search).has("social-preview"),
        // Scoring sessions are anonymous dummy play; the seam auth attaches to
        // can read this to keep opponents and accounts out of the way.
        midi: document.body.classList.contains("midi-out"),
        productName: mac ? "MACOS" : "WEB",
        version: "CROSS-PLATFORM", graphics: "CANVAS2D", audio: "WEB AUDIO" };
    }

    // Chrome, Firefox and Safari all keep a pad out of `getGamepads` until
    // someone presses a button on it, and all three fire this at that press —
    // it is the first moment the legend can stop saying SPACE.
    function announcePads(arrived) {
      const line = document.querySelector("#status");
      if (oddPads.length) {
        line.textContent =
          `${oddPads[0]} reports a non-standard layout — use the keyboard`;
        return;
      }
      const seat = arrived ? padSeats.indexOf(arrived.index) : -1;
      line.textContent = seat >= 0 ? `gamepad ready for player ${seat + 1}`
        : `gamepads connected: ${padSeats.filter((at) => at !== null).length}`;
    }
    addEventListener("gamepadconnected", (event) => {
      scanPads();
      announcePads(event.gamepad);
    });
    addEventListener("gamepaddisconnected", () => {
      scanPads();
      announcePads(null);
    });
    scanPads();

    function noiseSource(ac, duration) {
      const buffer = ac.createBuffer(1, Math.ceil(ac.sampleRate * duration), ac.sampleRate);
      const channel = buffer.getChannelData(0);
      for (let i = 0; i < channel.length; i++) channel[i] = Math.random() * 2 - 1;
      const source = ac.createBufferSource();
      source.buffer = buffer;
      return source;
    }

    function drum(name, amount = 1, pan = 0) {
      // The signal-routed AC mock bank is primary after unlock. This legacy
      // inline kit remains the first-gesture/offline fallback.
      if (globalThis.__oskiewarSfx?.unlocked &&
          globalThis.__oskiewarSfx.drum(name, amount, pan)) return;
      const ac = ensureAudio();
      const now = ac.currentTime;
      const output = ac.createGain();
      const panner = ac.createStereoPanner();
      output.gain.value = Math.min(0.7, 0.42 * amount);
      panner.pan.value = Math.max(-1, Math.min(1, pan));
      output.connect(panner).connect(ac.destination);

      if (name === "kick") {
        const oscillator = ac.createOscillator();
        const envelope = ac.createGain();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(145, now);
        oscillator.frequency.exponentialRampToValueAtTime(43, now + 0.16);
        envelope.gain.setValueAtTime(1, now);
        envelope.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        oscillator.connect(envelope).connect(output);
        oscillator.start(now); oscillator.stop(now + 0.3);
      } else if (name === "bell") {
        for (const [frequency, gain, duration] of
          [[880, .72, .34], [1320, .38, .27], [1760, .2, .18]]) {
          const oscillator = ac.createOscillator();
          const envelope = ac.createGain();
          oscillator.type = frequency === 1760 ? "triangle" : "sine";
          oscillator.frequency.value = frequency;
          envelope.gain.setValueAtTime(gain, now);
          envelope.gain.exponentialRampToValueAtTime(0.001, now + duration);
          oscillator.connect(envelope).connect(output);
          oscillator.start(now); oscillator.stop(now + duration);
        }
      } else if (name === "modem") {
        // A tiny negotiated connection: three dry carrier chirps followed by
        // one settled tone. It is an upload receipt, not a victory fanfare.
        for (const [offset, frequency, duration, gain] of [
          [0, 1180, .055, .48], [.07, 1760, .045, .4],
          [.128, 980, .06, .44], [.205, 1420, .11, .28]]) {
          const oscillator = ac.createOscillator();
          const envelope = ac.createGain();
          oscillator.type = offset === .205 ? "sine" : "square";
          oscillator.frequency.setValueAtTime(frequency, now + offset);
          envelope.gain.setValueAtTime(.001, now + offset);
          envelope.gain.exponentialRampToValueAtTime(gain, now + offset + .008);
          envelope.gain.exponentialRampToValueAtTime(.001,
            now + offset + duration);
          oscillator.connect(envelope).connect(output);
          oscillator.start(now + offset);
          oscillator.stop(now + offset + duration);
        }
      } else if (name === "whoosh") {
        const noise = noiseSource(ac, .34);
        const filter = ac.createBiquadFilter();
        const envelope = ac.createGain();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(550, now);
        filter.frequency.exponentialRampToValueAtTime(4200, now + .22);
        filter.Q.value = .7;
        envelope.gain.setValueAtTime(.001, now);
        envelope.gain.exponentialRampToValueAtTime(.72, now + .04);
        envelope.gain.exponentialRampToValueAtTime(.001, now + .34);
        noise.connect(filter).connect(envelope).connect(output);
        noise.start(now); noise.stop(now + .34);
      } else if (name === "block") {
        const oscillator = ac.createOscillator();
        const envelope = ac.createGain();
        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(205, now);
        envelope.gain.setValueAtTime(0.75, now);
        envelope.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        oscillator.connect(envelope).connect(output);
        oscillator.start(now); oscillator.stop(now + 0.1);
      } else {
        const duration = name === "hat" ? 0.07 : name === "clap" ? 0.16 : 0.2;
        const noise = noiseSource(ac, duration);
        const filter = ac.createBiquadFilter();
        const envelope = ac.createGain();
        filter.type = name === "hat" ? "highpass" : "bandpass";
        filter.frequency.value = name === "hat" ? 6500 : 1700;
        filter.Q.value = name === "hat" ? 0.7 : 0.9;
        envelope.gain.setValueAtTime(0.9, now);
        envelope.gain.exponentialRampToValueAtTime(0.001, now + duration);
        noise.connect(filter).connect(envelope).connect(output);
        noise.start(now); noise.stop(now + duration);
      }
    }

    function gameSignal(event, player = -1, value = 0, value2 = 0) {
      dispatchEvent(new CustomEvent("oskiewar:signal", {
        detail: { event, player, value, value2, at: performance.now() },
      }));
    }

    async function saveReplay(payload) {
      try {
        const response = await fetch("https://aesthetic.computer/api/oskiewar-replays?surface=web", {
          method: "POST", headers: { "content-type": "application/json" }, body: payload,
        });
        if (!response.ok) throw new Error(`upload returned ${response.status}`);
        return true;
      } catch (error) {
        telemetry("REPLAY_WEB_ERROR", error.message);
        return false;
      }
    }

    const liveSockets = new Map();
    function publishLive(matchId, payload) {
      let retiresRoom = false;
      try { retiresRoom = Boolean(JSON.parse(payload).nextRoundId); } catch {}
      let state = liveSockets.get(matchId);
      if (!state) {
        const socket = new WebSocket(`wss://session-server.aesthetic.computer/oskiewar-live?match=${encodeURIComponent(matchId)}&role=publisher&surface=web`);
        state = { socket, pending: payload, retire: retiresRoom };
        liveSockets.set(matchId, state);
        socket.addEventListener("open", () => {
          if (state.pending) socket.send(JSON.stringify({ type: "oskiewar:state",
            content: JSON.parse(state.pending) }));
          state.pending = "";
          if (state.retire) setTimeout(() => socket.close(1000, "next round"), 0);
        });
        socket.addEventListener("close", () => liveSockets.delete(matchId));
        return;
      }
      state.retire ||= retiresRoom;
      if (state.socket.readyState === WebSocket.OPEN) {
        state.socket.send(JSON.stringify({ type: "oskiewar:state", content: JSON.parse(payload) }));
        if (state.retire) setTimeout(() => state.socket.close(1000, "next round"), 0);
      } else state.pending = payload;
    }

    function ac() {
      return { fighters: [], moodHandle: "", mood: "", source: "web-fallback" };
    }

    addEventListener("keydown", (event) => {
      const mapped = keyMap.get(event.code);
      if (!mapped) {
        if (tapTitle()) event.preventDefault();
        return;
      }
      event.preventDefault();
      dismissTitle();
      keys[mapped[0]].add(mapped[1]);
      ensureAudio();
      globalThis.__oskiewarSfx?.unlock().catch(() => {});
    });
    addEventListener("keyup", (event) => {
      const mapped = keyMap.get(event.code);
      if (!mapped) return;
      event.preventDefault();
      keys[mapped[0]].delete(mapped[1]);
    });
    function releaseTouch(pointerId) {
      const active = touchPointers.get(pointerId);
      if (!active) return;
      touchPointers.delete(pointerId);
      active.button.setAttribute("aria-pressed", "false");
      if (![...touchPointers.values()].some((item) => item.key === active.key))
        keys[0].delete(active.key);
    }
    touchControls.addEventListener("pointerdown", (event) => {
      const button = event.target.closest("button[data-key]");
      if (!button) return;
      event.preventDefault();
      dismissTitle();
      button.setPointerCapture?.(event.pointerId);
      const key = button.dataset.key;
      touchPointers.set(event.pointerId, { button, key });
      button.setAttribute("aria-pressed", "true");
      keys[0].add(key);
      ensureAudio();
      globalThis.__oskiewarSfx?.unlock().catch(() => {});
    });
    for (const type of ["pointerup", "pointercancel", "lostpointercapture"])
      touchControls.addEventListener(type, (event) => releaseTouch(event.pointerId));
    touchControls.addEventListener("contextmenu", (event) => event.preventDefault());
    function canvasPoint(event) {
      const bounds = canvas.getBoundingClientRect();
      return { x: (event.clientX - bounds.left) * canvas.width / bounds.width,
        y: (event.clientY - bounds.top) * canvas.height / bounds.height };
    }
    canvas.addEventListener("pointermove", (event) => {
      Object.assign(globalThis.__oskiewarTouch.pointer,
        canvasPoint(event), { active: true });
    });
    canvas.addEventListener("pointerleave", () => {
      globalThis.__oskiewarTouch.pointer.active = false;
    });
    canvas.addEventListener("pointerdown", (event) => {
      const point = canvasPoint(event);
      if (tapTitle(point)) {
        event.preventDefault();
        return;
      }
      Object.assign(globalThis.__oskiewarTouch.pointer, point, { active: true });
      selectTaps.push(point);
      ensureAudio();
      globalThis.__oskiewarSfx?.unlock().catch(() => {});
      event.preventDefault();
    });
    addEventListener("blur", () => {
      keys.forEach((held) => held.clear());
      for (const pointerId of touchPointers.keys()) releaseTouch(pointerId);
    });
    globalThis.__fightHost = {
      runtime, gamepad, controllers, capabilities, telemetry, gameSignal,
      sampleInput: sampleGamepads,
      saveReplay, publishLive, ac, drum, wipe, box, line, triangle,
      write, systemWrite, comicWrite, gameView,
    };
  </script>
  <script type="module">
    import createOskiewarSfx from "/oskiewar-sfx.mjs";
    import createOskiewarMidi from "/oskiewar-midi.mjs";
    import createFrameDriver from "/frame-driver.mjs";
    import { qrcode } from "/aesthetic.computer/dep/@akamfoad/qr/qr.mjs";
    import {
      captureOskiewarAction,
      initProductAnalytics,
    } from "/aesthetic.computer/lib/product-analytics.mjs";
    import { RoundRoom, roundNameFromPath } from "/round-room.mjs";
    const oskiewarSfx = createOskiewarSfx({
      contextFactory: () => ensureAudio(), volume: .64, maxVoices: 72,
    });
    globalThis.__oskiewarSfx = oskiewarSfx;
    oskiewarSfx.connectSignals(globalThis);

    // Web MIDI out, so a DAW on the same machine can score the fight instead of
    // the procedural bank. Opt-in, because it takes the bank's place: `?midi`
    // sends every signal to the IAC bus and silences the built-in voices,
    // `?midi=both` layers them, and the choice sticks in localStorage. The pad
    // layout is `oskiewar pads.adg` — note 36 upward, one per signal event.
    // The lamp answers every note that leaves, so the corner doubles as proof
    // the bridge is sending even when a pad is still silent.
    const midiLamp = document.querySelector("#midi-out");
    let lampTimer = null;
    const flashMidiLamp = () => {
      midiLamp.classList.add("lit");
      clearTimeout(lampTimer);
      lampTimer = setTimeout(() => midiLamp.classList.remove("lit"), 90);
    };
    const oskiewarMidi = createOskiewarMidi({ onSignal: flashMidiLamp });
    globalThis.__oskiewarMidi = oskiewarMidi;
    const midiParam = new URLSearchParams(location.search).get("midi");
    let midiMode = midiParam;
    if (midiParam !== null) {
      try { localStorage.setItem("oskiewar-midi", midiParam || "1"); } catch {}
    } else if (location.hostname.startsWith("midi.")) {
      midiMode = "1";   // the subdomain is the ask; no query string to remember
    } else {
      try { midiMode = localStorage.getItem("oskiewar-midi"); } catch {}
    }
    if (midiMode !== null && midiMode !== "0" && midiMode !== "off") {
      if (await oskiewarMidi.enable()) {
        document.body.classList.add("midi-out");
        oskiewarMidi.connectSignals(globalThis);
        const layered = midiMode === "both";
        if (!layered) oskiewarSfx.mute(true);
        console.log(`%c[midi]%c out -> ${oskiewarMidi.portName} · ` +
          `${oskiewarMidi.chart().length} pads on notes ` +
          `${oskiewarMidi.chart()[0].note}-${oskiewarMidi.chart().at(-1).note} · ` +
          `procedural bank ${layered ? "layered" : "muted"} · ` +
          `__oskiewarMidi.chart() for the map`,
          "color:#0f0;font-weight:bold", "color:inherit");
      } else {
        console.warn(`[midi] off — ${oskiewarMidi.lastError}`);
      }
    }
    // A tab hidden mid-match would otherwise leave its last notes held down.
    addEventListener("pagehide", () => oskiewarMidi.panic());
    try {
      const response = await fetch("/api/product-analytics-config", {
        cache: "no-store",
      });
      if (response.ok) globalThis.acPostHogConfig = await response.json();
    } catch {}
    initProductAnalytics();
    const analytics = (action, properties) =>
      captureOskiewarAction(action, properties);
    globalThis.__fightHost.analytics = analytics;
    globalThis.qrcode = qrcode;
    const roundName = roundNameFromPath(location.pathname);
    globalThis.__oskiewarRoundBridge = roundName
      ? new RoundRoom(roundName, { analytics })
      : null;

    const updateReady = document.querySelector("#update-ready");
    const updateNow = document.querySelector("#update-now");
    const autoUpdate = document.querySelector("#auto-update");
    try { autoUpdate.checked = localStorage.getItem("oskiewar-auto-update") === "1"; }
    catch {}
    updateNow.addEventListener("click", () => location.reload());
    autoUpdate.addEventListener("change", () => {
      try { localStorage.setItem("oskiewar-auto-update", autoUpdate.checked ? "1" : "0"); }
      catch {}
      if (autoUpdate.checked && updateReady.classList.contains("visible"))
        location.reload();
    });
    let loadedVersion = "";
    const responseVersion = (response) => response.headers.get("etag") ||
      [response.headers.get("last-modified"), response.headers.get("content-length")]
        .filter(Boolean).join(":");
    async function checkForUpdate() {
      if (!loadedVersion || updateReady.classList.contains("visible")) return;
      try {
        const response = await fetch(`/hello.js?update-check=${Date.now()}`,
          { method: "HEAD", cache: "no-store" });
        const availableVersion = responseVersion(response);
        if (response.ok && availableVersion && availableVersion !== loadedVersion) {
          if (autoUpdate.checked) {
            document.querySelector("#status").textContent = "updating";
            location.reload();
            return;
          }
          updateReady.classList.add("visible");
          document.querySelector("#status").textContent = "update is ready";
        }
      } catch {}
    }

    async function start() {
      let source = globalThis.__fightPieceSource;
      if (!source) {
        const response = await fetch("/hello.js", { cache: "no-store" });
        loadedVersion = responseVersion(response);
        source = await response.text();
        setInterval(checkForUpdate, 15000);
      }
      const piece = new Function(
        "runtime", "gamepad", "controllers", "capabilities", "telemetry",
        "gameSignal", "saveReplay", "publishLive", "analytics", "ac", "drum", "wipe", "box",
        "line", "triangle", "write", "systemWrite", "comicWrite", "gameView",
        `${source}\nreturn { boot, sim, paint };`
      )(...["runtime", "gamepad", "controllers", "capabilities", "telemetry",
        "gameSignal", "saveReplay", "publishLive", "analytics", "ac", "drum", "wipe", "box",
        "line", "triangle", "write", "systemWrite", "comicWrite", "gameView"]
        .map((name) => globalThis.__fightHost[name]));
      piece.boot();
      let selectionHoverSoundKey = "";
      let previousPieceScreen = "title";
      const tabTitles = ["oskiewar", "oskie war", "os ki ewar", "osk ie war",
        "o skie war", "oskie w ar"];
      let previousTabTitle = -1;
      const syncTabTitle = () => {
        const index = Math.floor(performance.now() / 1250) % tabTitles.length;
        if (index === previousTabTitle) return;
        previousTabTitle = index;
        document.title = tabTitles[index];
      };
      const syncSelectionCursor = () => {
        const pieceScreen = globalThis.__oskiewarTouch?.screen || "";
        if (pieceScreen === "title" && previousPieceScreen !== "title") {
          titleOpen = true;
          document.body.classList.add("title-open");
        }
        previousPieceScreen = pieceScreen;
        const hover = globalThis.__oskiewarTouch?.hover || null;
        const titleHover = globalThis.__oskiewarTouch?.titleHover === true;
        // A letter of the wordmark is a thing you can grab, so say so.
        const titleGlyph = globalThis.__oskiewarTouch?.titleGlyph ?? -1;
        document.body.classList.toggle("selection-hover",
          Boolean(hover) || titleHover || titleGlyph >= 0);
        const key = hover ? [hover.back ? "back" : "", hover.option ?? ""].join(":") : "";
        if (key && key !== selectionHoverSoundKey && !titleOpen)
          oskiewarSfx.drum("hat", .26, 0);
        selectionHoverSoundKey = key;
      };
      const driver = createFrameDriver({
        sample: globalThis.__fightHost.sampleInput,
        simulate(simulationAt) {
          simulationMonotonicMs = simulationAt;
          lastSimulationMonotonicMs = simulationAt;
          try { piece.sim(); }
          finally { simulationMonotonicMs = null; }
        },
        paint() {
          piece.paint();
          syncTabTitle();
          syncSelectionCursor();
        },
      });
      globalThis.__oskiewarFrameStats = driver.stats;
      addEventListener("visibilitychange", () =>
        driver.setVisible(document.visibilityState === "visible"));
      addEventListener("pointermove", syncSelectionCursor, { passive: true });
      addEventListener("pointerleave", () =>
        document.body.classList.remove("selection-hover"), { passive: true });
      driver.start();
    }
    start().catch((error) => {
      console.error(error);
      document.querySelector("#status").textContent = `TEST ERROR: ${error.message}`;
    });
  </script>
</body>
