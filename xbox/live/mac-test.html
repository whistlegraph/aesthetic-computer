<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSKIEWAR</title>
  <meta name="description" content="Play OSKIEWAR in your browser with a keyboard or two gamepads.">
  <meta name="theme-color" content="#07081c">
  <style>
    @font-face {
      font-family: "Comic Relief";
      src: url("./ComicRelief-Regular.ttf") format("truetype"),
        url("https://papers.aesthetic.computer/foundry/fonts/ComicRelief-Regular.ttf") format("truetype");
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07081c; }
    body { display: grid; place-items: center; font-family: "Comic Relief", "Comic Sans MS", Arial, sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; }
    #status { position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <canvas id="screen" width="1920" height="1080" aria-label="OSKIEWAR two-player stick fight"></canvas>
  <div id="status" role="alert" aria-live="polite"></div>

  <script>
    const canvas = document.querySelector("#screen");
    const context = canvas.getContext("2d");
    const keys = [new Set(), new Set()];
    const keyMap = new Map([
      ["KeyW", [0, "ArrowUp"]], ["KeyS", [0, "ArrowDown"]],
      ["KeyA", [0, "ArrowLeft"]], ["KeyD", [0, "ArrowRight"]],
      ["KeyF", [0, "A"]], ["KeyG", [0, "B"]], ["KeyH", [0, "X"]],
      ["KeyQ", [0, "View"]], ["Enter", [0, "Menu"]],
      ["ArrowUp", [1, "ArrowUp"]], ["ArrowDown", [1, "ArrowDown"]],
      ["ArrowLeft", [1, "ArrowLeft"]], ["ArrowRight", [1, "ArrowRight"]],
      ["KeyK", [1, "A"]], ["KeyL", [1, "B"]], ["Semicolon", [1, "X"]],
    ]);
    let audioContext = null;

    // Keep a stable 1080-unit vertical coordinate system while allowing the
    // horizontal game surface to follow the browser's actual aspect ratio.
    // 16:9 therefore remains exactly 1920x1080, while 9:16 becomes 608x1080
    // instead of a letterboxed landscape image.
    function resizeCanvas() {
      const width = Math.max(1, window.visualViewport?.width || innerWidth);
      const height = Math.max(1, window.visualViewport?.height || innerHeight);
      const logicalHeight = 1080;
      const logicalWidth = Math.max(480, Math.min(2880,
        Math.round(logicalHeight * width / height)));
      if (canvas.width !== logicalWidth) canvas.width = logicalWidth;
      if (canvas.height !== logicalHeight) canvas.height = logicalHeight;
    }
    resizeCanvas();
    addEventListener("resize", resizeCanvas, { passive: true });
    window.visualViewport?.addEventListener("resize", resizeCanvas,
      { passive: true });

    function gameView() {
      return { width: canvas.width, height: canvas.height,
        aspect: canvas.width / canvas.height,
        orientation: canvas.width < canvas.height ? "portrait" : "landscape" };
    }

    function ensureAudio() {
      if (!audioContext) audioContext = new AudioContext();
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    function color(values) {
      const [r = 255, g = 255, b = 255, a = 255] = values;
      return `rgba(${r}, ${g}, ${b}, ${a / 255})`;
    }

    function wipe(...ink) {
      context.fillStyle = color(ink);
      context.fillRect(0, 0, canvas.width, canvas.height);
    }

    function box(x, y, width, height, ...ink) {
      context.fillStyle = color(ink);
      context.fillRect(x, y, width, height);
    }

    function line(x1, y1, x2, y2, width, ...ink) {
      context.strokeStyle = color(ink);
      context.lineWidth = width;
      context.lineCap = "round";
      context.beginPath();
      context.moveTo(x1, y1);
      context.lineTo(x2, y2);
      context.stroke();
    }

    function triangle(x1, y1, x2, y2, x3, y3, ...ink) {
      context.fillStyle = color(ink);
      context.beginPath();
      context.moveTo(x1, y1);
      context.lineTo(x2, y2);
      context.lineTo(x3, y3);
      context.closePath();
      context.fill();
    }

    const blockGlyphs = {
      A:[14,17,17,31,17,17,17], B:[30,17,17,30,17,17,30], C:[14,17,16,16,16,17,14],
      D:[30,17,17,17,17,17,30], E:[31,16,16,30,16,16,31], F:[31,16,16,30,16,16,16],
      G:[14,17,16,23,17,17,15], H:[17,17,17,31,17,17,17], I:[31,4,4,4,4,4,31],
      J:[7,2,2,2,18,18,12], K:[17,18,20,24,20,18,17], L:[16,16,16,16,16,16,31],
      M:[17,27,21,21,17,17,17], N:[17,25,21,19,17,17,17], O:[14,17,17,17,17,17,14],
      P:[30,17,17,30,16,16,16], Q:[14,17,17,17,21,18,13], R:[30,17,17,30,20,18,17],
      S:[15,16,16,14,1,1,30], T:[31,4,4,4,4,4,4], U:[17,17,17,17,17,17,14],
      V:[17,17,17,17,17,10,4], W:[17,17,17,21,21,21,10], X:[17,17,10,4,10,17,17],
      Y:[17,17,10,4,4,4,4], Z:[31,1,2,4,8,16,31],
      0:[14,17,19,21,25,17,14], 1:[4,12,4,4,4,4,14], 2:[14,17,1,2,4,8,31],
      3:[30,1,1,14,1,1,30], 4:[2,6,10,18,31,2,2], 5:[31,16,16,30,1,1,30],
      6:[14,16,16,30,17,17,14], 7:[31,1,2,4,8,8,8], 8:[14,17,17,14,17,17,14],
      9:[14,17,17,15,1,1,14], ".":[0,0,0,0,0,12,12], ":":[0,4,4,0,4,4,0],
      "-":[0,0,0,31,0,0,0], "/":[1,2,2,4,8,8,16], "!":[4,4,4,4,4,0,4],
      " ":[0,0,0,0,0,0,0], "?":[14,17,1,2,4,0,4],
    };

    function drawText(text, x, y, size, ink) {
      context.fillStyle = color(ink);
      context.font = `${size}px "Segoe UI", Arial, sans-serif`;
      context.textBaseline = "top";
      context.fillText(String(text), x, y);
    }

    function write(text, x, y, size, ...ink) {
      const cell = Math.max(2, Math.floor(size / 7));
      const originX = x;
      let penX = x;
      let penY = y;
      context.fillStyle = color(ink);
      for (const rawCharacter of String(text)) {
        if (rawCharacter === "\n") {
          penX = originX;
          penY += cell * 9;
          continue;
        }
        const rows = blockGlyphs[rawCharacter.toUpperCase()] || blockGlyphs["?"];
        for (let row = 0; row < 7; row++) {
          for (let column = 0; column < 5; column++) {
            if (!(rows[row] & (1 << (4 - column)))) continue;
            context.fillRect(penX + column * cell, penY + row * cell,
              Math.max(1, cell - 1), Math.max(1, cell - 1));
          }
        }
        penX += cell * 6;
      }
    }

    function systemWrite(text, x, y, size, ...ink) {
      drawText(text, x, y, size, ink);
    }

    function comicWrite(text, x, y, size, ...ink) {
      context.fillStyle = color(ink);
      context.font = `${size}px "Comic Relief", "Comic Sans MS", Arial, sans-serif`;
      context.textBaseline = "top";
      const lines = String(text).split("\n");
      for (let index = 0; index < lines.length; index++)
        context.fillText(lines[index], x, y + index * size * 1.15);
    }

    function runtime() {
      return { monotonicUs: performance.now() * 1000, unixMs: Date.now(),
        audioLatencyMs: audioContext?.baseLatency ? audioContext.baseLatency * 1000 : 0,
        frameRate: 60 };
    }
    function telemetry(kind, message) { console.debug(kind, message); }

    function browserPad(index) {
      const source = navigator.getGamepads?.()[index];
      const down = new Set(keys[index]);
      if (source) {
        const names = ["A", "B", "X", "Y", "LeftShoulder", "RightShoulder",
          null, null, "View", "Menu", "LeftStick", "RightStick",
          "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
        source.buttons.forEach((button, buttonIndex) => {
          if (button.pressed && names[buttonIndex]) down.add(names[buttonIndex]);
        });
      }
      return {
        connected: Boolean(source) || down.size > 0 || index === 0,
        down: [...down],
        leftX: source?.axes?.[0] || 0,
        leftY: -(source?.axes?.[1] || 0),
        rightX: source?.axes?.[2] || 0,
        rightY: -(source?.axes?.[3] || 0),
        leftTrigger: source?.buttons?.[6]?.value || 0,
        rightTrigger: source?.buttons?.[7]?.value || 0,
      };
    }

    function gamepad(index = 0) { return browserPad(index); }
    function controllers() {
      return [0, 1].map((index) => ({ index, connected: browserPad(index).connected,
        name: navigator.getGamepads?.()[index]?.id || `KEYBOARD P${index + 1}` }));
    }
    function capabilities() {
      const mac = navigator.userAgent.includes("Mac");
      const hasGamepad = Array.from(navigator.getGamepads?.() || []).some(Boolean);
      return { platform: mac ? "macos" : "web",
        inputFamily: hasGamepad ? "xbox" : "keyboard",
        productName: mac ? "MACOS" : "WEB",
        version: "CROSS-PLATFORM", graphics: "CANVAS2D", audio: "WEB AUDIO" };
    }

    function noiseSource(ac, duration) {
      const buffer = ac.createBuffer(1, Math.ceil(ac.sampleRate * duration), ac.sampleRate);
      const channel = buffer.getChannelData(0);
      for (let i = 0; i < channel.length; i++) channel[i] = Math.random() * 2 - 1;
      const source = ac.createBufferSource();
      source.buffer = buffer;
      return source;
    }

    function drum(name, amount = 1, pan = 0) {
      const ac = ensureAudio();
      const now = ac.currentTime;
      const output = ac.createGain();
      const panner = ac.createStereoPanner();
      output.gain.value = Math.min(0.7, 0.42 * amount);
      panner.pan.value = Math.max(-1, Math.min(1, pan));
      output.connect(panner).connect(ac.destination);

      if (name === "kick") {
        const oscillator = ac.createOscillator();
        const envelope = ac.createGain();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(145, now);
        oscillator.frequency.exponentialRampToValueAtTime(43, now + 0.16);
        envelope.gain.setValueAtTime(1, now);
        envelope.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        oscillator.connect(envelope).connect(output);
        oscillator.start(now); oscillator.stop(now + 0.3);
      } else if (name === "block") {
        const oscillator = ac.createOscillator();
        const envelope = ac.createGain();
        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(205, now);
        envelope.gain.setValueAtTime(0.75, now);
        envelope.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        oscillator.connect(envelope).connect(output);
        oscillator.start(now); oscillator.stop(now + 0.1);
      } else {
        const duration = name === "hat" ? 0.07 : name === "clap" ? 0.16 : 0.2;
        const noise = noiseSource(ac, duration);
        const filter = ac.createBiquadFilter();
        const envelope = ac.createGain();
        filter.type = name === "hat" ? "highpass" : "bandpass";
        filter.frequency.value = name === "hat" ? 6500 : 1700;
        filter.Q.value = name === "hat" ? 0.7 : 0.9;
        envelope.gain.setValueAtTime(0.9, now);
        envelope.gain.exponentialRampToValueAtTime(0.001, now + duration);
        noise.connect(filter).connect(envelope).connect(output);
        noise.start(now); noise.stop(now + duration);
      }
    }

    function gameSignal(event, player = -1, value = 0, value2 = 0) {
      dispatchEvent(new CustomEvent("oskiewar:signal", {
        detail: { event, player, value, value2, at: performance.now() },
      }));
    }

    async function saveReplay(payload) {
      try {
        await fetch("https://aesthetic.computer/api/oskiewar-replays?surface=web", {
          method: "POST", headers: { "content-type": "application/json" }, body: payload,
        });
      } catch (error) { telemetry("REPLAY_WEB_ERROR", error.message); }
    }

    const liveSockets = new Map();
    function publishLive(matchId, payload) {
      let retiresRoom = false;
      try { retiresRoom = Boolean(JSON.parse(payload).nextRoundId); } catch {}
      let state = liveSockets.get(matchId);
      if (!state) {
        const socket = new WebSocket(`wss://session-server.aesthetic.computer/oskiewar-live?match=${encodeURIComponent(matchId)}&role=publisher&surface=web`);
        state = { socket, pending: payload, retire: retiresRoom };
        liveSockets.set(matchId, state);
        socket.addEventListener("open", () => {
          if (state.pending) socket.send(JSON.stringify({ type: "oskiewar:state",
            content: JSON.parse(state.pending) }));
          state.pending = "";
          if (state.retire) setTimeout(() => socket.close(1000, "next round"), 0);
        });
        socket.addEventListener("close", () => liveSockets.delete(matchId));
        return;
      }
      state.retire ||= retiresRoom;
      if (state.socket.readyState === WebSocket.OPEN) {
        state.socket.send(JSON.stringify({ type: "oskiewar:state", content: JSON.parse(payload) }));
        if (state.retire) setTimeout(() => state.socket.close(1000, "next round"), 0);
      } else state.pending = payload;
    }

    function ac() {
      return { fighters: [], moodHandle: "", mood: "", source: "web-fallback" };
    }

    addEventListener("keydown", (event) => {
      const mapped = keyMap.get(event.code);
      if (!mapped) return;
      event.preventDefault();
      keys[mapped[0]].add(mapped[1]);
      ensureAudio();
    });
    addEventListener("keyup", (event) => {
      const mapped = keyMap.get(event.code);
      if (!mapped) return;
      event.preventDefault();
      keys[mapped[0]].delete(mapped[1]);
    });
    addEventListener("blur", () => keys.forEach((held) => held.clear()));
    globalThis.__fightHost = {
      runtime, gamepad, controllers, capabilities, telemetry, gameSignal,
      saveReplay, publishLive, ac, drum, wipe, box, line, triangle,
      write, systemWrite, comicWrite, gameView,
    };
  </script>
  <script type="module">
    import { qrcode } from "/aesthetic.computer/dep/@akamfoad/qr/qr.mjs";
    import {
      captureOskiewarAction,
      initProductAnalytics,
    } from "/aesthetic.computer/lib/product-analytics.mjs";
    import { RoundRoom, roundNameFromPath } from "/round-room.mjs";
    try {
      const response = await fetch("/api/product-analytics-config", {
        cache: "no-store",
      });
      if (response.ok) globalThis.acPostHogConfig = await response.json();
    } catch {}
    initProductAnalytics();
    const analytics = (action, properties) =>
      captureOskiewarAction(action, properties);
    globalThis.__fightHost.analytics = analytics;
    globalThis.qrcode = qrcode;
    const roundName = roundNameFromPath(location.pathname);
    globalThis.__oskiewarRoundBridge = roundName
      ? new RoundRoom(roundName, { analytics })
      : null;

    async function start() {
      const source = globalThis.__fightPieceSource ||
        await fetch("/hello.js", { cache: "no-store" }).then((response) => response.text());
      const piece = new Function(
        "runtime", "gamepad", "controllers", "capabilities", "telemetry",
        "gameSignal", "saveReplay", "publishLive", "analytics", "ac", "drum", "wipe", "box",
        "line", "triangle", "write", "systemWrite", "comicWrite", "gameView",
        `${source}\nreturn { boot, sim, paint };`
      )(...["runtime", "gamepad", "controllers", "capabilities", "telemetry",
        "gameSignal", "saveReplay", "publishLive", "analytics", "ac", "drum", "wipe", "box",
        "line", "triangle", "write", "systemWrite", "comicWrite", "gameView"]
        .map((name) => globalThis.__fightHost[name]));
      piece.boot();
      function frame() {
        piece.sim();
        piece.paint();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
    start().catch((error) => {
      console.error(error);
      document.querySelector("#status").textContent = `TEST ERROR: ${error.message}`;
    });
  </script>
</body>
</html>
