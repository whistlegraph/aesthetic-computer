  }catch(e){}
}
async function save(name,patch,card){
  const cur=approvals[name]||{status:"",note:""};const next={...cur,...patch};
  try{
    const r=await fetch("/api/spells",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({name,status:next.status,note:next.note})});
    if(!r.ok)throw new Error((await r.json()).message||r.status);
    approvals[name]=await r.json();draw();
  }catch(e){const x=document.createElement("div");x.className="err";x.textContent="Not saved: "+e.message;card.querySelector(".body").append(x)}
}
function draw(){
  main.textContent="";let done=0;
  for(const r of ROWS){
    const st=approvals[r.name]||{};if(st.status)done++;
    const f=filter.value;
    if(f==="todo"){if(st.status)continue}else if(f==="approved"||f==="flagged"){if(st.status!==f)continue}else if(f&&r.verdict!==f)continue;
    const card=document.createElement("div");card.className="card "+(st.status||"");
    if(r.clip){const v=document.createElement("video");v.src=r.clip;v.controls=true;v.preload="none";v.playsInline=true;
      v.onerror=()=>{const n=document.createElement("div");n.className="noclip";n.textContent="No clip";v.replaceWith(n)};card.append(v)}
    else{const n=document.createElement("div");n.className="noclip";n.textContent=r.test||"No test";card.append(n)}
    const b=document.createElement("div");b.className="body";
    const h=document.createElement("div");
    const k=document.createElement("span");k.className="kind";k.textContent=r.kind;
    const nm=document.createElement("span");nm.className="name";nm.textContent=r.name+(r.arg?" "+r.arg:"");h.append(k,nm);b.append(h);
    const dl=document.createElement("dl");
    const add=(t,d,cls)=>{if(!d)return;const dt=document.createElement("dt");dt.textContent=t;const dd=document.createElement("dd");dd.textContent=d;if(cls)dd.className=cls;dl.append(dt,dd)};
    add("Book says",r.desc);add("Needs",r.needs);add("Leave by",r.leave);add("Opened by",r.opened==null?"":r.opened+" of 113 handles");
    add("Test saw",r.cast);add("Verdict",r.verdict==="untested"?"not cast":r.verdict,"v "+r.verdict);
    if(!admin&&st.note)add("Note",st.note);b.append(dl);
    if(admin){
      const acts=document.createElement("div");acts.className="acts";
      const mk=(label,val)=>{const x=document.createElement("button");x.textContent=label;if(st.status===val)x.className="on-"+val;
        x.onclick=()=>save(r.name,{status:st.status===val?"":val},card);return x};
      const note=document.createElement("input");note.className="note";note.placeholder="note";note.value=st.note||"";note.setAttribute("aria-label","Note for "+r.name);
      note.onchange=()=>save(r.name,{note:note.value},card);
      acts.append(mk("Approve","approved"),mk("Flag","flagged"),note);b.append(acts);
    }else if(st.status){const g=document.createElement("div");g.className="badge "+st.status;g.textContent=st.status==="approved"?"Approved by @jeffrey":"Flagged by @jeffrey";b.append(g)}
    card.append(b);main.append(card);
  }
  document.getElementById("count").textContent=done+" of "+ROWS.length+" reviewed";
}
filter.onchange=draw;
load().then(signIn);
</script></body></html>
