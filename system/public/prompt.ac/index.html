<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>prompt.ac</title>
<meta name="description" content="prompt.ac — the HTML prompt for Aesthetic Computer." />
<meta name="theme-color" content="#463264" />
<link rel="icon" href="https://assets.aesthetic.computer/favicon.png" />
<style>
  /* prompt.ac — the HTML prompt, sister of disks/prompt.mjs (the raster
     prompt) the way laklok.com's vector client sisters its raster piece.
     At the prompt the DOM owns the whole screen: crisp typed line + block
     caret, login state. The AC runtime
     stays booted in a hidden iframe as the command brain (prompt.mjs still
     parses, aliases, and halts every command via the prompt:dom-input
     bridge); it becomes visible only while a piece is on stage. The palettes
     mirror `scheme` in disks/prompt.mjs — keep them in lockstep.

     Interaction mirrors TextInput.act() in lib/type.mjs: the line is either
     activated (canType — blinking caret, curtain down) or deactivated (the
     login curtain — the auth buttons — stands). Backdrop taps and typing
     activate; a backdrop tap or Escape on an empty line deactivates. The
     blips (300 press, 250 deactivate, 850 run) are the same sines type.mjs
     plays, WebAudio'd here because the hidden runtime never sees these keys. */

  @font-face {
    font-family: "Berkeley Mono Web";
    src: url("https://aesthetic.computer/type/webfonts/BerkeleyMonoVariable-Regular.woff2") format("woff2");
    font-display: swap;
  }

  :root { /* prompt.mjs scheme.dark */
    /* The runtime's mouse cursors (cursors/precise.svg + active.svg),
       inlined so the shell wears them on any origin. */
    --cursor-precise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 25 25'><path d='M13 3v3M13 20v3M6 13H3M20 13h3' stroke='black' stroke-width='4' stroke-linecap='round'/><circle cx='13' cy='13' r='2' fill='black'/><path d='M12 2v3M12 19v3M5 12H2M19 12h3' stroke='%2300ffff' stroke-width='4' stroke-linecap='round'/><circle cx='12' cy='12' r='2' fill='white'/></svg>") 12 12;
    --cursor-active: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='-1 -1 27 27'><path d='M13 2v3M13 21v3M2 13h3M21 13h3' fill='none' stroke='black' stroke-width='4' stroke-linecap='round'/><path d='M12 1v3M12 20v3M1 12h3M20 12h3' fill='none' stroke='%2300ffff' stroke-width='4' stroke-linecap='round'/></svg>") 12 12;
    --bg:        rgb(70, 50, 100);
    --text:      #fff;
    --ghost:     rgba(200, 30, 100, .78);  /* scheme.prompt */
    --block:     rgb(200, 30, 100);        /* the blinking block caret */
    --highlight: rgb(255, 100, 0);         /* selection */
    --dim:       rgba(255, 255, 255, .45);
    --scrim:     rgba(70, 50, 100, .82);   /* prompt-over-piece curtain */
    --star:      rgba(255, 255, 255, .5);
    --login-bg:  rgb(0, 0, 64);    --login-edge:  #fff;
    --signup-bg: rgb(0, 64, 0);    --signup-edge: #fff;
    --profile-bg: rgb(64, 0, 64);  --profile-text: rgb(255, 100, 255);
    --font: "Berkeley Mono", "Berkeley Mono Web", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    /* The raster draws its 6×10 glyph at a fixed 2× scale — a 12px advance,
       20px tall — whatever the window. Berkeley Mono advances 0.6em, so one
       size matches it everywhere; nothing here scales with the viewport. */
    --type: 20px;
    --lineh: calc(1.3 * var(--type)); /* the typed line's height; JS updates it as the line wraps */
  }
  @media (prefers-color-scheme: light) {
    :root { /* prompt.mjs scheme.light — legal pad */
      --bg:        rgb(252, 247, 197);
      --text:      rgb(40, 30, 90);
      --ghost:     rgba(60, 40, 120, .6);
      --block:     rgb(56, 122, 223);
      --highlight: rgb(255, 207, 105);
      --dim:       rgba(40, 30, 90, .5);
      --scrim:     rgba(252, 247, 197, .88);
      --star:      rgba(40, 30, 90, .35);
      --login-bg:  rgb(0, 0, 128);
      --signup-bg: rgb(0, 128, 0);
      --profile-bg: rgb(128, 0, 128);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  /* The shell is a screen, not a document: dragging across it paints no blue
     wash and a long press raises no callout, the way the raster prompt's
     canvas behaves... */
  body {
    font-family: var(--font); color: var(--text); overflow: hidden;
    cursor: var(--cursor-precise), auto;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  /* ...except where the shell is holding real text for you: the line you type
     and the answers that come back are selectable and copyable. The other
     interactables — buttons, the label, the candidate rows — stay unselectable
     on purpose, since each one fires on the release of a drag, so a swipe to
     highlight one would run it. */
  #cmd, .reply, .notice {
    cursor: var(--cursor-precise), text;
    -webkit-user-select: text; user-select: text;
  }
  button, .corner { cursor: var(--cursor-active), pointer; }
  ::selection { background: var(--highlight); color: var(--bg); }

  /* ── Stage: the hosted runtime. While the DOM prompt owns the screen the
     stage stays inert underneath the opaque #screen — never visibility:hidden,
     because Chrome throttles rendering for hidden cross-origin iframes and
     the runtime's boot/load loop would stall (same-origin dev masks this). ── */
  /* The stage's ground is bare for the half-second before the runtime's own
     first paint lands, so it wears the same paper the boot log will — black
     under the dark log, white under the light one — and the boot starts
     without a flash. */
  .stage { position: absolute; inset: 0; background: #000; }
  @media (prefers-color-scheme: light) { .stage { background: #fff; } }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  body[data-mode="prompt"] .stage { pointer-events: none; }

  /* ── The prompt screen ─────────────────────────────────────────────── */
  #screen {
    position: absolute; inset: 0; z-index: 3;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg);
  }
  body[data-mode="prompt"] #screen { display: flex; }
  /* Slash-prompt over a running piece: same screen as a translucent curtain. */
  body[data-mode="piece"] #screen.overlay { display: flex; background: var(--scrim); }
  body[data-mode="piece"] #screen.overlay .auth,
  body[data-mode="piece"] #screen.overlay .flair { display: none; }

  /* Drifting star flecks — a whisper of the raster prompt's flair. */
  .flair, .flair::after {
    content: ""; position: absolute; inset: -60px; pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, var(--star) 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 12%, var(--star) 50%, transparent 51%),
      radial-gradient(1px 1px at 34% 68%, var(--star) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 88% 74%, var(--star) 50%, transparent 51%),
      radial-gradient(1px 1px at 55% 38%, var(--star) 50%, transparent 51%);
    opacity: .35;
    animation: drift 80s linear infinite;
  }
  .flair::after { animation-duration: 130s; animation-direction: reverse; transform: scale(1.6); }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(60px, 60px); } }

  /* ── Typed line — top-left like the raster TextInput, crisp DOM text. ── */
  .line {
    position: absolute;
    top: max(8px, env(safe-area-inset-top));
    left: max(8px, env(safe-area-inset-left));
    right: max(8px, env(safe-area-inset-right));
  }
  /* A textarea, not an input: pasted or typed kidlisp keeps its newlines and
     wraps by character the way the raster TextInput does; it grows with the
     text (JS sets the height) and Enter still runs the line. */
  #cmd {
    display: block; width: 100%; min-width: 0; padding: 0; margin: 0;
    background: transparent; border: 0; outline: 0;
    color: var(--text); font-family: var(--font);
    font-size: var(--type); line-height: 1.3;
    resize: none; overflow: hidden;
    white-space: pre-wrap; word-break: break-all;
    min-height: 1.3em; height: 1.3em;
    caret-color: transparent; /* the block caret below replaces the bar */
  }
  /* ── Native autocomplete — the raster's in-view completions: the best
     match's remainder ghosts onto the typed line, the rest stack beneath
     as faint rows (history rows ride the same rail), Tab completes. ── */
  #ghost {
    position: absolute; top: 0; left: 0; right: 0; pointer-events: none;
    font-size: var(--type); line-height: 1.3;
    white-space: pre-wrap; word-break: break-all; color: var(--dim); opacity: .55;
  }
  #ghost .pad { color: transparent; }
  /* ── KidLisp on the line — the runtime's syntax palette, DOM'd: typed
     source renders through a colored underlay while the input's own text
     goes clear (the block caret stays). ── */
  #lisp {
    position: absolute; top: 0; left: 0; right: 0; pointer-events: none;
    font-size: var(--type); line-height: 1.3;
    white-space: pre-wrap; word-break: break-all;
  }
  body.kidlisp #cmd { color: transparent; }
  body.kidlisp #cmd::selection { color: transparent; }
  .corner span[style] { text-shadow: 1px 1px 0 rgba(0, 0, 0, .75); }
  /* The raster shades bright syntax colors on the legal pad so white and
     yellow tokens stay legible; the DOM line does the same. */
  @media (prefers-color-scheme: light) {
    #lisp span[style] { text-shadow: 1px 1px 0 rgba(0, 0, 0, .55); }
  }
  #results {
    position: absolute; left: 0; right: 0;
    top: var(--lineh);
    font-size: var(--type); line-height: 1.3;
    white-space: pre; overflow: hidden;
  }
  #results .row { opacity: .4; cursor: var(--cursor-active), pointer; }
  #results .row .desc { opacity: .55; }
  #results .row.sel { opacity: .95; }
  #results .row:hover { opacity: .8; }
  #results .row.wg { color: rgb(255, 100, 255); }
  #results .row.hist { color: rgb(140, 90, 235); cursor: var(--cursor-active), pointer; }
  #caret {
    position: absolute; top: 0; left: 0; height: 1.3em; width: .6em;
    background: var(--block); pointer-events: none;
    font-size: var(--type);
    animation: blink 1s steps(2, start) infinite;
    will-change: transform;
  }
  /* The caret only blinks while the line is activated (canType in type.mjs);
     deactivated text sits dimmed behind the curtain, like the raster's. */
  #caret { display: none; }
  body.active[data-mode="prompt"] #caret,
  body.active[data-mode="piece"] #screen.overlay #caret { display: block; }
  body:not(.active) #cmd { opacity: .55; }
  @keyframes blink { 50% { opacity: 0; } }
  /* The caret mirror: the same box as #cmd, holding the text up to the
     caret plus a zero-width mark whose offsets are the block's position. */
  #measure {
    position: absolute; top: 0; left: 0; right: 0; visibility: hidden;
    pointer-events: none; white-space: pre-wrap; word-break: break-all;
    font-family: var(--font); font-size: var(--type); line-height: 1.3;
  }

  /* ── Reply + notice — the prompt's answer line and error flashes, DOM'd. ── */
  .reply, .notice {
    position: absolute;
    top: calc(max(8px, env(safe-area-inset-top)) + var(--lineh) + 6px);
    left: max(8px, env(safe-area-inset-left));
    right: max(8px, env(safe-area-inset-right));
    font-size: var(--type); line-height: 1.3;
  }
  .reply { color: var(--text); opacity: .92; white-space: pre-wrap; word-break: break-word; }
  .reply .dots { display: none; color: var(--block); letter-spacing: 2px; }
  body.thinking .reply .dots { display: inline; animation: think 1.2s steps(4) infinite; }
  @keyframes think { 0% { clip-path: inset(0 100% 0 0); } 100% { clip-path: inset(0 -10% 0 0); } }
  .notice {
    right: auto; max-width: 80vw;
    padding: 2px 10px; font-weight: 700;
    transition: opacity .5s;
  }
  .notice.gone { opacity: 0; }

  /* ── Login / I'm new / profile — ui.TextButton, vectorized. This is the
     login curtain (showLoginCurtain in prompt.mjs): it stands only while
     the line is deactivated, empty, and quiet (no reply). ─────────────── */
  .auth { display: flex; gap: 14px; transition: opacity .35s; }
  .auth[hidden] { display: none; } /* `display: flex` above outranks the UA rule */
  body.active .auth, body.typing .auth,
  body.replying .auth, body.submitting .auth { opacity: 0; pointer-events: none; }
  .auth button {
    font-family: var(--font); font-size: var(--type);
    color: #fff; padding: 6px 14px; cursor: var(--cursor-active), pointer;
    border: 1px solid var(--login-edge);
    box-shadow: 2px 2px 0 rgba(0, 0, 0, .55);
    background: var(--login-bg);
  }
  .auth button:hover { filter: brightness(1.6); }
  .auth button:active { transform: translate(2px, 2px); box-shadow: none; }
  .auth #signup { background: var(--signup-bg); }
  .auth #profile { background: var(--profile-bg); color: var(--profile-text); border-color: var(--profile-text); }
  .auth button[hidden] { display: none; }

  /* ── Corner label — the DOM twin of the composited HUD label: the piece
     name in the prompt's own type, drop-shadowed, no box. ─────────────── */
  .corner {
    position: absolute; z-index: 4;
    top: max(8px, env(safe-area-inset-top));
    left: max(8px, env(safe-area-inset-left));
    display: none; cursor: var(--cursor-active), pointer;
    color: #fff; font-family: var(--font);
    font-size: var(--type); line-height: 1.3;
    text-shadow: 1px 1px 0 rgba(0, 0, 0, .75);
    white-space: pre-wrap; word-break: break-all;
    max-width: calc(100vw - 16px);
  }
  body[data-mode="piece"].live .corner { display: block; }
  body[data-mode="piece"] #screen.overlay ~ .corner { display: none; }
  .corner:hover { color: var(--highlight); }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
</style>
<script type="module" src="https://aesthetic.computer/aesthetic.computer/lib/visit-tracker.mjs" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <script>
    // 🎬 First paint. A deep link is on its way into a piece, so the prompt
    // screen must never flash its login curtain on the way there — the mode is
    // settled here, before anything is drawn, and the module below reads these
    // back rather than deriving the route a second time.
    // Deep links ride real paths like the raster site (prompt.ac/line): lith's
    // resolver serves this shell for every piece-like prompt.ac path, and
    // replaceState keeps the bar in sync without a request. A nested dev mount
    // (localhost:8888/prompt.ac/) owns no paths, so it stays on hashes; old
    // #piece links still resolve everywhere.
    window.acNestedMount = location.pathname.startsWith("/prompt.ac");
    window.acInitialPiece = decodeURIComponent(
      (!window.acNestedMount && location.pathname !== "/" ? location.pathname.slice(1) : "") ||
      location.hash.slice(1),
    ) || "prompt";
    document.body.dataset.mode =
      window.acInitialPiece === "prompt" ? "prompt" : "booting";
  </script>
  <div class="stage">
    <iframe id="ac" title="Aesthetic Computer" allow="microphone; camera; midi; autoplay; clipboard-read; clipboard-write; fullscreen; xr-spatial-tracking"></iframe>
  </div>

  <div id="screen">
    <div class="flair"></div>
    <div class="line">
      <span id="ghost" aria-hidden="true"></span>
      <span id="lisp" aria-hidden="true"></span>
      <textarea id="cmd" rows="1" aria-label="Aesthetic Computer prompt"
             autocomplete="off" autocapitalize="off" autocorrect="off"
             spellcheck="false" enterkeyhint="go"></textarea>
      <span id="caret"></span>
      <div id="measure" aria-hidden="true"><span id="mark"></span></div>
      <div id="results" role="listbox"></div>
    </div>
    <div class="reply" id="reply" hidden><span class="dots">▪▪▪</span><span id="replyText"></span></div>
    <div class="notice" id="notice" hidden></div>
    <div class="auth" id="auth" hidden>
      <button id="login">Log in</button>
      <button id="signup">I'm new</button>
      <button id="profile" hidden></button>
    </div>
  </div>

  <div class="corner" id="corner" title="back to prompt"><span id="cornerName"></span></div>
  <span class="sr-only" id="dot" role="status">runtime booting</span>

<script type="module">
const localRuntime = ["localhost", "127.0.0.1", "::1"].includes(location.hostname);
const runtimeOverride = localRuntime
  ? new URLSearchParams(location.search).get("runtime")
  : null;
const runtimeOrigin = runtimeOverride || (localRuntime
  ? location.origin
  : "https://aesthetic.computer");
const { ACFrame } = await import(`${runtimeOrigin}/html/lib/moat.mjs`);

const $ = (id) => document.getElementById(id);
const $cmd = $("cmd"), $caret = $("caret"), $measure = $("measure"), $mark = $("mark");
const $ghost = $("ghost"), $results = $("results"), $lisp = $("lisp");
const $screen = $("screen"), $corner = $("corner"), $cornerName = $("cornerName");
const $auth = $("auth"), $login = $("login"), $signup = $("signup"), $profile = $("profile");
const $reply = $("reply"), $replyText = $("replyText"), $notice = $("notice");
const $dot = $("dot");
const $ac = $("ac");
const frame = new ACFrame($ac, { origin: runtimeOrigin });
let pendingJump = null;
let pendingSubmit = null; // command typed before the runtime's prompt was live
let promptLive = false; // the runtime's prompt piece is loaded + interactive
let lastSubmitted = ""; // suppress the runtime echoing a command back as a "reply"
let noticeTimer, submitTimer;
let caretAt = -1, lineHeight = 0; // the block caret's last index, the line's last height
let syncQueued = false, completionsQueued = false; // one measured layout per frame
let runtimeLabel = null; // the raster HUD label as the runtime last reported it

// ── Blips — the TextInput sounds from lib/type.mjs, rendered with a port
// of the AC synth envelope (lib/sound/synth.mjs by way of speaker.mjs):
// duration is seconds, attack and decay are fractions of that duration,
// and both ramps are linear. The hidden runtime never sees these keys, so
// the shell plays its exact ticks — same tones, same math, same lengths.
let audio;
function synth({ tone, volume, duration, attack, decay }) {
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = "sine";
    osc.frequency.value = tone;
    const t = audio.currentTime;
    const attackEnd = t + duration * attack;
    const decayStart = t + duration * (1 - decay); // decayFrames count back from the end
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(volume, attackEnd);
    if (decayStart > attackEnd) gain.gain.setValueAtTime(volume, decayStart);
    gain.gain.linearRampToValueAtTime(0, t + duration);
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + duration + 0.01);
  } catch {}
}
// The literal calls type.mjs makes on touch/activate, deactivate, and run.
const SND = {
  press: () => synth({ tone: 300, volume: 0.5, duration: 0.01, attack: 0.1, decay: 0.96 }),
  deactivate: () => synth({ tone: 250, volume: 0.75, duration: 0.001, attack: 0.1, decay: 0.99 }),
  run: () => synth({ tone: 850, volume: 0.65, duration: 0.005, attack: 0.1, decay: 0.96 }),
};

// ── Keypunch — the raster's AeCo_compkey sample, pitched notepat-style by
// the QWERTY music map in prompt.mjs and played on every edit of the line
// at the same randomized volume.
const KEY_MUSIC = {
  c: [0, -.7], v: [1, -.5], d: [2, -.6], s: [3, -.4], e: [4, -.5],
  f: [5, -.4], w: [6, -.3], g: [7, -.3], r: [8, -.2], a: [9, -.2],
  q: [10, -.1], b: [11, -.1], h: [12, .1], t: [13, .1], i: [14, .2],
  y: [15, .2], j: [16, .3], k: [17, .4], u: [18, .3], l: [19, .5],
  o: [20, .4], m: [21, .6], p: [22, .5], n: [23, .7], z: [-2, -.9], x: [-1, -.8],
};
let keySample; // the decoded compkey buffer
let lastKey = null; // last printable key — pitches the punch (lastPressedKey)
const safari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
fetch(`https://assets.aesthetic.computer/sounds/AeCo_compkey.${safari ? "m4a" : "ogg"}`)
  .then((r) => r.arrayBuffer())
  .then((buf) => {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    return audio.decodeAudioData(buf);
  })
  .then((decoded) => (keySample = decoded))
  .catch(() => {});
function keypunch() {
  if (!keySample) return;
  try {
    if (audio.state === "suspended") audio.resume();
    const src = audio.createBufferSource();
    src.buffer = keySample;
    const gain = audio.createGain();
    gain.gain.value = 0.2 + Math.random() * 0.4;
    const music = lastKey ? KEY_MUSIC[lastKey] : null;
    if (music) {
      src.playbackRate.value = Math.pow(2, (music[0] - 11) / 12); // centered like the raster
      const pan = audio.createStereoPanner();
      pan.pan.value = music[1];
      src.connect(gain).connect(pan).connect(audio.destination);
    } else {
      src.connect(gain).connect(audio.destination);
    }
    src.start();
  } catch {}
}

// ── Activation — canType in type.mjs. The login curtain (MOTD + auth)
// stands while the line is deactivated and empty; tapping the backdrop or
// typing tears it down, and tapping again (or Escape on an empty line)
// raises it back.
let active = false;
function activate({ silent = false } = {}) {
  if (!active) {
    active = true;
    document.body.classList.add("active");
    if (!silent) SND.press();
    clearReply(); // reactivating dismisses the last answer, like the raster
    document.body.classList.remove("submitting");
    refreshCompletions(); // history rows greet an empty activated line
  }
  $cmd.focus();
  syncCaret();
}
let deactivatedAt = 0; // guards against phantom refocus, as in type.mjs
function deactivate({ silent = false } = {}) {
  if (!active) return;
  active = false;
  document.body.classList.remove("active");
  if (!silent) SND.deactivate();
  deactivatedAt = performance.now();
  $cmd.blur();
  refreshCompletions(); // ghost + rows stand down with the line
}

// The route was settled by the first-paint script at the top of <body>, so
// the mode was right before anything was drawn; read it back here.
const nestedMount = window.acNestedMount;
const initial = window.acInitialPiece;
let currentPiece = initial;
const frameParams = "nogap=true&nolabel=true&shellhtml=true";

function setMode(piece) {
  const wasPiece = document.body.dataset.mode === "piece";
  currentPiece = piece;
  const onPiece = piece !== "prompt";
  document.body.dataset.mode = onPiece ? "piece" : "prompt";
  document.body.dataset.piece = piece;
  document.title = onPiece ? piece + " · prompt.ac" : "prompt.ac";
  $screen.classList.remove("overlay");
  if (onPiece) { clearReply(); $notice.hidden = true; }
  // Until the runtime reports its own label (ac:label, below), the slug
  // stands in — kidlisp slugs in their syntax colors, like the raster HUD.
  runtimeLabel = null;
  renderCorner();
  // URLs keep AC's canonical kidlisp encoding: underscores for spaces —

      const row = document.createElement("div");
      row.className = "row hist";
      row.textContent = h;
      row.onpointerdown = (e) => e.stopPropagation();
      row.onpointerup = (e) => e.stopPropagation();
      row.onclick = () => { setTyped(h); $cmd.focus(); };
      $results.append(row);
    });
    // Fade the stack the way the raster's history rows decay.
    [...$results.children].forEach((row, i) => { row.style.opacity = 0.45 / (i + 1); });
  }
}

function acceptCompletion(at = completionAt) {
  const pick = completions[at];
  if (!pick) return;
  setTyped(pick.name);
  keypunch(); // the raster punches on every text replace, tab included
}

function navigateCompletions(dir) {
  completionAt = (completionAt + dir + completions.length) % completions.length;
  completionNavigated = true;
  renderCompletions();
}

// ── KidLisp coloring — a static port of the runtime's palette
// (getNormalTokenColor / getFunctionColor / getParenthesesColor in
// lib/kidlisp.mjs). Execution-state colors (timing blinks, $code loading)
// stay the runtime's business; the line and label get the resting palette.
const LISP_PARENS = ["rgb(192,192,192)", "gold", "orange", "hotpink", "blueviolet", "deepskyblue", "limegreen"];
const LISP_MATH = ["+", "-", "*", "/", "%", "mod", "=", ">", "<", ">=", "<=", "abs", "sqrt", "min", "max"];
const LISP_SPECIAL = ["def", "if", "cond", "later", "once", "lambda", "let", "do"];
const LISP_KNOWN = ["wipe", "ink", "line", "box", "flood", "circle", "write", "paste", "stamp", "point", "poly", "embed", "print", "debug", "random", "sin", "cos", "tan", "floor", "ceil", "round", "noise", "choose", "?", "...", "..", "overtone", "mic", "amplitude", "melody", "speaker", "resolution", "lines", "wiggle", "shape", "scroll", "flip", "spin", "resetSpin", "smoothspin", "sort", "zoom", "blur", "contrast", "pan", "unpan", "mask", "unmask", "steal", "putback", "label", "len", "now", "die", "tap", "draw", "not", "range", "mul", "log", "no", "yes", "fade", "jump"];
const RAINBOW = ["red", "orange", "yellow", "green", "blue", "indigo", "violet"];

// isKidlispSource in lib/kidlisp.mjs, the cases a typed line can hit.
function isKidlisp(text) {
  const t = (text || "").trim(), lower = t.toLowerCase();
  if (!t) return false;
  if (t.startsWith("(") || t.startsWith(";")) return true;
  if (/^\$[0-9A-Za-z]{4,12}$/.test(t) && (/\d/.test(t) || (/[a-z]/.test(t) && /[A-Z]/.test(t)))) return true;
  if (lower.startsWith("share")) return false;
  if (lower.startsWith("fade:") || /^[cp]\d+$/.test(lower) || lower === "rainbow" || lower === "zebra") return true;
  if (CSS.supports("color", lower) && /^[a-z]+$/.test(lower)) return true; // a bare color name
  if (/^\d{1,3}(\s+\d{1,3}){2,3}$/.test(t)) return true; // an rgb(a) triplet
  return t.includes(",") || t.includes("\n");
}
// shouldUseSyntaxHighlighting: the raster also colors a line whose first
// word is a nopaint brush, so `line 10 20 30` reads as code, not a command.
const BRUSHES = ["box", "shape", "line", "rect", "fill", "smear", "spray", "plot", "oval", "circle", "handprint", "word", "paste", "stamp"];
function colorsTyped(text) {
  if (isKidlisp(text)) return true;
  const first = (text || "").trim().split(/\s+/)[0].toLowerCase();
  return BRUSHES.includes(first);
}

function lispSpans(source) {
  // Tokenize preserving whitespace runs, then color with the raster's rules.
  const toks = [];
  let i = 0;
  while (i < source.length) {
    const ch = source[i];
    let j;
    if (ch === ";") {
      j = source.indexOf("\n", i); if (j === -1) j = source.length;
      toks.push({ t: source.slice(i, j) });
    } else if (ch === '"') {
      j = i + 1; while (j < source.length && source[j] !== '"') j++;
      toks.push({ t: source.slice(i, Math.min(j + 1, source.length)) }); j = Math.min(j + 1, source.length);
    } else if (ch === "(" || ch === ")" || ch === ",") {
      j = i + 1; toks.push({ t: ch });
    } else if (/\s/.test(ch)) {
      j = i; while (j < source.length && /\s/.test(source[j])) j++;
      toks.push({ t: source.slice(i, j), ws: true });
    } else {
      j = i; while (j < source.length && !/[\s(),;"]/.test(source[j])) j++;
      toks.push({ t: source.slice(i, j) });
    }
    i = j;
  }
  const words = toks.filter((k) => !k.ws);
  const isNum = (t) => /^-?\d+(\.\d+)?$/.test(t);
  const frag = document.createDocumentFragment();
  const span = (text, color) => {
    const s = document.createElement("span");
    if (color) s.style.color = color;
    s.textContent = text;
    frag.append(s);
  };
  let depth = 0;
  toks.forEach((k) => {
    const t = k.t;
    if (k.ws) return span(t);
    const w = words.indexOf(k); // index among meaningful tokens
    const prev = words[w - 1]?.t, next = words[w + 1]?.t, next2 = words[w + 2]?.t;
    if (t === "(") { span(t, LISP_PARENS[depth % LISP_PARENS.length]); depth++; return; }
    if (t === ")") { depth = Math.max(0, depth - 1); return span(t, LISP_PARENS[depth % LISP_PARENS.length]); }
    if (t === ",") return span(t, LISP_PARENS[depth % LISP_PARENS.length]);
    if (t.startsWith(";")) return span(t, "gray");
    if (t.startsWith('"')) return span(t, "yellow");
    if (/^[$][0-9A-Za-z]+$/.test(t)) { span("$", "limegreen"); return span(t.slice(1), "lime"); }
    if (/^[#][0-9A-Za-z]{1,8}$/.test(t) && t.length > 1) { span("#", "magenta"); return span(t.slice(1), "orange"); }
    if (/^[!][0-9A-Za-z]+$/.test(t) && t.length > 1) { span("!", "cyan"); return span(t.slice(1), "teal"); }
    if (isNum(t)) {
      // RGB triplets glow their own channels, everything else is pink.
      const v = Math.max(0, Math.min(255, parseFloat(t)));
      if (isNum(next) && isNum(next2)) return span(t, `rgb(${v},0,0)`);
      if (isNum(prev) && isNum(next)) return span(t, `rgb(0,${v},0)`);
      if (isNum(prev) && isNum(words[w - 2]?.t)) return span(t, `rgb(0,${Math.round(v * 0.75)},${v})`);
      return span(t, "pink");
    }
    if (/^\d*\.?\d+[sf]!?(\.\.\.?)?$/.test(t)) return span(t, "yellow");
    if (t === "rainbow" || t === "p0") { [...t].forEach((c, ci) => span(c, RAINBOW[ci % RAINBOW.length])); return; }
    if (t === "zebra" || t === "p1") { [...t].forEach((c, ci) => span(c, ci % 2 ? "gray" : "white")); return; }
    if (t === "fade" || t.startsWith("fade:")) return span(t, "mediumseagreen");
    if (CSS.supports("color", t)) return span(t, t);
    if (prev === "(") { // function position
      if (LISP_MATH.includes(t)) return span(t, "lime");
      if (LISP_SPECIAL.includes(t)) return span(t, "purple");
      if (t === "repeat") return span(t, "magenta");
      return span(t, "cyan");
    }
    if (LISP_MATH.includes(t)) return span(t, "lime");
    if (t === "repeat") return span(t, "magenta");
    if (LISP_SPECIAL.includes(t)) return span(t, "purple");
    if (LISP_KNOWN.includes(t)) return span(t, "cyan");
    return span(t, "orange");
  });
  return frag;
}

function renderLisp() {
  const typed = $cmd.value;
  const lisp = active && colorsTyped(typed);
  document.body.classList.toggle("kidlisp", lisp);
  $lisp.replaceChildren();
  if (lisp) $lisp.append(lispSpans(typed));
}

function whistlegraphFromInput(input) {
  const value = String(input || "").trim().toLowerCase();
  const explicit = value.match(/^wg(?:\s+|:)([a-z0-9]+)$/);
  if (explicit) return wgByCode.get(explicit[1]) || null;
  const entry = wgByCode.get(value);
  return entry?.bare ? entry : null;
}
wgFeed.then(() => {
  const work = whistlegraphFromInput(initial);
  if (work) location.replace(work.url);
});

// ── Tiny local command history (up/down recall). ───────────────────────────
const HKEY = "promptac:history";
let hist = []; try { hist = JSON.parse(localStorage.getItem(HKEY) || "[]"); } catch {}
let hi = hist.length;
function pushHistory(v) {
  if (hist[hist.length - 1] !== v) hist.push(v);
  if (hist.length > 100) hist = hist.slice(-100);
  hi = hist.length;
  try { localStorage.setItem(HKEY, JSON.stringify(hist)); } catch {}
}
function recall(dir) {
  if (!hist.length) return;
  hi = Math.max(0, Math.min(hist.length, hi + dir));
  setTyped(hist[hi] ?? "");
}

// Fallback: a runtime older than `ac:boot-hidden` never reports its boot log
// coming down, and `ready` is no substitute — it lands while that log still
// stands, and the motd reveal can hold it there for seconds afterward. So wait
// past any boot, then wear the label rather than leave the piece unlabeled.
setTimeout(() => {
  if (!frame.ready) $dot.textContent = "runtime slow to respond";
  document.body.classList.add("live");
}, 12000);
</script>
