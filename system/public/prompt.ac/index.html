<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>prompt.ac</title>
<meta name="description" content="prompt.ac — a fast HTML prompt for Aesthetic Computer." />
<meta name="theme-color" content="#0a0a0c" />
<link rel="icon" href="https://assets.aesthetic.computer/favicon.png" />
<style>
  /* prompt.ac — one continuous AC stage with a crisp DOM prompt above it.
     Commands drive in-place piece swaps through ACFrame; the iframe never
     changes, and the runtime's pixel-buffer prompt/HUD stays disabled. */
  :root {
    --bg: #0a0a0c; --panel: #131318; --edge: #26262e;
    --text: #eaeaf0; --dim: #8a8a98; --accent: #ff8c50; --ok: #64dc8c; --warn: #ffd278; --bad: #ff8c78;
    --font: "Berkeley Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { font-family: var(--font); color: var(--text); overflow: hidden; }

  /* ── Hosted runtime: full viewport, including behind the DOM prompt ─── */
  .stage { position: relative; width: 100%; height: 100%; background: #000; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }

  /* ── Prompt layer: the stage-mode editor, not a separate layout row ─── */
  .prompt-layer {
    position: absolute; inset: 0; z-index: 3;
    pointer-events: none; opacity: 0; visibility: hidden;
    transition: opacity 90ms linear, visibility 0s linear 90ms;
  }
  .prompt-layer.on,
  .prompt-layer.editing {
    opacity: 1; visibility: visible;
    transition: opacity 90ms linear;
  }
  #cmd {
    position: absolute;
    top: max(6px, env(safe-area-inset-top));
    left: max(6px, env(safe-area-inset-left));
    width: calc(100% - max(12px, env(safe-area-inset-left)) - env(safe-area-inset-right));
    min-width: 0; padding: 0;
    pointer-events: auto;
    background: transparent; border: 0; outline: 0;
    color: #fff; font-family: var(--font);
    font-size: clamp(18px, 2.2vw, 28px); line-height: 1.25;
    caret-color: var(--accent);
    text-shadow: 0 1px 2px #000, 0 0 5px rgba(0, 0, 0, .9);
  }
  #cmd::placeholder { color: rgba(255, 255, 255, .42); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 13px; letter-spacing: .5px; pointer-events: none;
    transition: opacity .4s; background: var(--bg);
  }
  .loading.gone { opacity: 0; }

  /* ── DOM corner overlay — the crisp return-to-prompt chip that replaces the
     runtime's composited corner label while in shellhtml mode. ───────────── */
  .corner {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    display: none; align-items: center; gap: 6px;
    padding: 4px 9px; cursor: pointer; user-select: none;
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    border: 1px solid var(--edge); border-radius: 6px;
    color: var(--text); font-family: var(--font); font-size: 13px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .corner.on { display: flex; }
  .corner:hover { border-color: var(--accent); }
  .corner .back { color: var(--accent); font-weight: 700; }

  /* token colors (for the suggestion/echo line, shared class names with moat) */
  .t-handle { color: #ffb0a0; } .t-kidlisp { color: #ff8cc8; } .t-clock { color: #ffd24b; }
</style>
</head>
<body>
  <div class="stage">
    <iframe id="ac" title="Aesthetic Computer" allow="microphone; camera; midi; autoplay; clipboard-read; clipboard-write; fullscreen; xr-spatial-tracking"></iframe>
    <div class="prompt-layer on" id="promptLayer">
      <input id="cmd" aria-label="Aesthetic Computer prompt" list="wgCommands" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" />
      <datalist id="wgCommands"></datalist>
    </div>
    <div class="corner" id="corner" title="back to prompt"><span class="back">&lsaquo;</span><span id="cornerName"></span></div>
    <div class="loading" id="loading">booting aesthetic computer…</div>
    <span class="sr-only" id="dot" role="status">runtime booting</span>
  </div>

<script type="module">
const localRuntime = ["localhost", "127.0.0.1", "::1"].includes(location.hostname);
const runtimeOverride = localRuntime
  ? new URLSearchParams(location.search).get("runtime")
  : null;
const runtimeOrigin = runtimeOverride || (localRuntime
  ? location.origin
  : "https://aesthetic.computer");
const moatUrl = localRuntime
  ? `${location.origin}/html/lib/moat.mjs`
  : `${runtimeOrigin}/html/lib/moat.mjs`;
const { ACFrame } = await import(moatUrl);

const $cmd = document.getElementById("cmd");
const $dot = document.getElementById("dot");
const $loading = document.getElementById("loading");
const $promptLayer = document.getElementById("promptLayer");
const $corner = document.getElementById("corner");
const $cornerName = document.getElementById("cornerName");
const $ac = document.getElementById("ac");
const frame = new ACFrame($ac, { origin: runtimeOrigin });
let pendingJump = null;

// Live Whistlegraph command feed. Non-conflicting codes work bare; collisions
// such as `line` keep their AC meaning and are exposed as `wg line` instead.
const wgByCode = new Map();
const $wgCommands = document.getElementById("wgCommands");
const wgFeed = fetch("https://whistlegraph.org/api/commands")
  .then((res) => res.ok ? res.json() : null)
  .then((data) => {
    const commands = Array.isArray(data) ? data : data?.commands || [];
    for (const entry of commands) {
      if (!entry?.code) continue;
      wgByCode.set(String(entry.code).toLowerCase(), entry);
      const option = document.createElement("option");
      option.value = entry.command || entry.code;
      option.label = `${entry.code} — ${entry.title || "Whistlegraph"}`;
      $wgCommands.appendChild(option);
    }
  })
  .catch(() => {});

function whistlegraphFromInput(input) {
  const value = String(input || "").trim().toLowerCase();
  const explicit = value.match(/^wg(?:\s+|:)([a-z0-9]+)$/);
  if (explicit) return wgByCode.get(explicit[1]) || null;
  const entry = wgByCode.get(value);
  return entry?.bare ? entry : null;
}

// Deep-link support that doesn't fight Caddy: prompt.ac/#clock stays on the
// shell (hash never reaches the server), while prompt.ac/clock 301s to AC.
const initial = decodeURIComponent(location.hash.slice(1)) || "prompt";
let currentPiece = initial;
const frameParams = "nogap=true&nolabel=true&shellhtml=true";
document.body.dataset.piece = initial;
$promptLayer.classList.toggle("on", initial === "prompt");

wgFeed.then(() => {
  const work = whistlegraphFromInput(initial);
  if (work) location.replace(work.url);
});

$dot.textContent = "runtime booting";
// shellhtml keeps disk.mjs's composited prompt and corner HUD off for this
// iframe's entire lifetime. The DOM layer remains crisp above the AC stage.
frame.boot(initial, frameParams);

frame.onReady(() => {
  $dot.textContent = "runtime live";
  $loading.classList.add("gone");
  if (currentPiece === "prompt") $cmd.focus();
});

frame.onBridgeReady(() => {
  if (pendingJump) {
    const destination = pendingJump;
    pendingJump = null;
    jumpPiece(destination);
  }
});

// Keep the DOM prompt + URL hash + return chip in sync with the live runtime.
frame.onPiece((slug) => {
  const name = slug || "prompt";
  currentPiece = name;
  document.body.dataset.piece = name;
  document.title = name === "prompt" ? "prompt.ac" : name + " · prompt.ac";
  const onPiece = name !== "prompt";
  $promptLayer.classList.toggle("on", !onPiece);
  $promptLayer.classList.remove("editing");
  $corner.classList.toggle("on", onPiece); // chip only overlays pieces
  $cornerName.textContent = name;
  const h = "#" + name;
  if (location.hash !== h && onPiece) history.replaceState(null, "", h);
  else if (!onPiece && location.hash) history.replaceState(null, "", location.pathname);
  if (!onPiece) $cmd.focus();
});

// Corner chip → back to the prompt (the DOM twin of the composited label).
$corner.addEventListener("click", () => {
  jumpPiece("prompt");
});

function jumpPiece(value) {
  const v = String(value || "").trim();
  if (!v) return;
  $promptLayer.classList.remove("editing", "on");
  // Queue early commands until the initial runtime is ready. Then use the
  // ac:navigate bridge proven by top.kidlisp.com; the iframe src stays put.
  if (frame.bridgeReady) {
    $ac.contentWindow.postMessage({ type: "ac:navigate", to: v }, "*");
  } else {
    pendingJump = v;
  }
}

function submitCommand(value, { remember = true } = {}) {
  const v = String(value || "").trim();
  if (!v) return;
  if (remember) pushHistory(v);
  const work = whistlegraphFromInput(v);
  if (work) {
    location.assign(work.url);
    return;
  }

  if (frame.bridgeReady && currentPiece === "prompt") {
    // Seed and execute the real prompt TextInput. The DOM only supplies data;
    // command behavior remains inside the prompt system.
    $ac.contentWindow.postMessage({
      type: "prompt:dom-input",
      text: v,
      active: true,
      submit: true,
    }, "*");
  } else {
    // From a running piece (or during boot), route through a fresh prompt boot
    // with autorun so aliases and non-piece commands still use prompt.halt().
    jumpPiece(`prompt~${v}~!autorun`);
  }

  $ac.focus();
  $cmd.value = "";
  if (currentPiece !== "prompt") {
    $promptLayer.classList.remove("editing");
    $cmd.blur();
  }
}

// DOM prompt → in-place piece load.
$cmd.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    submitCommand($cmd.value);
  } else if (e.key === "ArrowUp") {
    e.preventDefault(); recall(-1);
  } else if (e.key === "ArrowDown") {
    e.preventDefault(); recall(1);
  } else if (e.key === "Escape") {
    $cmd.value = "";
    $promptLayer.classList.remove("editing");
    if (currentPiece !== "prompt") {
      $cmd.blur();
      $ac.focus();
    }
  }
});

function syncPromptInput() {
  if (!frame.bridgeReady || currentPiece !== "prompt") return;
  $ac.contentWindow.postMessage({
    type: "prompt:dom-input",
    text: $cmd.value,
    active: document.activeElement === $cmd,
    submit: false,
  }, "*");
}
$cmd.addEventListener("input", syncPromptInput);
$cmd.addEventListener("focus", syncPromptInput);

// Controller/protool-compatible remote jumps use the same persistent iframe.
// `ac:navigate` mirrors top.kidlisp.com; `promptac:load-piece` is explicit for
// shells embedding or opening prompt.ac.
window.addEventListener("message", (event) => {
  if (event.source === $ac.contentWindow) return;
  const data = event.data || {};
  const destination = data.type === "ac:navigate"
    ? data.to
    : data.type === "promptac:load-piece"
      ? (data.slug || data.to)
      : null;
  if (typeof destination === "string" && destination.trim()) {
    jumpPiece(destination);
  }
});
window.promptAC = { load: jumpPiece };

// Tiny local command history (up/down recall).
const HKEY = "promptac:history";
let hist = []; try { hist = JSON.parse(localStorage.getItem(HKEY) || "[]"); } catch {}
let hi = hist.length;
function pushHistory(v) {
  if (hist[hist.length - 1] !== v) hist.push(v);
  if (hist.length > 100) hist = hist.slice(-100);
  hi = hist.length;
  try { localStorage.setItem(HKEY, JSON.stringify(hist)); } catch {}
}
function recall(dir) {
  if (!hist.length) return;
  hi = Math.max(0, Math.min(hist.length, hi + dir));
  $cmd.value = hist[hi] ?? "";
  $cmd.setSelectionRange($cmd.value.length, $cmd.value.length);
}

// While on the prompt, the bar owns typing — if the iframe steals focus
// (a canvas click), hand it straight back so keystrokes never vanish into
// the runtime. Pieces keep iframe focus; this only guards the prompt.
window.addEventListener("blur", () => {
  if (currentPiece === "prompt" && document.activeElement === $ac) {
    setTimeout(() => $cmd.focus(), 0);
  }
});

// A press of "/" or typing from the shell reveals the prompt over the current
// piece, so it can jump elsewhere without replacing the iframe.
window.addEventListener("keydown", (e) => {
  if (document.activeElement === $cmd) return;
  if (e.key === "/" || (e.key.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey)) {
    e.preventDefault();
    $promptLayer.classList.add("editing");
    $cmd.focus();
    if (e.key !== "/") $cmd.value += e.key;
  }
});

// Fallback: if the runtime never signals ready (old build / slow boot), reveal
// the canvas anyway after a beat so the shell is never stuck on the loader.
setTimeout(() => { if (!frame.ready) { $loading.classList.add("gone"); $dot.textContent = "runtime slow to respond"; } }, 12000);
</script>
</body>
</html>
