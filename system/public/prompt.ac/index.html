<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>prompt.ac</title>
<meta name="description" content="prompt.ac — the HTML prompt for Aesthetic Computer." />
<meta name="theme-color" content="#463264" />
<link rel="icon" href="https://assets.aesthetic.computer/favicon.png" />
<style>
  /* prompt.ac — the HTML prompt, sister of disks/prompt.mjs (the raster
     prompt) the way laklok.com's vector client sisters its raster piece.
     At the prompt the DOM owns the whole screen: crisp typed line + block
     caret, login state. The AC runtime
     stays booted in a hidden iframe as the command brain (prompt.mjs still
     parses, aliases, and halts every command via the prompt:dom-input
     bridge); it becomes visible only while a piece is on stage. The palettes
     mirror `scheme` in disks/prompt.mjs — keep them in lockstep.

     Interaction mirrors TextInput.act() in lib/type.mjs: the line is either
     activated (canType — blinking caret, curtain down) or deactivated (the
     login curtain — the auth buttons — stands). Backdrop taps and typing
     activate; a backdrop tap or Escape on an empty line deactivates. The
     blips (300 press, 250 deactivate, 850 run) are the same sines type.mjs
     plays, WebAudio'd here because the hidden runtime never sees these keys. */

  @font-face {
    font-family: "Berkeley Mono Web";
    src: url("https://aesthetic.computer/type/webfonts/BerkeleyMonoVariable-Regular.woff2") format("woff2");
    font-display: swap;
  }

  :root { /* prompt.mjs scheme.dark */
    /* The runtime's mouse cursors (cursors/precise.svg + active.svg),
       inlined so the shell wears them on any origin. */
    --cursor-precise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 25 25'><path d='M13 3v3M13 20v3M6 13H3M20 13h3' stroke='black' stroke-width='4' stroke-linecap='round'/><circle cx='13' cy='13' r='2' fill='black'/><path d='M12 2v3M12 19v3M5 12H2M19 12h3' stroke='%2300ffff' stroke-width='4' stroke-linecap='round'/><circle cx='12' cy='12' r='2' fill='white'/></svg>") 12 12;
    --cursor-active: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='-1 -1 27 27'><path d='M13 2v3M13 21v3M2 13h3M21 13h3' fill='none' stroke='black' stroke-width='4' stroke-linecap='round'/><path d='M12 1v3M12 20v3M1 12h3M20 12h3' fill='none' stroke='%2300ffff' stroke-width='4' stroke-linecap='round'/></svg>") 12 12;
    --bg:        rgb(70, 50, 100);
    --text:      #fff;
    --ghost:     rgba(200, 30, 100, .78);  /* scheme.prompt */
    --block:     rgb(200, 30, 100);        /* the blinking block caret */
    --highlight: rgb(255, 100, 0);         /* selection */
    --dim:       rgba(255, 255, 255, .45);
    --scrim:     rgba(70, 50, 100, .82);   /* prompt-over-piece curtain */
    --star:      rgba(255, 255, 255, .5);
    --login-bg:  rgb(0, 0, 64);    --login-edge:  #fff;
    --signup-bg: rgb(0, 64, 0);    --signup-edge: #fff;
    --profile-bg: rgb(64, 0, 64);  --profile-text: rgb(255, 100, 255);
    --font: "Berkeley Mono", "Berkeley Mono Web", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { /* prompt.mjs scheme.light — legal pad */
      --bg:        rgb(252, 247, 197);
      --text:      rgb(40, 30, 90);
      --ghost:     rgba(60, 40, 120, .6);
      --block:     rgb(56, 122, 223);
      --highlight: rgb(255, 207, 105);
      --dim:       rgba(40, 30, 90, .5);
      --scrim:     rgba(252, 247, 197, .88);
      --star:      rgba(40, 30, 90, .35);
      --login-bg:  rgb(0, 0, 128);
      --signup-bg: rgb(0, 128, 0);
      --profile-bg: rgb(128, 0, 128);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { font-family: var(--font); color: var(--text); overflow: hidden; cursor: var(--cursor-precise), auto; }
  #cmd { cursor: var(--cursor-precise), text; }
  button, .corner { cursor: var(--cursor-active), pointer; }
  ::selection { background: var(--highlight); color: var(--bg); }

  /* ── Stage: the hosted runtime. While the DOM prompt owns the screen the
     stage stays inert underneath the opaque #screen — never visibility:hidden,
     because Chrome throttles rendering for hidden cross-origin iframes and
     the runtime's boot/load loop would stall (same-origin dev masks this). ── */
  .stage { position: absolute; inset: 0; background: #000; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  body[data-mode="prompt"] .stage { pointer-events: none; }

  /* ── The prompt screen ─────────────────────────────────────────────── */
  #screen {
    position: absolute; inset: 0; z-index: 3;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg);
  }
  body[data-mode="prompt"] #screen { display: flex; }
  /* Slash-prompt over a running piece: same screen as a translucent curtain. */
  body[data-mode="piece"] #screen.overlay { display: flex; background: var(--scrim); }
  body[data-mode="piece"] #screen.overlay .auth,
  body[data-mode="piece"] #screen.overlay .flair { display: none; }

  /* Drifting star flecks — a whisper of the raster prompt's flair. */
  .flair, .flair::after {
    content: ""; position: absolute; inset: -60px; pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, var(--star) 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 12%, var(--star) 50%, transparent 51%),
      radial-gradient(1px 1px at 34% 68%, var(--star) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 88% 74%, var(--star) 50%, transparent 51%),
      radial-gradient(1px 1px at 55% 38%, var(--star) 50%, transparent 51%);
    opacity: .35;
    animation: drift 80s linear infinite;
  }
  .flair::after { animation-duration: 130s; animation-direction: reverse; transform: scale(1.6); }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(60px, 60px); } }

  /* ── Typed line — top-left like the raster TextInput, crisp DOM text. ── */
  .line {
    position: absolute;
    top: max(8px, env(safe-area-inset-top));
    left: max(8px, env(safe-area-inset-left));
    right: max(8px, env(safe-area-inset-right));
  }
  #cmd {
    width: 100%; min-width: 0; padding: 0; margin: 0;
    background: transparent; border: 0; outline: 0;
    color: var(--text); font-family: var(--font);
    font-size: clamp(20px, 2.6vw, 30px); line-height: 1.3;
    caret-color: transparent; /* the block caret below replaces the bar */
  }
  /* ── Native autocomplete — the raster's in-view completions: the best
     match's remainder ghosts onto the typed line, the rest stack beneath
     as faint rows (history rows ride the same rail), Tab completes. ── */
  #ghost {
    position: absolute; top: 0; left: 0; pointer-events: none;
    font-size: clamp(20px, 2.6vw, 30px); line-height: 1.3;
    white-space: pre; color: var(--dim); opacity: .55;
  }
  #ghost .pad { color: transparent; }
  /* ── KidLisp on the line — the runtime's syntax palette, DOM'd: typed
     source renders through a colored underlay while the input's own text
     goes clear (the block caret stays). ── */
  #lisp {
    position: absolute; top: 0; left: 0; pointer-events: none;
    font-size: clamp(20px, 2.6vw, 30px); line-height: 1.3;
    white-space: pre;
  }
  body.kidlisp #cmd { color: transparent; }
  body.kidlisp #cmd::selection { color: transparent; }
  .corner span[style] { text-shadow: 1px 1px 0 rgba(0, 0, 0, .75); }
  #results {
    position: absolute; left: 0; right: 0;
    top: calc(1.3 * clamp(20px, 2.6vw, 30px));
    font-size: clamp(20px, 2.6vw, 30px); line-height: 1.3;
    white-space: pre; overflow: hidden;
  }
  #results .row { opacity: .4; cursor: var(--cursor-active), pointer; }
  #results .row .desc { opacity: .55; }
  #results .row.sel { opacity: .95; }
  #results .row:hover { opacity: .8; }
  #results .row.wg { color: rgb(255, 100, 255); }
  #results .row.hist { color: rgb(140, 90, 235); cursor: var(--cursor-active), pointer; }
  #caret {
    position: absolute; top: 0; left: 0; height: 1.3em; width: .62em;
    background: var(--block); pointer-events: none;
    font-size: clamp(20px, 2.6vw, 30px);
    animation: blink 1s steps(2, start) infinite;
  }
  /* The caret only blinks while the line is activated (canType in type.mjs);
     deactivated text sits dimmed behind the curtain, like the raster's. */
  #caret { display: none; }
  body.active[data-mode="prompt"] #caret,
  body.active[data-mode="piece"] #screen.overlay #caret { display: block; }
  body:not(.active) #cmd { opacity: .55; }
  @keyframes blink { 50% { opacity: 0; } }
  #measure {
    position: absolute; visibility: hidden; white-space: pre;
    font-family: var(--font); font-size: clamp(20px, 2.6vw, 30px);
  }

  /* ── Reply + notice — the prompt's answer line and error flashes, DOM'd. ── */
  .reply, .notice {
    position: absolute;
    top: calc(max(8px, env(safe-area-inset-top)) + clamp(32px, 4vw, 46px));
    left: max(8px, env(safe-area-inset-left));
    right: max(8px, env(safe-area-inset-right));
    font-size: clamp(16px, 2vw, 22px); line-height: 1.4;
  }
  .reply { color: var(--text); opacity: .92; white-space: pre-wrap; word-break: break-word; }
  .reply .dots { display: none; color: var(--block); letter-spacing: 2px; }
  body.thinking .reply .dots { display: inline; animation: think 1.2s steps(4) infinite; }
  @keyframes think { 0% { clip-path: inset(0 100% 0 0); } 100% { clip-path: inset(0 -10% 0 0); } }
  .notice {
    right: auto; max-width: 80vw;
    padding: 2px 10px; font-weight: 700;
    transition: opacity .5s;
  }
  .notice.gone { opacity: 0; }

  /* ── Login / I'm new / profile — ui.TextButton, vectorized. This is the
     login curtain (showLoginCurtain in prompt.mjs): it stands only while
     the line is deactivated, empty, and quiet (no reply). ─────────────── */
  .auth { display: flex; gap: 14px; transition: opacity .35s; }
  body.active .auth, body.typing .auth,
  body.replying .auth, body.submitting .auth { opacity: 0; pointer-events: none; }
  .auth button {
    font-family: var(--font); font-size: clamp(14px, 1.6vw, 18px);
    color: #fff; padding: 7px 16px; cursor: var(--cursor-active), pointer;
    border: 1px solid var(--login-edge);
    box-shadow: 2px 2px 0 rgba(0, 0, 0, .55);
    background: var(--login-bg);
  }
  .auth button:hover { filter: brightness(1.6); }
  .auth button:active { transform: translate(2px, 2px); box-shadow: none; }
  .auth #signup { background: var(--signup-bg); }
  .auth #profile { background: var(--profile-bg); color: var(--profile-text); border-color: var(--profile-text); }
  .auth button[hidden] { display: none; }

  /* ── Corner label — the DOM twin of the composited HUD label: the piece
     name in the prompt's own type, drop-shadowed, no box. ─────────────── */
  .corner {
    position: absolute; z-index: 4;
    top: max(8px, env(safe-area-inset-top));
    left: max(8px, env(safe-area-inset-left));
    display: none; cursor: var(--cursor-active), pointer; user-select: none;
    color: #fff; font-family: var(--font);
    font-size: clamp(20px, 2.6vw, 30px); line-height: 1.3;
    text-shadow: 1px 1px 0 rgba(0, 0, 0, .75);
  }
  body[data-mode="piece"] .corner { display: block; }
  body[data-mode="piece"] #screen.overlay ~ .corner { display: none; }
  .corner:hover { color: var(--highlight); }

  /* ── Boot loader — only when deep-linking straight into a piece. ────── */
  .loading {
    position: absolute; inset: 0; z-index: 5; display: none;
    align-items: center; justify-content: center;
    color: var(--dim); font-size: 13px; letter-spacing: .5px; pointer-events: none;
    transition: opacity .4s; background: var(--bg);
  }
  .loading.on { display: flex; }
  .loading.gone { opacity: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
</style>
</head>
<body data-mode="prompt">
  <div class="stage">
    <iframe id="ac" title="Aesthetic Computer" allow="microphone; camera; midi; autoplay; clipboard-read; clipboard-write; fullscreen; xr-spatial-tracking"></iframe>
  </div>

  <div id="screen">
    <div class="flair"></div>
    <div class="line">
      <span id="ghost" aria-hidden="true"></span>
      <span id="lisp" aria-hidden="true"></span>
      <input id="cmd" aria-label="Aesthetic Computer prompt"
             autocomplete="off" autocapitalize="off" autocorrect="off"
             spellcheck="false" enterkeyhint="go" />
      <span id="caret"></span>
      <span id="measure"></span>
      <div id="results" role="listbox"></div>
    </div>
    <div class="reply" id="reply" hidden><span class="dots">▪▪▪</span><span id="replyText"></span></div>
    <div class="notice" id="notice" hidden></div>
    <div class="auth" id="auth" hidden>
      <button id="login">Log in</button>
      <button id="signup">I'm new</button>
      <button id="profile" hidden></button>
    </div>
  </div>

  <div class="corner" id="corner" title="back to prompt"><span id="cornerName"></span></div>
  <div class="loading" id="loading">booting aesthetic computer&hellip;</div>
  <span class="sr-only" id="dot" role="status">runtime booting</span>

<script type="module">
const localRuntime = ["localhost", "127.0.0.1", "::1"].includes(location.hostname);
const runtimeOverride = localRuntime
  ? new URLSearchParams(location.search).get("runtime")
  : null;
const runtimeOrigin = runtimeOverride || (localRuntime
  ? location.origin
  : "https://aesthetic.computer");
const { ACFrame } = await import(`${runtimeOrigin}/html/lib/moat.mjs`);

const $ = (id) => document.getElementById(id);
const $cmd = $("cmd"), $caret = $("caret"), $measure = $("measure");
const $ghost = $("ghost"), $results = $("results"), $lisp = $("lisp");
const $screen = $("screen"), $corner = $("corner"), $cornerName = $("cornerName");
const $auth = $("auth"), $login = $("login"), $signup = $("signup"), $profile = $("profile");
const $reply = $("reply"), $replyText = $("replyText"), $notice = $("notice");
const $loading = $("loading"), $dot = $("dot");
const $ac = $("ac");
const frame = new ACFrame($ac, { origin: runtimeOrigin });
let pendingJump = null;
let pendingSubmit = null; // command typed before the runtime's prompt was live
let promptLive = false; // the runtime's prompt piece is loaded + interactive
let lastSubmitted = ""; // suppress the runtime echoing a command back as a "reply"
let noticeTimer, submitTimer;

// ── Blips — the TextInput sounds from lib/type.mjs, rendered with a port
// of the AC synth envelope (lib/sound/synth.mjs by way of speaker.mjs):
// duration is seconds, attack and decay are fractions of that duration,
// and both ramps are linear. The hidden runtime never sees these keys, so
// the shell plays its exact ticks — same tones, same math, same lengths.
let audio;
function synth({ tone, volume, duration, attack, decay }) {
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = "sine";
    osc.frequency.value = tone;
    const t = audio.currentTime;
    const attackEnd = t + duration * attack;
    const decayStart = t + duration * (1 - decay); // decayFrames count back from the end
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(volume, attackEnd);
    if (decayStart > attackEnd) gain.gain.setValueAtTime(volume, decayStart);
    gain.gain.linearRampToValueAtTime(0, t + duration);
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + duration + 0.01);
  } catch {}
}
// The literal calls type.mjs makes on touch/activate, deactivate, and run.
const SND = {
  press: () => synth({ tone: 300, volume: 0.5, duration: 0.01, attack: 0.1, decay: 0.96 }),
  deactivate: () => synth({ tone: 250, volume: 0.75, duration: 0.001, attack: 0.1, decay: 0.99 }),
  run: () => synth({ tone: 850, volume: 0.65, duration: 0.005, attack: 0.1, decay: 0.96 }),
};

// ── Keypunch — the raster's AeCo_compkey sample, pitched notepat-style by
// the QWERTY music map in prompt.mjs and played on every edit of the line
// at the same randomized volume.
const KEY_MUSIC = {
  c: [0, -.7], v: [1, -.5], d: [2, -.6], s: [3, -.4], e: [4, -.5],
  f: [5, -.4], w: [6, -.3], g: [7, -.3], r: [8, -.2], a: [9, -.2],
  q: [10, -.1], b: [11, -.1], h: [12, .1], t: [13, .1], i: [14, .2],
  y: [15, .2], j: [16, .3], k: [17, .4], u: [18, .3], l: [19, .5],
  o: [20, .4], m: [21, .6], p: [22, .5], n: [23, .7], z: [-2, -.9], x: [-1, -.8],
};
let keySample; // the decoded compkey buffer
let lastKey = null; // last printable key — pitches the punch (lastPressedKey)
const safari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
fetch(`https://assets.aesthetic.computer/sounds/AeCo_compkey.${safari ? "m4a" : "ogg"}`)
  .then((r) => r.arrayBuffer())
  .then((buf) => {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    return audio.decodeAudioData(buf);
  })
  .then((decoded) => (keySample = decoded))
  .catch(() => {});
function keypunch() {
  if (!keySample) return;
  try {
    if (audio.state === "suspended") audio.resume();
    const src = audio.createBufferSource();
    src.buffer = keySample;
    const gain = audio.createGain();
    gain.gain.value = 0.2 + Math.random() * 0.4;
    const music = lastKey ? KEY_MUSIC[lastKey] : null;
    if (music) {
      src.playbackRate.value = Math.pow(2, (music[0] - 11) / 12); // centered like the raster
      const pan = audio.createStereoPanner();
      pan.pan.value = music[1];
      src.connect(gain).connect(pan).connect(audio.destination);
    } else {
      src.connect(gain).connect(audio.destination);
    }
    src.start();
  } catch {}
}

// ── Activation — canType in type.mjs. The login curtain (MOTD + auth)
// stands while the line is deactivated and empty; tapping the backdrop or
// typing tears it down, and tapping again (or Escape on an empty line)
// raises it back.
let active = false;
function activate({ silent = false } = {}) {
  if (!active) {
    active = true;
    document.body.classList.add("active");
    if (!silent) SND.press();
    clearReply(); // reactivating dismisses the last answer, like the raster
    document.body.classList.remove("submitting");
    refreshCompletions(); // history rows greet an empty activated line
  }
  $cmd.focus();
  syncCaret();
}
let deactivatedAt = 0; // guards against phantom refocus, as in type.mjs
function deactivate({ silent = false } = {}) {
  if (!active) return;
  active = false;
  document.body.classList.remove("active");
  if (!silent) SND.deactivate();
  deactivatedAt = performance.now();
  $cmd.blur();
  refreshCompletions(); // ghost + rows stand down with the line
}

// Deep links ride real paths like the raster site (prompt.ac/line): lith's
// resolver serves this shell for every piece-like prompt.ac path, and
// replaceState keeps the bar in sync without a request. A nested dev mount
// (localhost:8888/prompt.ac/) owns no paths, so it stays on hashes; old
// #piece links still resolve everywhere.
const nestedMount = location.pathname.startsWith("/prompt.ac");
const initial = decodeURIComponent(
  (!nestedMount && location.pathname !== "/" ? location.pathname.slice(1) : "") ||
  location.hash.slice(1),
) || "prompt";
let currentPiece = initial;
const frameParams = "nogap=true&nolabel=true&shellhtml=true";

function setMode(piece) {
  const wasPiece = document.body.dataset.mode === "piece";
  currentPiece = piece;
  const onPiece = piece !== "prompt";
  document.body.dataset.mode = onPiece ? "piece" : "prompt";
  document.body.dataset.piece = piece;
  document.title = onPiece ? piece + " · prompt.ac" : "prompt.ac";
  $screen.classList.remove("overlay");
  if (onPiece) { clearReply(); $notice.hidden = true; }
  // KidLisp pieces wear their syntax colors on the label, like the raster HUD.
  if (isKidlisp(piece)) $cornerName.replaceChildren(lispSpans(piece));
  else $cornerName.textContent = piece;
  // URLs keep AC's canonical kidlisp encoding: underscores for spaces.
  const urlPiece = piece.replaceAll(" ", "_");
  const target = onPiece
    ? (nestedMount ? location.pathname + location.search + "#" + urlPiece
                   : "/" + urlPiece + location.search)
    : (nestedMount ? location.pathname + location.search : "/" + location.search);
  if (location.pathname + location.search + location.hash !== target) {
    history.replaceState(null, "", target);
  }
  document.body.classList.remove("submitting"); // the command landed somewhere
  if (onPiece) { deactivate({ silent: true }); $ac.focus(); }
  // Landing home from a piece raises the login curtain (deactivated splash);
  // a repeat "prompt" report mid-typing must not blur the line.
  else if (wasPiece) deactivate({ silent: true });
  else syncCaret();
}
setMode(initial);
if (initial !== "prompt") $loading.classList.add("on");

// shellhtml keeps disk.mjs's composited prompt and corner HUD off for the
// iframe's entire lifetime; the DOM above is the visible prompt.
$dot.textContent = "runtime booting";
frame.boot(initial, frameParams);

frame.onReady(() => {
  $dot.textContent = "runtime live";
  $loading.classList.add("gone");
});
frame.onBridgeReady(() => {
  askUser();
  if (pendingJump) {
    const destination = pendingJump;
    pendingJump = null;
    jumpPiece(destination);
  }
});
// The runtime reports every load via ac:piece (older builds: url:updated).
// A `prompt~…~!autorun` load is the prompt mid-execution — treat it as the
// prompt visually, but only a bare `prompt` accepts dom-input submits.
frame.onPiece((slug) => {
  let name = (slug || "prompt").split("?")[0]; // reports can carry params
  // Reported kidlisp slugs arrive underscore-encoded; the display form is
  // the spaced source, exactly what the raster HUD shows. setMode re-encodes
  // the underscores when it writes the URL.
  if (isKidlisp(name)) name = name.replaceAll("_", " ");
  const atPrompt = name === "prompt" || name.startsWith("prompt~");
  let payload = atPrompt && name !== "prompt"
    ? decodeURIComponent(name.slice("prompt~".length)).replaceAll("~", " ")
    : "";
  if (isKidlisp(payload)) payload = payload.replaceAll("_", " ");
  const autorun = payload.includes("!autorun");
  // A prompt~text report without !autorun is a prefill: the runtime's
  // Backspace-from-a-piece shortcut lands here with the old slug typed and
  // its prompt interactive, so the DOM line mirrors both.
  promptLive = name === "prompt" || (atPrompt && !autorun);
  setMode(atPrompt ? "prompt" : name);
  if (payload && !autorun) {
    activate({ silent: true });
    setTyped(payload);
  }
  if (promptLive && pendingSubmit) {
    const queued = pendingSubmit;
    pendingSubmit = null;
    sendSubmit(queued);
  }
});

// Corner chip → back to the prompt (the DOM twin of the composited label).
$corner.addEventListener("click", () => jumpPiece("prompt"));

function jumpPiece(value) {
  const v = String(value || "").trim();
  if (!v) return;
  // Queue early commands until the runtime bridge is up, then use the
  // ac:navigate path proven by top.kidlisp.com; the iframe src stays put.
  if (frame.bridgeReady) {
    $ac.contentWindow.postMessage({ type: "ac:navigate", to: v }, "*");
  } else {
    pendingJump = v;
  }
}

function sendSubmit(text) {
  lastSubmitted = text;
  $ac.contentWindow.postMessage({
    type: "prompt:dom-input", text, active: true, submit: true,
  }, "*");
}

// ── Reply + notice — DOM renditions of the raster prompt's feedback. ──────
// The runtime mirrors its TextInput out whenever it changes (LLM replies to
// unknown words, command confirmations, the thinking state); notices arrive
// as colored flashes.
function showReply(text, thinking) {
  const t = String(text || "");
  const fresh = t && t !== lastSubmitted ? t : "";
  document.body.classList.toggle("thinking", thinking);
  $replyText.textContent = fresh;
  $reply.hidden = !fresh && !thinking;
  document.body.classList.toggle("replying", !$reply.hidden);
  // A bare echo of the submitted command means it's still executing — keep
  // the curtain held; anything else (reply, thinking, cleared line) settles it.
  if (thinking || t !== lastSubmitted) document.body.classList.remove("submitting");
}
function clearReply() {
  lastSubmitted = "";
  document.body.classList.remove("thinking", "replying");
  $replyText.textContent = "";
  $reply.hidden = true;
}
function showNotice(text, color) {
  if (!text) return;
  $notice.textContent = String(text);
  $notice.style.color = color?.[0] || "white";
  $notice.style.background = color?.[1] || "maroon";
  $notice.hidden = false;
  $notice.classList.remove("gone");
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => $notice.classList.add("gone"), 2600);
}

function submitCommand(value, { remember = true } = {}) {
  const v = String(value || "").trim();
  if (!v) return;
  if (remember) pushHistory(v);
  const work = whistlegraphFromInput(v);
  if (work) { location.assign(work.url); return; }

  SND.run(); // the 850Hz execute blip from type.mjs
  if (currentPiece === "prompt") {
    // Seed and execute the real prompt TextInput. The DOM only supplies data;
    // command parsing, aliases, and halt() stay inside the prompt system.
    // Until the runtime's prompt reports live, hold the command — sending
    // mid-boot wedges the piece loader.
    if (promptLive && frame.bridgeReady) sendSubmit(v);
    else pendingSubmit = v;
  } else {
    // From a running piece, route through a fresh prompt load with autorun
    // so non-piece commands still use prompt.halt().
    jumpPiece(`prompt~${v}~!autorun`);
  }
  setTyped("");
  deactivate({ silent: true }); // the raster deactivates after running
  // Hold the curtain down while the command lands (a piece load or a reply
  // takes over from here; the timeout catches commands that answer with
  // neither).
  document.body.classList.add("submitting");
  clearTimeout(submitTimer);
  submitTimer = setTimeout(() => document.body.classList.remove("submitting"), 8000);
  if (currentPiece !== "prompt") { $screen.classList.remove("overlay"); $ac.focus(); }
}

// ── Block caret — the raster prompt's blinking block, in DOM. ──────────────
// A mirror span measures the text before the caret so the block lands exactly
// on the glyph grid, whatever font actually loaded.
function syncCaret() {
  const at = $cmd.selectionStart ?? $cmd.value.length;
  $measure.textContent = $cmd.value.slice(0, at) || "";
  const x = $measure.offsetWidth - $cmd.scrollLeft;
  $caret.style.transform = `translateX(${Math.max(0, x)}px)`;
  $caret.style.animation = "none";
  void $caret.offsetWidth; // restart the blink at full opacity on movement
  $caret.style.animation = "";
  document.body.classList.toggle("typing", $cmd.value.length > 0);
  renderLisp(); // keep the colored underlay glued to the input's scroll
}
for (const ev of ["input", "click", "keyup", "focus"]) $cmd.addEventListener(ev, syncCaret);
$cmd.addEventListener("input", () => {
  clearReply(); // typing dismisses the last answer
  keypunch(); // every edit punches, like the raster's prompt:text:replace
  refreshCompletions();
});
document.addEventListener("selectionchange", () => {
  if (document.activeElement === $cmd) syncCaret();
});
document.fonts?.ready?.then(syncCaret);

function setTyped(text) {
  $cmd.value = text;
  $cmd.setSelectionRange(text.length, text.length);
  syncCaret();
  refreshCompletions();
}

// ── Keyboard ───────────────────────────────────────────────────────────────
$cmd.addEventListener("keydown", (e) => {
  if (e.key.length === 1 && !e.metaKey && !e.ctrlKey) lastKey = e.key.toLowerCase();
  if (e.key === "Enter") {
    // Arrow-walking the completion rows makes Enter run the pick, as the
    // raster's navigated filter list does; otherwise the typed line runs.
    if (completionNavigated) acceptCompletion();
    submitCommand($cmd.value);
  } else if (e.key === "Tab" && completions.length > 0) {
    e.preventDefault();
    acceptCompletion();
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (completions.length > 1) navigateCompletions(-1);
    else recall(-1);
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    if (completions.length > 1) navigateCompletions(1);
    else recall(1);
  } else if (e.key === "Escape") {
    // Escape clears a typed line; on an empty line it deactivates — the
    // curtain returns at home, the slash-curtain drops back to its piece.
    const hadText = $cmd.value.length > 0;
    setTyped("");
    clearReply();
    if (currentPiece !== "prompt") {
      $screen.classList.remove("overlay");
      deactivate();
      $ac.focus();
    } else if (!hadText) {
      deactivate();
    }
  }
});

// At the prompt the line always owns typing (the stage is hidden + inert);
// over a piece, "/" or any printable key raises the slash-prompt curtain.
window.addEventListener("keydown", (e) => {
  // Skip keys the line already handled — even when its handler just blurred
  // it (a submit's Enter still bubbles here with focus already gone).
  if (e.target === $cmd || document.activeElement === $cmd) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  // Backspace over a piece is the classic eat-the-slug shortcut: the prompt
  // rises with the piece name typed, ready to chew backwards.
  if (currentPiece !== "prompt" && e.key === "Backspace") {
    e.preventDefault();
    $screen.classList.add("overlay");
    activate();
    setTyped(currentPiece);
    return;
  }
  const printable = e.key.length === 1;
  if (e.key === "/" || printable || e.key === "Enter" || e.key === "ArrowUp") {
    e.preventDefault();
    if (currentPiece !== "prompt") $screen.classList.add("overlay");
    activate(); // auto-activation blips, as in the raster's keyboard:down
    if (printable && e.key !== "/") {
      lastKey = e.key.toLowerCase();
      setTyped($cmd.value + e.key);
      keypunch();
    }
    else if (e.key === "ArrowUp") recall(-1);
    else syncCaret();
  }
});

// ── Backdrop taps — the press/lift dance of TextInput.act(). A press on the
// backdrop blips and activates on lift; a backdrop tap while active
// deactivates (raising the login curtain back, or dropping the slash-curtain
// to its piece). Buttons and the typed line itself opt out, the way
// backdropTouchOff shields the raster's buttons — clicking typed text
// places the caret, it never drops the line.
let pressedBackdrop = false;
$screen.addEventListener("pointerdown", (e) => {
  const onControl = e.target.closest("button, a, b");
  pressedBackdrop = !onControl && !e.target.closest("input");
  if (!active && !onControl) SND.press(); // the touch blip, before lift
});
$screen.addEventListener("pointerup", (e) => {
  if (e.target.closest("button, a, b")) { pressedBackdrop = false; return; }
  const onInput = e.target.closest("input");
  if (!active) {
    activate({ silent: true }); // the press already blipped
  } else if (pressedBackdrop && !onInput) {
    deactivate(); // typed text stays, dimmed — reactivating resumes it
    if (currentPiece !== "prompt") {
      setTyped("");
      $screen.classList.remove("overlay");
      $ac.focus();
    }
  }
  pressedBackdrop = false;
});

// The stage keeps rendering beneath the prompt screen; if the runtime grabs
// focus (its keyboard textarea does on boot), hand typing straight back.
window.addEventListener("blur", () => {
  if (active && currentPiece === "prompt" && document.activeElement === $ac) {
    setTimeout(() => $cmd.focus(), 0);
  }
});

// Keyboard-tab focus (or any stray focus) counts as quiet activation — except
// the browser's own refocus right after a deactivating blur (the raster's
// manualDeactivationTime guard, DOM'd).
$cmd.addEventListener("focus", () => {
  if (active) return;
  if (performance.now() - deactivatedAt < 150) { $cmd.blur(); return; }
  activate({ silent: true });
});

// ── Auth — the runtime (same origin as aesthetic.computer sessions) knows
// who's signed in; ask it over the bridge and mirror the raster buttons.
// Embedded login is delegated up to this shell by bios.mjs, so the buttons
// open the real site to authenticate, then the shell reloads to pick it up.
let userKnown = false, awaitingLogin = false;
function askUser(attempt = 0) {
  if (userKnown || !$ac.contentWindow) return;
  $ac.contentWindow.postMessage({ type: "ac:user?" }, "*");
  if (attempt < 4) setTimeout(() => askUser(attempt + 1), 2500 * (attempt + 1));
}
// In-place login: a named popup runs the Auth0 dance on the runtime origin
// (window.name survives the redirect round-trip); when the session lands,
// boot.mjs posts ac:login-complete back and the popup closes itself. Falls
// back to a tab + reload-on-return if the popup is blocked.
function beginLogin(mode) {
  const url = `${runtimeOrigin}/prompt~${mode}~!autorun`;
  const popup = window.open(url, "ac-login-popup",
    "width=480,height=760,menubar=no,toolbar=no,status=no");
  if (!popup) {
    awaitingLogin = true;
    window.open(url, "_blank", "noopener");
  }
}
function rebootRuntime() {
  userKnown = false;
  promptLive = false;
  frame.boot("prompt", frameParams);
}
$login.onclick = () => beginLogin("login");
$signup.onclick = () => beginLogin("imnew");
document.addEventListener("visibilitychange", () => {
  // Blocked-popup fallback: back from the login tab, reload for the session.
  if (awaitingLogin && document.visibilityState === "visible") location.reload();
});

window.addEventListener("message", (event) => {
  const data = event.data || {};
  if (event.source === $ac.contentWindow) {
    if (data.type === "ac:user") {
      userKnown = true;
      const user = data.user;
      $auth.hidden = false;
      if (user) {
        $login.hidden = $signup.hidden = true;
        $profile.hidden = false;
        $profile.textContent = user.handle
          ? (user.handle.startsWith("@") ? user.handle : "@" + user.handle)
          : "profile";
        $profile.onclick = () => jumpPiece("profile");
      } else {
        $login.hidden = $signup.hidden = false;
        $profile.hidden = true;
      }
    } else if (data.type === "login") {
      beginLogin("login"); // bios delegates embedded login up to the shell
    } else if (data.type === "logout") {
      location.reload();
    } else if (data.type === "ac:prompt-text") {
      showReply(data.text, data.thinking === true);
    } else if (data.type === "ac:notice") {
      showNotice(data.text, data.color);
    }
    return;
  }
  // The login popup reports its completed session; reboot the hidden runtime
  // so it picks the fresh Auth0 cache up (no shell reload needed).
  if (data.type === "ac:login-complete" && event.origin === runtimeOrigin) {
    rebootRuntime();
    return;
  }
  // Controller/protool-compatible remote jumps use the same persistent iframe.
  const destination = data.type === "ac:navigate"
    ? data.to
    : data.type === "promptac:load-piece"
      ? (data.slug || data.to)
      : null;
  if (typeof destination === "string" && destination.trim()) {
    jumpPiece(destination);
  }
});
window.promptAC = {
  load: jumpPiece,
  // Probe window: tmp/promptac-*.mjs assert against this.
  debug: () => ({
    active, completions: completions.map((c) => c.name), completionAt,
    ghost: $ghost.textContent, rows: $results.children.length,
    keySample: !!keySample, docs: Object.keys(commandDocs).length,
  }),
};

// ── Whistlegraph command feed. Non-conflicting codes work bare; collisions
// such as `line` keep their AC meaning and are exposed as `wg line` instead.
// The codes also ride the in-view completions below (no datalist popover).
const wgByCode = new Map();
const wgFeed = fetch("https://whistlegraph.org/api/commands")
  .then((res) => res.ok ? res.json() : null)
  .then((data) => {
    const commands = Array.isArray(data) ? data : data?.commands || [];
    for (const entry of commands) {
      if (!entry?.code) continue;
      wgByCode.set(String(entry.code).toLowerCase(), entry);
    }
    refreshCompletions();
  })
  .catch(() => {});

// ── Autocomplete — the raster prompt's docs.json (pieces + prompts, hidden
// dropped), prefix-matched like its activeCompletions: the best match's
// remainder ghosts onto the typed line, candidates stack beneath with their
// descriptions, Tab completes, arrows walk the rows, Enter runs the pick.
// With an empty activated line, recent history stacks there instead, purple
// and fading, exactly where the raster paints its own.
let commandDocs = {};
fetch(`${runtimeOrigin}/docs.json`)
  .then((r) => (r.ok ? r.json() : null))
  .then((d) => {
    if (!d) return;
    const all = { ...(d.pieces || {}), ...(d.prompts || {}) };
    for (const name of Object.keys(all)) {
      if (!all[name].hidden) commandDocs[name] = all[name];
    }
    refreshCompletions();
  })
  .catch(() => {});

const MAX_ROWS = 9;
let completions = []; // [{name, desc, wg}]
let completionAt = 0;
let completionNavigated = false; // arrows touched the list → Enter runs the pick

function refreshCompletions() {
  const typed = $cmd.value;
  completions = [];
  completionAt = 0;
  completionNavigated = false;
  // KidLisp source gets colors, not completions (the raster hides them too).
  if (active && typed && !/[ :~]/.test(typed) && !isKidlisp(typed)) {
    const t = typed.toLowerCase();
    for (const name of Object.keys(commandDocs)) {
      if (name.startsWith(t)) completions.push({ name, desc: commandDocs[name].desc });
    }
    completions.sort((a, b) => a.name.length - b.name.length || (a.name < b.name ? -1 : 1));
    for (const [code, entry] of wgByCode) {
      if (code.startsWith(t)) {
        completions.push({ name: entry.command || code, desc: entry.title || "Whistlegraph", wg: true });
      }
    }
    completions = completions.slice(0, MAX_ROWS);
  }
  renderCompletions();
}

function renderCompletions() {
  const typed = $cmd.value;
  const best = completions[completionAt];
  // The ghost: typed prefix rendered invisible so the remainder lands on the
  // glyph grid right after the caret (monospace makes this exact).
  if (best && !best.wg && best.name.length > typed.length && active) {
    $ghost.replaceChildren();
    const pad = document.createElement("span");
    pad.className = "pad";
    pad.textContent = typed;
    $ghost.append(pad, best.name.slice(typed.length));
  } else {
    $ghost.replaceChildren();
  }
  $results.replaceChildren();
  if (completions.length > 0) {
    completions.forEach((c, i) => {
      const row = document.createElement("div");
      row.className = "row" + (i === completionAt ? " sel" : "") + (c.wg ? " wg" : "");
      row.setAttribute("role", "option");
      row.textContent = (i === completionAt ? "> " : "  ") + c.name;
      if (c.desc) {
        const desc = document.createElement("span");
        desc.className = "desc";
        desc.textContent = " — " + c.desc;
        row.append(desc);
      }
      row.onpointerdown = (e) => e.stopPropagation(); // rows aren't backdrop
      row.onpointerup = (e) => e.stopPropagation();
      row.onclick = () => { acceptCompletion(i); submitCommand($cmd.value); };
      $results.append(row);
    });
  } else if (active && !typed && hist.length) {
    hist.slice(-5).reverse().forEach((h) => {
      const row = document.createElement("div");
      row.className = "row hist";
      row.textContent = "  " + h;
      row.onpointerdown = (e) => e.stopPropagation();
      row.onpointerup = (e) => e.stopPropagation();
      row.onclick = () => { setTyped(h); $cmd.focus(); };
      $results.append(row);
    });
    // Fade the stack the way the raster's history rows decay.
    [...$results.children].forEach((row, i) => { row.style.opacity = 0.45 / (i + 1); });
  }
}

function acceptCompletion(at = completionAt) {
  const pick = completions[at];
  if (!pick) return;
  setTyped(pick.name);
  keypunch(); // the raster punches on every text replace, tab included
}

function navigateCompletions(dir) {
  completionAt = (completionAt + dir + completions.length) % completions.length;
  completionNavigated = true;
  renderCompletions();
}

// ── KidLisp coloring — a static port of the runtime's palette
// (getNormalTokenColor / getFunctionColor / getParenthesesColor in
// lib/kidlisp.mjs). Execution-state colors (timing blinks, $code loading)
// stay the runtime's business; the line and label get the resting palette.
const LISP_PARENS = ["rgb(192,192,192)", "gold", "orange", "hotpink", "blueviolet", "deepskyblue", "limegreen"];
const LISP_MATH = ["+", "-", "*", "/", "%", "mod", "=", ">", "<", ">=", "<=", "abs", "sqrt", "min", "max"];
const LISP_SPECIAL = ["def", "if", "cond", "later", "once", "lambda", "let", "do"];
const LISP_KNOWN = ["wipe", "ink", "line", "box", "flood", "circle", "write", "paste", "stamp", "point", "poly", "embed", "print", "debug", "random", "sin", "cos", "tan", "floor", "ceil", "round", "noise", "choose", "?", "...", "..", "overtone", "mic", "amplitude", "melody", "speaker", "resolution", "lines", "wiggle", "shape", "scroll", "flip", "spin", "resetSpin", "smoothspin", "sort", "zoom", "blur", "contrast", "pan", "unpan", "mask", "unmask", "steal", "putback", "label", "len", "now", "die", "tap", "draw", "not", "range", "mul", "log", "no", "yes", "fade", "jump"];
const RAINBOW = ["red", "orange", "yellow", "green", "blue", "indigo", "violet"];

function isKidlisp(text) {
  const t = (text || "").trim();
  if (!t) return false;
  if (t.startsWith("(") || t.startsWith(";")) return true;
  if (/^\$[0-9A-Za-z]{4,12}$/.test(t) && (/\d/.test(t) || (/[a-z]/.test(t) && /[A-Z]/.test(t)))) return true;
  return t.includes(",") || t.includes("\n");
}

function lispSpans(source) {
  // Tokenize preserving whitespace runs, then color with the raster's rules.
  const toks = [];
  let i = 0;
  while (i < source.length) {
    const ch = source[i];
    let j;
    if (ch === ";") {
      j = source.indexOf("\n", i); if (j === -1) j = source.length;
      toks.push({ t: source.slice(i, j) });
    } else if (ch === '"') {
      j = i + 1; while (j < source.length && source[j] !== '"') j++;
      toks.push({ t: source.slice(i, Math.min(j + 1, source.length)) }); j = Math.min(j + 1, source.length);
    } else if (ch === "(" || ch === ")" || ch === ",") {
      j = i + 1; toks.push({ t: ch });
    } else if (/\s/.test(ch)) {
      j = i; while (j < source.length && /\s/.test(source[j])) j++;
      toks.push({ t: source.slice(i, j), ws: true });
    } else {
      j = i; while (j < source.length && !/[\s(),;"]/.test(source[j])) j++;
      toks.push({ t: source.slice(i, j) });
    }
    i = j;
  }
  const words = toks.filter((k) => !k.ws);
  const isNum = (t) => /^-?\d+(\.\d+)?$/.test(t);
  const frag = document.createDocumentFragment();
  const span = (text, color) => {
    const s = document.createElement("span");
    if (color) s.style.color = color;
    s.textContent = text;
    frag.append(s);
  };
  let depth = 0;
  toks.forEach((k) => {
    const t = k.t;
    if (k.ws) return span(t);
    const w = words.indexOf(k); // index among meaningful tokens
    const prev = words[w - 1]?.t, next = words[w + 1]?.t, next2 = words[w + 2]?.t;
    if (t === "(") { span(t, LISP_PARENS[depth % LISP_PARENS.length]); depth++; return; }
    if (t === ")") { depth = Math.max(0, depth - 1); return span(t, LISP_PARENS[depth % LISP_PARENS.length]); }
    if (t === ",") return span(t, LISP_PARENS[depth % LISP_PARENS.length]);
    if (t.startsWith(";")) return span(t, "gray");
    if (t.startsWith('"')) return span(t, "yellow");
    if (/^[$][0-9A-Za-z]+$/.test(t)) { span("$", "limegreen"); return span(t.slice(1), "lime"); }
    if (/^[#][0-9A-Za-z]{1,8}$/.test(t) && t.length > 1) { span("#", "magenta"); return span(t.slice(1), "orange"); }
    if (/^[!][0-9A-Za-z]+$/.test(t) && t.length > 1) { span("!", "cyan"); return span(t.slice(1), "teal"); }
    if (isNum(t)) {
      // RGB triplets glow their own channels, everything else is pink.
      const v = Math.max(0, Math.min(255, parseFloat(t)));
      if (isNum(next) && isNum(next2)) return span(t, `rgb(${v},0,0)`);
      if (isNum(prev) && isNum(next)) return span(t, `rgb(0,${v},0)`);
      if (isNum(prev) && isNum(words[w - 2]?.t)) return span(t, `rgb(0,${Math.round(v * 0.75)},${v})`);
      return span(t, "pink");
    }
    if (/^\d*\.?\d+[sf]!?(\.\.\.?)?$/.test(t)) return span(t, "yellow");
    if (t === "rainbow" || t === "p0") { [...t].forEach((c, ci) => span(c, RAINBOW[ci % RAINBOW.length])); return; }
    if (t === "zebra" || t === "p1") { [...t].forEach((c, ci) => span(c, ci % 2 ? "gray" : "white")); return; }
    if (t === "fade" || t.startsWith("fade:")) return span(t, "mediumseagreen");
    if (CSS.supports("color", t)) return span(t, t);
    if (prev === "(") { // function position
      if (LISP_MATH.includes(t)) return span(t, "lime");
      if (LISP_SPECIAL.includes(t)) return span(t, "purple");
      if (t === "repeat") return span(t, "magenta");
      return span(t, "cyan");
    }
    if (LISP_MATH.includes(t)) return span(t, "lime");
    if (t === "repeat") return span(t, "magenta");
    if (LISP_SPECIAL.includes(t)) return span(t, "purple");
    if (LISP_KNOWN.includes(t)) return span(t, "cyan");
    return span(t, "orange");
  });
  return frag;
}

function renderLisp() {
  const typed = $cmd.value;
  const lisp = active && isKidlisp(typed);
  document.body.classList.toggle("kidlisp", lisp);
  $lisp.replaceChildren();
  if (lisp) {
    $lisp.append(lispSpans(typed));
    $lisp.style.transform = `translateX(${-$cmd.scrollLeft}px)`;
  }
}

function whistlegraphFromInput(input) {
  const value = String(input || "").trim().toLowerCase();
  const explicit = value.match(/^wg(?:\s+|:)([a-z0-9]+)$/);
  if (explicit) return wgByCode.get(explicit[1]) || null;
  const entry = wgByCode.get(value);
  return entry?.bare ? entry : null;
}
wgFeed.then(() => {
  const work = whistlegraphFromInput(initial);
  if (work) location.replace(work.url);
});

// ── Tiny local command history (up/down recall). ───────────────────────────
const HKEY = "promptac:history";
let hist = []; try { hist = JSON.parse(localStorage.getItem(HKEY) || "[]"); } catch {}
let hi = hist.length;
function pushHistory(v) {
  if (hist[hist.length - 1] !== v) hist.push(v);
  if (hist.length > 100) hist = hist.slice(-100);
  hi = hist.length;
  try { localStorage.setItem(HKEY, JSON.stringify(hist)); } catch {}
}
function recall(dir) {
  if (!hist.length) return;
  hi = Math.max(0, Math.min(hist.length, hi + dir));
  setTyped(hist[hi] ?? "");
}

// Fallback: if the runtime never signals ready (old build / slow boot), lift
// the piece loader anyway so a deep-link is never stuck on it.
setTimeout(() => { if (!frame.ready) { $loading.classList.add("gone"); $dot.textContent = "runtime slow to respond"; } }, 12000);
</script>
