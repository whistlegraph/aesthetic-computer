<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube · MIME</title>
<style>
  html, body { margin:0; height:100%; background:#171526; color:white; overflow:hidden; }
  body { display:grid; place-content:center; font:18px system-ui; }
  #video { position:relative; width:100vw; height:max(200px, min(56.25vw, 72vh)); }
  #video iframe, #play { width:100%; height:100%; border:0; }
  #play { position:relative; display:block; padding:0; background:black; color:white; cursor:pointer; }
  #play img { width:100%; height:100%; object-fit:contain; }
  #play span { position:absolute; inset:0; display:grid; place-content:center; font-size:64px; text-shadow:0 2px 8px black; }
  #original { color:white; justify-self:center; padding:16px; }
  #error { margin:8px 16px 0; text-align:center; }
</style>
<div id="video"><button id="play" disabled aria-label="Play YouTube video"><img alt="YouTube video preview"><span aria-hidden="true">▶</span></button></div>
<p id="error" hidden></p>
<a id="original" target="_blank" rel="noopener">Watch on YouTube</a>
<script type="module" src="player.mjs"></script>
</html>
