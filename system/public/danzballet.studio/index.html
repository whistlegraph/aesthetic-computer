<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danz Ballet Studio</title>
    <meta
      name="description"
      content="A new space for movement, artistry, and ballet is taking shape. Danz Ballet Studio is coming soon."
    />
    <meta name="theme-color" content="#f9e3e8" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Danz Ballet Studio" />
    <meta property="og:title" content="Danz Ballet Studio" />
    <meta
      property="og:description"
      content="A new space for movement, artistry, and ballet is taking shape."
    />
    <meta property="og:url" content="https://danzballet.studio/" />
    <meta property="og:image" content="https://danzballet.studio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Danz Ballet Studio — coming soon" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Danz Ballet Studio" />
    <meta
      name="twitter:description"
      content="A new space for movement, artistry, and ballet is taking shape."
    />
    <meta name="twitter:image" content="https://danzballet.studio/og-image.png" />
    <link rel="icon" href="/logo.png" />
    <link rel="preload" href="/hero-pointe-shoes.jpg" as="image" />
    <style>
      :root {
        color-scheme: light;
        --paper: #f9e3e8;
        --paper-deep: #f4d3dc;
        --rose: #ec7ea1;
        --pink-soft: #f2a6bc;
        --ink: #6b4a55;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: linear-gradient(215deg, var(--paper) 0%, var(--paper-deep) 100%);
      }

      body {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
        color: var(--ink);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      body::before,
      body::after {
        position: fixed;
        inset: 0;
        content: "";
      }

      body::before {
        background: var(--paper) url("/hero-pointe-shoes.jpg") center / cover no-repeat;
        animation: hero-breathe 18s ease-in-out infinite alternate;
      }

      body::after {
        background:
          linear-gradient(90deg, rgba(249, 227, 232, 0.97) 0%, rgba(249, 227, 232, 0.82) 36%, rgba(244, 211, 220, 0.28) 72%),
          linear-gradient(215deg, rgba(255, 244, 246, 0.5) 0%, transparent 45%),
          linear-gradient(0deg, rgba(236, 126, 161, 0.08), transparent 52%);
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      main {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        min-height: 100svh;
        align-items: center;
        padding: clamp(28px, 7vw, 84px) clamp(24px, 8vw, 128px);
        text-align: left;
      }

      .mark {
        width: min(640px, 56vw);
        max-width: 100%;
        animation: logo-reveal 1.15s cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      h1 {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .brand-logo {
        display: block;
        width: 100%;
        /* interim rose grade of the hot-magenta mark — real fix is a two-tone
           re-export with Fía (see vault/fia/danz-site/VIBES-2026-08-15.md) */
        filter: hue-rotate(24deg) saturate(0.42) brightness(1.4)
          drop-shadow(0 14px 26px rgba(236, 126, 161, 0.22));
        animation: logo-float 7s ease-in-out 1.15s infinite;
        transform-origin: 48% 52%;
      }

      @keyframes logo-reveal {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.975);
          filter: blur(5px);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      @keyframes logo-float {
        0%,
        100% {
          transform: translate3d(0, 0, 0) rotate(-0.12deg);
        }

        50% {
          transform: translate3d(0, -7px, 0) rotate(0.12deg);
        }
      }

      @keyframes hero-breathe {
        from {
          transform: scale(1.005) translate3d(-0.15%, 0, 0);
        }

        to {
          transform: scale(1.035) translate3d(0.35%, -0.2%, 0);
        }
      }

      @media (max-width: 520px) {
        body::before {
          background-position: 68% center;
        }

        body::after {
          background:
            linear-gradient(0deg, rgba(249, 227, 232, 0.94), rgba(249, 227, 232, 0.72)),
            linear-gradient(90deg, rgba(244, 211, 220, 0.86), rgba(244, 211, 220, 0.3));
        }

        main {
          justify-items: center;
          padding: 28px 22px;
          text-align: center;
        }

        .mark {
          width: 100%;
        }

        .brand-logo {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body::before,
        .mark,
        .brand-logo {
          animation: none;
        }

        canvas {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>
    <main>
      <section class="mark" aria-label="Danz Ballet Studio, coming soon">
        <img class="brand-logo" src="/logo.png" alt="" />
        <h1>Danz Ballet Studio</h1>
      </section>
    </main>
    <script>
      (() => {
        const canvas = document.querySelector("#stage");
        const context = canvas.getContext("2d");
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let width = 0;
        let height = 0;
        let ratio = 1;
        let start = performance.now();

        function resize() {
          ratio = Math.min(devicePixelRatio || 1, 2);
          width = innerWidth;
          height = innerHeight;
          canvas.width = Math.round(width * ratio);
          canvas.height = Math.round(height * ratio);
          context.setTransform(ratio, 0, 0, ratio, 0, 0);
        }

        function ribbon(baseY, phase, color, time) {
          context.beginPath();
          for (let x = -20; x <= width + 20; x += 8) {
            const progress = x / width;
            const y =
              baseY +
              Math.sin(progress * Math.PI * 2.35 + phase + time * 0.16) * height * 0.055 +
              Math.sin(progress * Math.PI) * height * 0.025;
            if (x === -20) context.moveTo(x, y);
            else context.lineTo(x, y);
          }
          context.strokeStyle = color;
          context.lineWidth = 1;
          context.stroke();
        }

        function draw(now) {
          const time = reduced ? 0 : (now - start) / 1000;
          context.clearRect(0, 0, width, height);

          const glow = context.createRadialGradient(
            width / 2,
            height * 0.48,
            0,
            width / 2,
            height * 0.48,
            Math.min(width, height) * 0.55,
          );
          glow.addColorStop(0, "rgba(255, 244, 246, 0.55)");
          glow.addColorStop(0.55, "rgba(242, 166, 188, 0.12)");
          glow.addColorStop(1, "rgba(242, 166, 188, 0)");
          context.fillStyle = glow;
          context.fillRect(0, 0, width, height);

          ribbon(height * 0.28, 0, "rgba(236, 126, 161, 0.22)", time * 0.8);
          ribbon(height * 0.72, Math.PI, "rgba(242, 166, 188, 0.32)", time * 0.8);

          context.strokeStyle = "rgba(236, 126, 161, 0.28)";
          context.beginPath();
          context.moveTo(width * 0.12, height * 0.13);
          context.lineTo(width * 0.88, height * 0.13);
          context.moveTo(width * 0.12, height * 0.89);
          context.lineTo(width * 0.88, height * 0.89);
          context.stroke();

          if (!reduced) requestAnimationFrame(draw);
        }

        addEventListener("resize", resize, { passive: true });
        resize();
        draw(performance.now());
      })();
    </script>
  </body>
</html>
