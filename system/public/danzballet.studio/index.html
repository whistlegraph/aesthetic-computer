<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danz Ballet Studio</title>
    <meta
      name="description"
      content="A new space for movement, artistry, and ballet is taking shape. Danz Ballet Studio is coming soon."
    />
    <meta name="theme-color" content="#f7f0e9" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Danz Ballet Studio" />
    <meta property="og:title" content="Danz Ballet Studio" />
    <meta
      property="og:description"
      content="A new space for movement, artistry, and ballet is taking shape."
    />
    <meta property="og:url" content="https://danzballet.studio/" />
    <meta property="og:image" content="https://danzballet.studio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Danz Ballet Studio — coming soon" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Danz Ballet Studio" />
    <meta
      name="twitter:description"
      content="A new space for movement, artistry, and ballet is taking shape."
    />
    <meta name="twitter:image" content="https://danzballet.studio/og-image.png" />
    <link rel="icon" href="/logo.png" />
    <link rel="preload" href="/hero-pointe-shoes.jpg" as="image" />
    <style>
      :root {
        color-scheme: light;
        --paper: #f8f2eb;
        --wine: #7e263a;
        --rose: #d79aa3;
        --ink: #3d3030;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--paper);
      }

      body {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
        color: var(--ink);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      body::before,
      body::after {
        position: fixed;
        inset: 0;
        content: "";
      }

      body::before {
        background: var(--paper) url("/hero-pointe-shoes.jpg") center / cover no-repeat;
        animation: hero-breathe 18s ease-in-out infinite alternate;
      }

      body::after {
        background:
          linear-gradient(90deg, rgba(248, 242, 235, 0.94) 0%, rgba(248, 242, 235, 0.72) 36%, rgba(248, 242, 235, 0.08) 72%),
          linear-gradient(0deg, rgba(126, 38, 58, 0.06), transparent 52%);
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      main {
        position: relative;
        z-index: 2;
        display: grid;
        min-height: 100svh;
        align-items: center;
        padding: clamp(28px, 7vw, 84px) clamp(24px, 8vw, 128px);
        text-align: left;
      }

      .mark {
        width: min(570px, 52vw);
        animation: logo-reveal 1.15s cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      h1 {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .brand-logo {
        display: block;
        width: min(610px, 58vw);
        max-width: none;
        margin: clamp(-76px, -5vw, -42px) 0 clamp(-76px, -5vw, -42px) clamp(-86px, -6vw, -46px);
        filter: drop-shadow(0 18px 28px rgba(126, 38, 58, 0.08));
        animation: logo-float 7s ease-in-out 1.15s infinite;
        transform-origin: 48% 52%;
      }

      @keyframes logo-reveal {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.975);
          filter: blur(5px);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      @keyframes logo-float {
        0%,
        100% {
          transform: translate3d(0, 0, 0) rotate(-0.12deg);
        }

        50% {
          transform: translate3d(0, -7px, 0) rotate(0.12deg);
        }
      }

      @keyframes hero-breathe {
        from {
          transform: scale(1.005) translate3d(-0.15%, 0, 0);
        }

        to {
          transform: scale(1.035) translate3d(0.35%, -0.2%, 0);
        }
      }

      @media (max-width: 520px) {
        body::before {
          background-position: 68% center;
        }

        body::after {
          background:
            linear-gradient(0deg, rgba(248, 242, 235, 0.9), rgba(248, 242, 235, 0.64)),
            linear-gradient(90deg, rgba(248, 242, 235, 0.8), rgba(248, 242, 235, 0.22));
        }

        main {
          justify-items: center;
          padding: 28px 22px;
          text-align: center;
        }

        .mark {
          width: 100%;
        }

        .brand-logo {
          width: 100%;
          margin: -38px auto;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body::before,
        .mark,
        .brand-logo {
          animation: none;
        }

        canvas {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>
    <main>
      <section class="mark" aria-label="Danz Ballet Studio, coming soon">
        <img class="brand-logo" src="/logo.png" alt="" />
        <h1>Danz Ballet Studio</h1>
      </section>
    </main>
    <script>
      (() => {
        const canvas = document.querySelector("#stage");
        const context = canvas.getContext("2d");
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let width = 0;
        let height = 0;
        let ratio = 1;
        let start = performance.now();

        function resize() {
          ratio = Math.min(devicePixelRatio || 1, 2);
          width = innerWidth;
          height = innerHeight;
          canvas.width = Math.round(width * ratio);
          canvas.height = Math.round(height * ratio);
          context.setTransform(ratio, 0, 0, ratio, 0, 0);
        }

        function ribbon(baseY, phase, color, time) {
          context.beginPath();
          for (let x = -20; x <= width + 20; x += 8) {
            const progress = x / width;
            const y =
              baseY +
              Math.sin(progress * Math.PI * 2.35 + phase + time * 0.16) * height * 0.055 +
              Math.sin(progress * Math.PI) * height * 0.025;
            if (x === -20) context.moveTo(x, y);
            else context.lineTo(x, y);
          }
          context.strokeStyle = color;
          context.lineWidth = 1;
          context.stroke();
        }

        function draw(now) {
          const time = reduced ? 0 : (now - start) / 1000;
          context.clearRect(0, 0, width, height);

          const glow = context.createRadialGradient(
            width / 2,
            height * 0.48,
            0,
            width / 2,
            height * 0.48,
            Math.min(width, height) * 0.55,
          );
          glow.addColorStop(0, "rgba(215, 154, 163, 0.16)");
          glow.addColorStop(0.55, "rgba(215, 154, 163, 0.055)");
          glow.addColorStop(1, "rgba(215, 154, 163, 0)");
          context.fillStyle = glow;
          context.fillRect(0, 0, width, height);

          ribbon(height * 0.28, 0, "rgba(126, 38, 58, 0.28)", time);
          ribbon(height * 0.72, Math.PI, "rgba(215, 154, 163, 0.36)", time);

          context.strokeStyle = "rgba(126, 38, 58, 0.18)";
          context.beginPath();
          context.moveTo(width * 0.12, height * 0.91);
          context.lineTo(width * 0.88, height * 0.91);
          context.stroke();

          if (!reduced) requestAnimationFrame(draw);
        }

        addEventListener("resize", resize, { passive: true });
        resize();
        draw(performance.now());
      })();
    </script>
  </body>
</html>
