<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Jacquard weaving · Platter study</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f1e9;
        color: #242421;
        font:
          16px/1.45 system-ui,
          sans-serif;
      }
      main {
        max-width: 1100px;
        margin: auto;
        padding: clamp(18px, 4vw, 48px);
      }
      h1 {
        font:
          500 clamp(35px, 6vw, 65px) / 1.05 Georgia,
          serif;
        margin: 0 0 26px;
      }
      section {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      figure {
        margin: 0;
      }
      figure img {
        display: block;
        width: 100%;
        height: clamp(250px, 41vw, 460px);
        object-fit: contain;
        background: #e5e1d7;
      }
      h2 {
        font:
          500 23px/1.2 Georgia,
          serif;
        margin: 15px 0 6px;
      }
      p {
        margin: 5px 0;
      }
      small {
        font-size: 13px;
      }
      a {
        color: #234f4c;
        text-underline-offset: 3px;
      }
      footer {
        margin-top: 26px;
        border-top: 1px solid #a8a599;
        padding-top: 10px;
      }
      @media (max-width: 650px) {
        section {
          grid-template-columns: 1fr;
        }
        figure img {
          height: 360px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Research"><a href="/platter">Research Platter</a></nav>
      <h1>Jacquard weaving</h1>
      <section aria-label="Museum objects">
        <figure>
          <img
            src="/platter/jacquard/jacquard-1945.137.jpg"
            alt="Woven portrait of Joseph Marie Jacquard seated in a chair."
          />
          <figcaption>
            <h2>Portrait of Joseph Marie Jacquard</h2>
            <p>
              Woven by Carquillat after Jean-Claude Bonnefond. Produced by
              Didier Petit et Cie., Lyon, 19th century.
            </p>
            <p>
              <small
                >Art Institute of Chicago · Gift of Mrs. Chauncey B. Borland ·
                1945.137</small
              >
            </p>
            <p>
              <a href="https://www.artic.edu/artworks/149973">Museum record</a>
              ·
              <a href="/platter/jacquard/jacquard-1945.137.jpg" download
                >Download public-domain image</a
              >
            </p>
          </figcaption>
        </figure>
        <figure>
          <img
            src="https://framemark.vam.ac.uk/collections/2006AM0970/full/full/0/default.jpg"
            alt="Henry Walmsley’s woven tablecloth, photographed by the Victoria and Albert Museum."
          />
          <figcaption>
            <h2>Tablecloth</h2>
            <p>
              Henry Walmsley, Failsworth, 1851. Jacquard-woven silk damask and
              worsted.
            </p>
            <p>
              <small
                >Image © Victoria and Albert Museum, London · Given by Mrs M.
                W. Taylor · T.73-1972</small
              >
            </p>
            <p>
              <a href="https://collections.vam.ac.uk/item/O78916/"
                >Museum record</a
              >
              ·
              <a href="https://www.vam.ac.uk/info/va-websites-terms-conditions"
                >V&amp;A image terms</a
              >
            </p>
          </figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
