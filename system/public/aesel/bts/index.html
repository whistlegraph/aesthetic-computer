<div class="zone z-you"><p class="zone-name">your machine</p>
<div class="nd t-pink" id="n-aesel"><header><img src="/stack/icons/aesel.png" alt=""><b>aesel</b></header><p><img src="/stack/icons/apple.svg" alt=""><img src="/stack/icons/linux.svg" alt="">terminal <code>a</code> · <img src="/stack/icons/swift.svg" alt="">Mac · <img src="/stack/icons/windows.svg" alt="">Windows · iPhone · <code>aesel.app/try</code></p><p>holds the conversation and the files</p></div>
<div class="nd" id="n-work"><header><b>the workspace</b></header><p><code>.aesel/</code> on this disk: transcript, revisions v1 → v<i>n</i>, artifacts</p><p><code>/rollback</code> adds, never erases</p></div>
<div class="nd" id="n-tools"><header><b>tools the brain holds</b></header><p><code>ac_api</code> <code>ac_examples</code> <code>ac_outline</code> <code>ac_preview</code> <code>ac_frame</code></p><p>the preview writes its pixels back here</p></div>
<div class="nd" id="n-made"><header><b>made here, kept here</b></header><p>papers in XeLaTeX · Game Boy ROMs with GBDK · NES ROMs in 6502 · synthesized sound · brush-step pictures</p></div>
</div>
<div class="zone z-ac"><p class="zone-name">aesthetic computer</p>
<div class="nd" id="n-cf"><header><img src="/stack/icons/cloudflare.svg" alt=""><b>Cloudflare</b></header><p>DNS · proxy · cache for <code>aesthetic.computer</code> <code>prompt.ac</code> <code>aesel.app</code></p></div>
<div class="lith" id="n-lith"><header><img src="/stack/icons/digitalocean.svg" alt=""><img src="/stack/icons/caddy.svg" alt=""><img src="/stack/icons/nodedotjs.svg" alt=""><b>lith</b><code>lith.aesthetic.computer</code></header><p>one Express monolith behind Caddy on a DigitalOcean VPS</p>
<div class="nd t-teal" id="n-inf"><header><b>inference relay</b><code>/api/easel-inference</code></header><p>model allowlist · <img src="/stack/icons/braincell.png" alt="">braincells: a daily allowance, then a wallet</p></div>
<div class="nd t-teal" id="n-live"><header><b>live channel</b><code>/api/easel-live</code></header><p><img src="/stack/icons/redis.svg" alt="">Redis · every save, pushed to whoever is watching</p></div>
<div class="nd t-teal" id="n-pub"><header><b>publish</b><code>/api/register-piece</code></header><p>a presigned PUT to your bucket · <code>@you/name</code></p></div>
<div class="nd t-teal" id="n-tr"><header><b>transcripts</b><code>/api/easel-transcripts</code></header><p><img src="/stack/icons/mongodb.svg" alt="">MongoDB · shared with AC to improve Aesel</p></div>
<div class="nd t-teal" id="n-img"><header><b>picture tools</b><code>/api/easel-image</code></header><p><img src="/stack/icons/openai.svg" alt="">OpenAI or fal · five a day</p></div>
<div class="nd t-purple" id="n-auth"><header><img src="/stack/icons/auth0.svg" alt=""><b>sign-in</b><code>hi.aesthetic.computer</code></header><p>Auth0 · one @handle everywhere</p></div>
<div class="pair"><div class="nd" id="n-pay"><header><b>top-ups</b></header><p><img src="/stack/icons/stripe.svg" alt="">Stripe · <img src="/stack/icons/apple.svg" alt="">in-app · Tezos</p></div><div class="nd" id="n-rel"><header><b>releases</b></header><p><code>prompt.ac/aesel.sh</code> · self-update · DMG · EXE</p></div></div>
</div>
<div class="pair"><div class="nd" id="n-site"><header><b>the piece, live</b></header><p><code>aesthetic.computer/@you/name</code></p></div><div class="nd" id="n-spaces"><header><img src="/stack/icons/digitalocean.svg" alt=""><b>Spaces</b></header><p>your bucket · CDN</p></div></div>
</div>
<div class="zone z-eng"><p class="zone-name">brains</p>
<div class="nd t-purple" id="n-hosted"><header><img src="/stack/icons/openrouter.svg" alt=""><b>AC hosted</b><span class="pill">default</span></header><p>OpenRouter on AC's account: <img src="/stack/icons/anthropic.svg" alt="">Claude Opus and Sonnet 5.5 · <img src="/stack/icons/openai.svg" alt="">Luna · <img src="/stack/icons/deepseek.svg" alt="">DeepSeek · Kimi · Qwen · MiniMax</p><p>nothing to install; metered in braincells</p></div>
<div class="nd t-purple" id="n-claude"><header><img src="/stack/icons/anthropic.svg" alt=""><b>your Claude account</b></header><p>the <code>claude</code> CLI on your machine</p></div>
<div class="nd t-purple" id="n-codex"><header><img src="/stack/icons/openai.svg" alt=""><b>your Codex account</b></header><p>the <code>codex</code> CLI on your machine</p></div>
<div class="nd t-purple" id="n-open"><header><img src="/stack/icons/openrouter.svg" alt=""><b>open</b></header><p>OpenRouter with your own key · open-weight models</p></div>
<div class="nd t-ghost" id="n-relay"><header><b>personal relay</b></header><p><code>help.aesthetic.computer</code></p></div>
</div>
<div class="zone z-any"><p class="zone-name">anywhere</p>
<div class="nd t-teal" id="n-phone"><header><b>any phone</b></header><p>scans the QR, joins the channel; each save arrives and hot-reloads</p></div>
</div>
