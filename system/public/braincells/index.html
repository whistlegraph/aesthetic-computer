<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:; img-src 'self' https: data: blob:; font-src 'self'; frame-src https://verify.walletconnect.org https://hi.aesthetic.computer; base-uri 'none'; form-action 'none'">
<title>AC braincells</title>
<meta name="description" content="Buy braincells for Aesthetic Computer’s hosted text and code models.">
<link rel="stylesheet" href="checkout.css">
<main>
  <img class="brain" src="/aesthetic.computer/braincell.svg" alt="" width="64" height="64">
  <h1 id="quantity">Braincells</h1>
  <p id="lede">Braincells run AC’s hosted text and code models in Aesel and across AC. One balance covers every supported model. Purchased braincells never expire.</p>
  <p id="account">Loading…</p>
  <label id="pack-label" hidden>Amount <select id="pack" aria-label="Amount"></select></label>
  <p id="price"></p>
  <form id="signin" hidden>
    <label id="email-label">Email <input id="email" type="email" autocomplete="email" required></label>
    <label id="code-label" hidden>Code <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"></label>
    <button id="signin-go" type="submit">Email me a code</button>
    <a id="signin-web" hidden href="https://aesthetic.computer/">Sign in on aesthetic.computer</a>
  </form>
  <p id="wallet" hidden></p>
  <button id="connect" hidden>Connect wallet</button>
  <button id="pay" hidden>Pay in tez</button>
  <button id="check" class="secondary" hidden>Check payment</button>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="again" class="secondary" hidden>Buy more braincells</button>
  <p id="recipient" hidden>To <a href="https://tzkt.io/tz1gkf8EexComFBJvjtT1zdsisdah791KwBE" target="_blank" rel="noopener noreferrer">aesthetic.tez</a></p>
  <a id="return" hidden href="whistlegraph://braincells">Return to Whistlegraph</a>
</main>
<script src="vendor/beacon-sdk.min.js"></script>
<script type="module" src="checkout.mjs"></script>
</html>
