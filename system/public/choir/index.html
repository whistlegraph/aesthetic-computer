<!doctype html>
<!-- choir — pointer to the iPhone app. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="theme-color" content="#e2dbcc" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>choir</title>
  <meta name="description" content="Comments on culture." />
  <link rel="canonical" href="https://choir.ac/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="choir" />
  <meta property="og:title" content="choir" />
  <meta property="og:description" content="Comments on culture." />
  <meta property="og:url" content="https://choir.ac/" />
  <meta property="og:image" content="https://choir.ac/social.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Fía's hand-drawn flower in navy paint, beside the words choir, Comments on culture." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="choir" />
  <meta name="twitter:description" content="Comments on culture." />
  <meta name="twitter:image" content="https://choir.ac/social.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    :root { --desk: #e2dbcc; --ink: #1c1816; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: var(--desk); color: var(--ink); display: grid; place-items: center;
      padding: 24px 16px; font: 17px/1.5 "American Typewriter", "Courier New", ui-monospace, monospace; text-align: center; }
    main { width: min(100%, 420px); }
    .choir { position: relative; width: min(40vw, 168px); aspect-ratio: 1; margin: 0 auto 14px; }
    .choir img { position: absolute; inset: 0; width: 100%; height: 100%; will-change: transform; }
    /* The app's entrance: spring(response 0.7, damping 0.7) after 0.1 s. */
    .choir, h1, main > p, main > .get { transition: opacity .7s ease-out .1s, transform .7s cubic-bezier(.34, 1.4, .64, 1) .1s; }
    body:not(.shown) .choir { opacity: 0; transform: scale(.85); }
    body:not(.shown) main > p:first-of-type, body:not(.shown) h1 { opacity: 0; transform: translateY(8px); }
    body:not(.shown) main > .get, body:not(.shown) main > p.small { opacity: 0; transform: translateY(14px); }
    @media (prefers-reduced-motion: reduce) { .choir, main > p, main > .get { transition: none; } }
    h1 { margin: 0 0 6px; font-size: 40px; line-height: 1; font-weight: 700; letter-spacing: .5px; }
    p { margin: 0 0 26px; font-size: 16px; opacity: .8; }
    .get { display: inline-block; background: #3d78dc; color: #fff; text-decoration: none; padding: 11px 24px; border: 2px solid var(--ink);
      border-radius: 999px; box-shadow: 0 4px 0 var(--ink); font-weight: 700; }
    .get:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
    .small { margin: 22px 0 0; font-size: 13px; opacity: .75; }
    .small a { color: var(--ink); }
    .invite { font-size: 15px; margin-top: 4px; }
  </style>
</head>
<body>
<main>
  <div class="choir" aria-hidden="true"><img src="logo.png" alt=""></div>
  <h1>choir</h1>
  <p>Comments on culture</p>
  <p class="invite" id="invite" hidden></p>
  <a class="get" id="get" href="mailto:mail@aesthetic.computer?subject=choir%20invite">Get the iPhone app</a>
</main>
<script type="module" src="/aesthetic.computer/lib/visit-tracker.mjs"></script>
<script type="module">
  // choir.ac/?invite=CODE: say who sent it, and carry the code into the ask.
  const code = new URLSearchParams(location.search).get("invite");
  if (code) fetch("/api/choir?invite=" + encodeURIComponent(code))
    .then((r) => r.ok ? r.json() : null).then((i) => {
      if (!i) return;
      const el = document.getElementById("invite");
      el.textContent = i.claimed ? "This invite has been used." : `${i.from} invited you. Your code is ${i.code}.`;
      el.hidden = false;
      if (!i.claimed) document.getElementById("get").href = `mailto:mail@aesthetic.computer?subject=${encodeURIComponent("choir invite " + i.code)}`;
    }).catch(() => {});
</script>
<script type="module">
const track = (name, props = {}) => fetch("/api/choir?event=1", { method: "POST", keepalive: true, headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ name, props, surface: "web" }) }).catch(() => {});
track("pointer:open", { ref: document.referrer ? new URL(document.referrer).hostname : "" });
document.getElementById("get").onclick = () => track("pointer:get-app");

// The same breathing as the app (apple/choir/Sources/SingingMark.swift): a 3%
// bob, a ±3° sway and a 3% swell on the upswing.
const flower = document.querySelector(".choir img");
const still = matchMedia("(prefers-reduced-motion: reduce)");
function sing(ms) {
  const t = still.matches ? 0 : ms / 1000;
  const w = Math.sin(t * 1.6);
  flower.style.transform = `translateY(${-w * 3}%) rotate(${Math.sin(t * 1.1) * 3}deg) scale(${1 + Math.max(0, w) * 0.03})`;
  if (!still.matches) requestAnimationFrame(sing);
}
requestAnimationFrame(sing);
// Reveal on the first frame, or after 60 ms if frames aren't running yet
// (a background tab or a headless check), so the page is never left blank.
const show = () => document.body.classList.add("shown");
requestAnimationFrame(show); setTimeout(show, 60);
still.addEventListener?.("change", () => requestAnimationFrame(sing));
</script>
</body>
</html>
