<!doctype html>
<!-- choir — pointer to the iPhone app. The web room lives at ./room/. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>choir</title>
  <meta name="description" content="A room for people who work in art. News, discussion, free and for sale, by city. On iPhone." />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" />
  <style>
    :root { color-scheme: light dark; --paper: #f6f4ef; --ink: #1a1917; --dim: #6f6a60; --line: #d9d4c7; --accent: #b3261e; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #15151a; --ink: #f1efe9; --dim: #9a978f; --line: #34343d; --accent: #ff7b72; } }
    :root[data-theme="dark"] { --paper: #15151a; --ink: #f1efe9; --dim: #9a978f; --line: #34343d; --accent: #ff7b72; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: var(--paper); color: var(--ink); display: grid; place-items: center;
      font: 17px/1.5 system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; padding: 24px 16px; }
    main { max-width: 420px; text-align: center; }
    img { width: 112px; height: 112px; border-radius: 26px; border: 1px solid var(--line); }
    h1 { margin: 16px 0 4px; font-size: 40px; font-weight: 600; letter-spacing: -.03em; }
    p { margin: 0 0 20px; color: var(--dim); }
    .get { display: inline-block; background: var(--ink); color: var(--paper); text-decoration: none; padding: 12px 22px; border-radius: 999px; font-weight: 600; }
    .small { margin-top: 28px; font-size: 14px; }
    .small a { color: var(--dim); }
  </style>
</head>
<body>
<main>
  <img src="icon.png" alt="" />
  <h1>choir</h1>
  <p>A room for people who work in art. News, discussion, free and for sale, by city.</p>
  <a class="get" id="get" href="mailto:mail@aesthetic.computer?subject=choir%20invite">Ask for an iPhone invite</a>
  <p class="small">It's in private testing on TestFlight. <a href="room/">Or use the web room</a>.</p>
</main>
<script type="module" src="/aesthetic.computer/lib/visit-tracker.mjs"></script>
<script type="module">
const track = (name, props = {}) => fetch("/api/choir?event=1", { method: "POST", keepalive: true, headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ name, props, surface: "web" }) }).catch(() => {});
track("pointer:open", { ref: document.referrer ? new URL(document.referrer).hostname : "" });
document.getElementById("get").onclick = () => track("pointer:get-app");
document.querySelector(".small a").onclick = () => track("pointer:web-room");
</script>
</body>
</html>
