<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#eee9df" />
    <meta
      name="description"
      content="Paint with a proposing machine. Local brushes and AI image models, with your Aesthetic Computer account."
    />
    <link rel="canonical" href="https://nopaint.art/" />
    <link rel="icon" href="/nopaint.art/icons/icon-1024.png" />
    <link rel="stylesheet" href="/nopaint.art/ai/style.css" />
    <title>No Paint</title>
  </head>
  <body>
    <main id="studio" aria-label="No Paint">
      <div id="painting">
        <canvas
          id="canvas"
          width="256"
          height="256"
          aria-label="Current painting"
        ></canvas
        ><canvas
          id="overlay"
          width="256"
          height="256"
          aria-label="Crop or paint a mask"
        ></canvas>
        <div id="progress" hidden role="progressbar" aria-label="Generating">
          <span></span>
        </div>
      </div>
      <div id="decisions"></div>
      <div id="band">
        <button id="status" aria-label="Choose a model" aria-haspopup="dialog">
          Loading…</button
        ><input
          id="hint"
          maxlength="200"
          aria-label="Hint"
          placeholder="Hint"
          autocomplete="off"
          hidden
        />
      </div>
    </main>
    <dialog id="models">
      <header>
        <h1>Models</h1>
        <button
          id="more-actions"
          aria-label="Painting actions"
          aria-haspopup="dialog"
        >
          ⋯
        </button>
        <button data-close aria-label="Close">×</button>
      </header>
      <input
        id="search"
        type="search"
        placeholder="Find a model"
        aria-label="Find a model"
      />
      <p id="model-notice"></p>
      <div id="model-list"></div>
    </dialog>
    <dialog id="painting-actions">
      <header>
        <h1>Painting</h1>
        <button data-close aria-label="Close">×</button>
      </header>
      <div id="studio-actions" aria-label="Painting actions"></div>
    </dialog>
    <dialog id="model-details">
      <header>
        <h1 id="model-details-title"></h1>
        <button data-close aria-label="Close">×</button>
      </header>
      <dl id="model-details-list"></dl>
      <a id="model-source" target="_blank" rel="noopener" hidden
        >Provider details ↗</a
      >
    </dialog>
    <dialog id="account" data-ac-no-track>
      <header>
        <h1 id="account-title">AC account</h1>
        <button data-close aria-label="Close">×</button>
      </header>
      <p id="account-model" hidden></p>
      <div id="signed-in" hidden>
        <p id="balance"></p>
        <a
          href="https://aesthetic.computer/braincells"
          target="_blank"
          rel="noopener"
          >Braincells ↗</a
        ><button id="signout">Sign out</button>
      </div>
      <div id="signin-methods">
        <p>Scan with your phone to sign in with AC.</p>
        <canvas
          id="signin-qr"
          aria-label="Scan to sign in with AC"
          hidden
        ></canvas>
        <p id="qr-message" role="status"></p>
        <button id="qr-retry" type="button" hidden>New QR</button>
        <button id="redirect-login" type="button">
          Sign in on this device
        </button>
        <details id="email-link">
          <summary>Email me a sign-in link</summary>
          <form id="signin">
            <label
              >Email<input
                id="email"
                type="email"
                autocomplete="email"
                required
            /></label>
            <button id="sign-submit" type="submit">Send link</button>
          </form>
        </details>
      </div>
      <p id="account-message" role="status"></p>
    </dialog>
    <dialog id="brush-settings">
      <header>
        <h1>Brush</h1>
        <button data-close aria-label="Close">×</button>
      </header>
      <label>Change<select id="strength"></select></label>
      <label
        >Drag<select id="mode">
          <option value="zoom">Crop</option>
          <option value="inpaint">Paint a mask</option>
        </select></label
      >
      <p id="mode-label"></p>
      <button id="clear-mask" data-enabled="canChange">Clear Mask</button>
    </dialog>
    <dialog id="history">
      <header>
        <h1>History</h1>
        <button data-close aria-label="Close">×</button>
      </header>
      <div id="history-list"></div>
      <button id="history-export">Save history</button>
    </dialog>
    <dialog
      id="move-failure"
      aria-labelledby="failure-title"
      aria-describedby="failure-message failure-state failure-billing"
    >
      <header>
        <h1 id="failure-title">Model temporarily unavailable</h1>
        <button data-close aria-label="Close">×</button>
      </header>
      <p id="failure-message"></p>
      <p id="failure-state"></p>
      <p id="failure-billing"></p>
      <div id="failure-actions">
        <button id="failure-models">Choose another model</button>
        <button id="failure-classic">Use Classic</button>
      </div>
    </dialog>
    <dialog id="notice">
      <header>
        <h1 id="notice-title">No Paint</h1>
        <button data-close aria-label="Close">×</button>
      </header>
      <p id="notice-message"></p>
      <button id="notice-retry" hidden>Retry</button>
    </dialog>
    <script src="/aesthetic.computer/dep/jszip.min.js" defer></script>
    <script type="module" src="/nopaint.art/ai/app.mjs"></script>
  </body>
</html>
