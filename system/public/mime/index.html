<!doctype html>
<!-- Mime — discussion on media. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mime</title>
  <link rel="icon" href="https://aesthetic.computer/icon/128x128/prompt.png" type="image/png" />
  <link rel="stylesheet" href="https://aesthetic.computer/type/webfonts/berkeley-mono-variable.css" />
  <style>
    :root {
      color-scheme: light;
      --paper: #fafafa;
      --card: #f0f0f3;
      --card-edge: #d5d5df;
      --ink: #ac397f;
      --body: #1a1a2e;
      --dim: #63636f;
      --link: #087c84;
      --green: #237a53;
      --accent: #b52c44;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --paper: #1a1a2e;
        --card: #232337;
        --card-edge: #414156;
        --ink: #ff6b9d;
        --body: #e8e8e8;
        --dim: #a6a6b9;
        --link: #4ecdc4;
        --green: #6bcb77;
        --accent: #ff6b6b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--body);
      font: 14px/1.5 "Berkeley Mono Variable", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      padding-bottom: 4em;
    }
    a { color: var(--link); }
    a:hover { color: var(--ink); }
    :focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }
    ::selection { background: var(--ink); color: var(--paper); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 0.5em; text-align: left; padding: 1em 1em 0.4em; }
    .account { display: flex; align-items: center; justify-content: flex-end; gap: 0.5em; flex-wrap: wrap; font-size: 0.85em; }
    .account button { font: inherit; color: var(--link); background: var(--paper); border: 1px solid var(--card-edge); border-radius: 4px; min-height: 36px; padding: 0.3em 0.6em; cursor: pointer; }
    .account [role="status"] { max-width: 24ch; color: var(--accent); }
    .account [hidden] { display: none; }
    header h1 { flex-shrink: 0; margin: 0; color: var(--ink); line-height: 1; }
    .wordmark { display: inline-flex; align-items: center; min-height: 44px; color: inherit; text-decoration: none; }
    .wordmark svg { display: block; width: 108px; height: 33px; overflow: visible; }
    .wordmark .domain-suffix { width: 30px; height: 16px; align-self: flex-start; margin: 3px 0 0 2px; color: var(--link); }
    .wordmark:hover, .wordmark:focus-visible { color: var(--link); }
    .wordmark:active svg { transform: translateY(1px); }
    .pages { display: flex; justify-content: space-between; margin-top: 1em; }
    main { width: 100%; max-width: 80rem; margin: 0; padding: 0 1em; }
    h2 { color: var(--ink); font-size: 1.2em; }
    h2 a { color: inherit; }

    form#post {
      background: var(--card);
      border: 1px solid var(--card-edge);
      padding: 0.8em;
      margin-bottom: 1.5em;
      display: grid;
      gap: 0.5em;
    }
    form#post input[type="text"], form#post textarea {
      width: 100%;
      background: var(--paper);
      color: var(--body);
      border: 1px solid var(--card-edge);
      padding: 0.4em;
      font: inherit;
    }
    form#post textarea { min-height: 4.5em; resize: vertical; }
    form#post input[readonly] { color: var(--ink); border-color: transparent; background: transparent; }
    form#post button, .feed-more button {
      background: var(--ink); color: var(--paper);
      border: 0; border-radius: 4px; min-height: 44px;
      padding: 0.45em 1.2em; font: inherit; cursor: pointer;
      justify-self: start;
    }
    a.discussion {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; margin-top: 0.6em; padding: 0.4em 1em;
      border: 1px solid var(--ink); border-radius: 4px;
      background: var(--paper); color: var(--ink);
      font-weight: 500; text-decoration: none;
    }
    a.discussion:hover, a.discussion:active {
      background: var(--ink); color: var(--paper);
    }
    #status { color: var(--accent); }

    .post {
      background: var(--card);
      border: 1px solid var(--card-edge);
      padding: 0.6em 0.8em;
      margin: 0.5em 0;
      overflow-wrap: anywhere;
    }
    .post.op { border-left: 3px solid var(--ink); }
    .post .meta { font-size: 0.85em; color: var(--dim); margin-bottom: 0.3em; }
    .post .meta .name { color: var(--ink); font-weight: bold; }
    .post .meta a { color: var(--dim); }
    .post .filemeta { font-size: 0.8em; color: var(--dim); margin: 0.2em 0; }
    .post .filemeta a.typelink { color: var(--green); }
    .post .body { white-space: pre-wrap; margin-top: 0.4em; max-width: 72ch; }
    .post .body .gt { color: var(--green); }
    .post img, .post video { max-width: 100%; max-height: 70vh; height: auto; display: block; }
    .post audio { width: 100%; max-width: 28em; display: block; }
    .post iframe.doc { width: 100%; height: 24em; border: 1px solid var(--card-edge); background: #fff; }
    .post pre.textfile {
      max-height: 18em; overflow: auto; background: var(--paper);
      border: 1px solid var(--card-edge); padding: 0.6em; font-size: 0.85em;
    }
    .post .specimen { font-size: 2em; line-height: 1.2; }
    .post .blob {
      display: inline-block; background: var(--paper);
      border: 1px dashed var(--card-edge); padding: 0.8em 1.2em;
    }
    body.feed { padding: 0; overflow: hidden; }
    body.feed header { width: 100%; pointer-events: none; position: fixed; top: 0; left: 0; z-index: 2; padding-top: max(0.6em, env(safe-area-inset-top)); }
    body.feed header a, body.feed .account { pointer-events: auto; }
    body.feed header a { background: var(--paper); }
    body.feed main {
      max-width: none; padding: 0; height: 100vh; height: 100dvh;
      overflow-y: auto; overscroll-behavior-y: contain; scroll-snap-type: y mandatory;
    }
    .feed-list { width: 100%; }
    .post.feed-post {
      position: relative; height: 100vh; height: 100dvh; margin: 0; border: 0;
      padding: max(3.5rem, calc(env(safe-area-inset-top) + 2.5rem)) 0 max(0.75rem, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 0.5em; overflow: hidden;
      background: var(--paper); scroll-snap-align: start; scroll-snap-stop: always;
    }
    .feed-media {
      order: -1; flex: 1; min-height: 0; width: 100%; overflow: hidden;
      display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); place-items: center;
    }
    .feed-media > * { min-width: 0; min-height: 0; }
    .feed-media > img, .feed-media > video, .feed-media > iframe.doc {
      width: 100%; height: 100%; max-height: none; object-fit: contain; border: 0;
    }
    .feed-media > pre.textfile { width: 100%; height: 100%; max-height: none; margin: 0; border: 0; overscroll-behavior: contain; }
    .feed-media > audio { width: calc(100% - 2em); }
    .feed-media > .blob { max-width: calc(100% - 2em); }
    .feed-post > .meta { margin: 0 0.75rem; }
    .feed-post > .body { margin: 0 0.75rem; max-height: 15vh; overflow: auto; }
    .feed-post > .discussion { align-self: center; flex-shrink: 0; margin: 0; }
    .feed-more { position: absolute; top: max(3.75rem, calc(env(safe-area-inset-top) + 3rem)); right: 0.75rem; display: flex; align-items: center; gap: 0.5em; max-width: calc(100% - 9rem); }
    .feed-more button { padding: 0.3em 0.6em; }
    .feed-more [role="status"] { color: var(--dim); font-size: 0.85em; }
    body.feed main > p { margin: 4rem 0.75rem; }
    .omitted { color: var(--dim); font-size: 0.85em; margin: 0.3em 0; }
    .replies { margin-left: 1.5em; }
    @media (max-width: 40em) {
      .replies { margin-left: 0; }
      header { padding-left: 0.75rem; padding-right: 0.75rem; }
      main { padding: 0 0.75rem; }
      .post { padding: 0.6em; }
    }

  </style>
</head>
<body>
  <header>
    <h1>
      <a class="wordmark" href="https://aesthetic.computer/prompt" aria-label="mime.ac — return to Aesthetic Computer prompt">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 0 36 11" aria-hidden="true" focusable="false">
          <g fill="currentColor" transform="skewX(-8)">
            <path id="mime-m" d="M0 10V4H1V3H4V4H5V3H8V4H9V10H7V5H6V10H3V5H2V10Z"/>
            <path d="M12 0H14V2H12ZM12 4H14V10H12Z"/>
            <use href="#mime-m" x="17"/>
            <path fill-rule="evenodd" d="M28 4H29V3H33V4H34V7H30V8H34V10H29V9H28ZM30 5V6H32V5Z"/>
          </g>
        </svg>
        <svg class="domain-suffix" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 15 8" aria-hidden="true" focusable="false">
          <path fill="currentColor" fill-rule="evenodd" d="M0 5H2V7H0ZM4 2H8V3H9V7H4V4H7V3H4ZM6 5V6H7V5ZM11 2H14V3H12V4H11V5H12V6H14V7H11V6H10V3H11Z"/>
        </svg>
      </a>
    </h1>
    <div class="account">
      <span id="account-handle"></span>
      <button type="button" id="account-action">sign in</button>
      <span id="account-status" role="status"></span>
    </div>
  </header>
  <main id="view"></main>

<script>
const API = "/api/mime";
const view = document.getElementById("view");
let routeController;
let feedCache, activeFeed, feedObserver, playbackObserver;
history.scrollRestoration = "manual";
view.addEventListener("scroll", () => {
  if (activeFeed && activeFeed.viewportHeight === view.clientHeight) {
    activeFeed.index = Math.round(view.scrollTop / view.clientHeight);
  }
}, { passive: true });

const esc = (s) => s ?? "";
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const human = (n) =>
  n == null ? "" : n > 1048576 ? (n / 1048576).toFixed(1) + "MB" : n > 1024 ? (n / 1024).toFixed(0) + "KB" : n + "B";
const ago = (d) => {
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
};

// The type decides the renderer. This is the whole site, really.
function renderFile(file) {
  const [top, sub] = file.type.split("/");
  let media;
  if (top === "image") {
    media = el("img");
    media.src = file.url;
    media.alt = file.name;
    media.loading = "lazy";
  } else if (top === "audio") {
    media = el("audio");
    media.controls = true;
    media.preload = "none";
    media.src = file.url;
  } else if (top === "video") {
    media = el("video");
    media.controls = true;
    media.playsInline = true;
    media.preload = "metadata";
    media.src = file.url;
  } else if (file.type === "application/pdf" || file.type === "text/html") {
    media = el("iframe", "doc");
    media.setAttribute("sandbox", ""); // markup renders, scripts never run
    media.src = file.url;
    media.title = file.name;
  } else if (top === "text" || ["application/json", "application/xml", "application/javascript"].includes(file.type)) {
    media = el("pre", "textfile", "…");
    fetch(file.url).then((r) => r.text()).then((t) => {
      media.textContent = t.length > 8000 ? t.slice(0, 8000) + "\n…[truncated]" : t;
    }).catch(() => { media.textContent = "file unavailable"; });
  } else if (top === "font") {
    media = el("div", "specimen", "Sphinx of black quartz, judge my vow. 0123456789");
    const face = new FontFace("mc-" + file.url.split("=")[1], `url(${file.url})`);
    face.load().then((f) => {
      document.fonts.add(f);
      media.style.fontFamily = f.family;
    });
  } else {
    media = el("a", "blob", "download " + file.name);
    media.href = file.url;
    media.download = file.name;
  }
  return media;
}

function renderText(text) {
  const body = el("div", "body");
  for (const line of esc(text).split("\n")) {
    let node;
    if (/^>>\w+/.test(line)) {
      node = el("span");
      const code = line.match(/^>>(\w+)/)[1];
      const a = el("a", null, ">>" + code);
      a.href = "#/t/" + code;
      node.append(a, document.createTextNode(line.slice(code.length + 2)));
    } else if (line.startsWith(">")) {
      node = el("span", "gt", line);
    } else {
      node = el("span", null, line);
    }
    body.append(node, document.createTextNode("\n"));
  }
  return body;
}

function renderPost(post, isOp, inThread = false, contextBoard, inFeed = false) {
  const div = el(inFeed ? "article" : "div", "post" + (isOp ? " op" : "") + (inFeed ? " feed-post" : ""));
  div.id = post.code;
  const meta = el("div", "meta");
  meta.append(el("span", "name", esc(post.name) || "Anonymous"), document.createTextNode(" · " + ago(post.when) + " · "));
  const link = el("a", null, post.media ? (post.media.kind + (post.media.code ? " " + post.media.code : "")) : "No." + post.code);
  link.href = post.media ? post.media.url : "#/t/" + (post.parent || post.code);
  meta.append(link);
  div.append(meta);
  if (post.file) {
    const fm = el("div", "filemeta");
    const tl = el("a", "typelink", post.file.type);
    tl.href = "#/" + post.file.type;
    const dl = el("a", null, esc(post.file.name));
    dl.href = post.file.url;
    dl.download = post.file.name;
    if (post.file.type !== contextBoard) fm.append(tl, document.createTextNode(" · "));
    if (post.file.size != null) fm.append(document.createTextNode(human(post.file.size) + " · "));
    fm.append(dl);
    const file = renderFile(post.file);
    if (inFeed) {
      const frame = el("div", "feed-media");
      if (file.tagName === "VIDEO") { file.muted = true; file.loop = true; }
      frame.append(file);
      div.append(frame);
    } else div.append(fm, file);
  }
  if (post.text) div.append(renderText(post.text));
  if (!post.parent && !inThread) {
    const discuss = el("a", "discussion", "comment" + (post.replies ? " (" + post.replies + ")" : ""));
    discuss.href = "#/t/" + post.code + "?comment=1";
    div.append(discuss);
  }
  return div;
}

const AC_CLIENT = "LVdZaMbyXctkGfZDnpzDATB5nR0ZhmMt";
const AUTH_REDIRECT = location.origin + (location.hostname === "mime.ac" ? "/" : "/mime/");
const accountAction = document.getElementById("account-action");
const accountHandle = document.getElementById("account-handle");
const accountStatus = document.getElementById("account-status");
const AC_CACHE_PREFIX = "@@auth0spajs@@::" + AC_CLIENT + "::";
let identity = { token: null, handle: null };
let authClientPromise, identityPromise;

function hasAcSession() {
  try {
    return Object.keys(localStorage).some((key) => key.startsWith(AC_CACHE_PREFIX));
  } catch { return false; }
}

function hostSessionToken() {
  try {
    const encoded = localStorage.getItem("session-aesthetic");
    if (!encoded || encoded === "null") return null;
    const session = JSON.parse(atob(decodeURIComponent(encoded)));
    return typeof session.accessToken === "string" && session.account ? session.accessToken : null;
  } catch { return null; }
}

function authClient() {
  if (!authClientPromise) authClientPromise = (async () => {
    if (!window.auth0) await new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "/aesthetic.computer/dep/auth0-spa-js.production.js";
      script.onload = resolve;
      script.onerror = () => { script.remove(); reject(new Error("could not load sign-in — try again")); };
      document.head.append(script);
    });
    return new window.auth0.Auth0Client({
      domain: "https://hi.aesthetic.computer", clientId: AC_CLIENT,
      cacheLocation: "localstorage", useRefreshTokens: true,
      authorizationParams: { redirect_uri: AUTH_REDIRECT },
      httpTimeoutInSeconds: 30,
    });
  })().catch((error) => { authClientPromise = null; throw error; });
  return authClientPromise;
}

function refreshIdentity() {
  if (identityPromise) return identityPromise;
  const hostToken = hostSessionToken();
  if (!hostToken && !hasAcSession()) {
    identity = { token: null, handle: null };
    return Promise.resolve();
  }
  identityPromise = (async () => {
    let token = hostToken;
    if (!token) {
      const client = await authClient();
      try { token = await client.getTokenSilently(); }
      catch { throw new Error("sign in again to use your handle"); }
    }
    const response = await fetch(API + "?me=1", { headers: { Authorization: "Bearer " + token } });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "could not verify your handle");
    identity = { token, handle: data.handle };
  })().finally(() => { identityPromise = null; });
  return identityPromise;
}

function showIdentity(input) {
  if (identity.token) input.value = identity.handle || "";
  else if (input.readOnly) input.value = "";
  input.readOnly = !!identity.token;
  input.setAttribute("aria-label", identity.token ? "Commenting as" : "Name (optional)");
}

function showAccount() {
  accountHandle.textContent = identity.handle || "";
  accountAction.textContent = identity.token ? "sign out" : "sign in";
}

accountAction.onclick = async () => {
  accountAction.disabled = true;
  accountStatus.textContent = "";
  try {
    const client = await authClient();
    if (identity.token) {
      localStorage.removeItem("session-aesthetic");
      await client.logout({ logoutParams: { returnTo: AUTH_REDIRECT } });
    } else {
      const form = view.querySelector("#post");
      if (form) sessionStorage.setItem("mime-comment-draft", JSON.stringify({
        hash: location.hash, text: form.querySelector("textarea").value,
      }));
      await client.loginWithRedirect({ appState: { hash: location.hash || "#/" },
        authorizationParams: { redirect_uri: AUTH_REDIRECT } });
    }
  } catch (error) {
    accountStatus.textContent = error.message || "could not sign in";
    accountAction.disabled = false;
  }
};

function updateIdentity() {
  return refreshIdentity().then(() => {
    showAccount();
    const input = view.querySelector('[name="commenter"]');
    if (input) showIdentity(input);
  }).catch(() => { accountStatus.textContent = "sign in again to use your handle"; });
}
window.addEventListener("focus", updateIdentity);
window.addEventListener("storage", (event) => {
  if (!event.key || event.key === "session-aesthetic" || event.key.startsWith(AC_CACHE_PREFIX)) updateIdentity();
});

function postForm(parent) {
  const form = el("form");
  form.id = "post";
  const name = el("input");
  name.type = "text";
  name.placeholder = "Anonymous";
  name.setAttribute("aria-label", "Name (optional)");
  name.maxLength = 40;
  const text = el("textarea");
  text.placeholder = "comment";
  text.setAttribute("aria-label", "Comment");
  text.maxLength = 4000;
  name.name = "commenter";
  const button = el("button", null, "reply");
  const status = el("span");
  status.id = "status";
  status.setAttribute("role", "status");
  form.append(text, name, button, status);
  try {
    const draft = JSON.parse(sessionStorage.getItem("mime-comment-draft"));
    if (draft?.hash === location.hash && typeof draft.text === "string") text.value = draft.text;
  } catch {}
  refreshIdentity().then(() => showIdentity(name)).catch(() => {
    if (form.isConnected) status.textContent = "sign in again to use your handle";
  });

  document.ondragover = (e) => { e.preventDefault(); };
  document.ondrop = (e) => { e.preventDefault(); };

  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!text.value.trim()) { status.textContent = "empty reply"; return; }
    status.textContent = "posting…";
    button.disabled = true;
    try {
      await refreshIdentity();
      showIdentity(name);
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(identity.token ? { Authorization: "Bearer " + identity.token } : {}) },
        body: JSON.stringify({ name: name.value, text: text.value, parent }),
      });
      const out = await res.json();
      if (!res.ok) { status.textContent = out.error; return; }
      sessionStorage.removeItem("mime-comment-draft");
      history.replaceState(null, "", "#/t/" + (parent || out.code));
      await route();
    } catch (error) {
      status.textContent = error.message || "could not post — try again";
    } finally {
      button.disabled = false;
    }
  };
  return form;
}

function pages(page, hasMore, path) {
  const links = el("nav", "pages");
  links.setAttribute("aria-label", "Pages");
  if (page > 0) {
    const previous = el("a", null, "previous");
    previous.href = path + "?page=" + (page - 1);
    links.append(previous);
  }
  if (hasMore) {
    const next = el("a", null, "next");
    next.href = path + "?page=" + (page + 1);
    links.append(next);
  }
  return links;
}

async function home(page = 0, signal) {
  let state = feedCache?.startPage === page ? feedCache : null;
  if (!state) {
    const data = await read(API + "?page=" + page, signal);
    state = { startPage: page, nextPage: page + 1,
      hasMore: data.hasMore, nodes: [], codes: new Set(), index: 0 };
    for (const post of data.recent) {
      if (state.codes.has(post.code)) continue;
      state.codes.add(post.code);
      state.nodes.push(renderPost(post, false, false, undefined, true));
    }
    feedCache = state;
  }
  if (signal.aborted) return;
  const restoreIndex = state.index;
  const list = el("div", "feed-list");
  list.setAttribute("aria-label", "Media feed");
  state.nodes.forEach((node) => node.querySelector(".feed-more")?.remove());
  list.append(...state.nodes);
  view.replaceChildren(list);
  if (!state.nodes.length) list.append(el("p", null, "no media yet"));
  const more = el("div", "feed-more");
  const button = el("button", null, "load more");
  button.type = "button";
  const status = el("span");
  status.setAttribute("role", "status");
  more.append(button, status);
  const attachMore = () => {
    if (state.hasMore) (state.nodes.at(-1) || list).append(more);
    else more.remove();
  };
  attachMore();
  if ("IntersectionObserver" in window) {
    playbackObserver = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        for (const media of entry.target.querySelectorAll("video, audio")) {
          if (!entry.isIntersecting || entry.intersectionRatio < 0.6) media.pause();
          else if (media.tagName === "VIDEO" && !document.hidden) media.play().catch(() => {});
        }
      }
    }, { root: view, threshold: [0, 0.6] });
    state.nodes.forEach((node) => playbackObserver.observe(node));
  }
  let loading = false;
  const loadMore = async () => {
    if (loading || !state.hasMore || signal.aborted) return;
    loading = true;
    button.disabled = true;
    status.textContent = "loading…";
    list.setAttribute("aria-busy", "true");
    feedObserver?.disconnect();
    try {
      const data = await read(API + "?page=" + state.nextPage, signal);
      if (signal.aborted) return;
      for (const post of data.recent) {
        if (state.codes.has(post.code)) continue;
        state.codes.add(post.code);
        const node = renderPost(post, false, false, undefined, true);
        state.nodes.push(node);
        list.append(node);
        playbackObserver?.observe(node);
      }
      state.nextPage++;
      state.hasMore = data.hasMore;
      status.textContent = "";
      button.textContent = "load more";
      attachMore();
      if (state.hasMore) feedObserver?.observe(state.nodes.at(-1) || more);
    } catch (error) {
      if (!signal.aborted) {
        status.textContent = "could not load more posts";
        button.textContent = "try again";
      }
    } finally {
      loading = false;
      button.disabled = false;
      list.removeAttribute("aria-busy");
    }
  };
  button.onclick = loadMore;
  if ("IntersectionObserver" in window) {
    feedObserver = new IntersectionObserver((entries) => {
      if (entries.some((entry) => entry.isIntersecting)) loadMore();
    }, { root: view, rootMargin: "150% 0px" });
  }
  state.viewportHeight = view.clientHeight;
  activeFeed = state;
  requestAnimationFrame(() => {
    if (signal.aborted) return;
    view.scrollTop = restoreIndex * view.clientHeight;
    if (state.hasMore) feedObserver?.observe(state.nodes.at(-1) || more);
  });
}

async function board(name, page = 0, signal) {
  const data = await read(API + "?board=" + encodeURIComponent(name) + "&page=" + page, signal);
  view.replaceChildren();
  for (const t of data.threads) {
    view.append(renderPost(t.op, true, false, name));
    const omitted = t.replyCount - t.replies.length;
    if (omitted > 0) view.append(el("div", "omitted", omitted + " repl" + (omitted === 1 ? "y" : "ies") + " omitted"));
    const wrap = el("div", "replies");
    for (const r of t.replies) wrap.append(renderPost(r, false, false, name));
    view.append(wrap);
  }
  if (!data.threads.length) view.append(el("p", null, "no posts yet"));
  view.append(pages(page, data.hasMore, "#/" + name));
  return name;
}

async function thread(code, kind, signal) {
  const data = await read(API + (kind ? "?media=" + encodeURIComponent(kind) + "&code=" : "?thread=") + encodeURIComponent(code), signal);
  code = data.op.code;
  if (kind) history.replaceState(null, "", "#/t/" + code);
  const back = el("a", null, "← feed");
  back.href = "#/";
  view.replaceChildren(back, renderPost(data.op, true, true, data.op.board));
  const wrap = el("div", "replies");
  for (const r of data.replies) wrap.append(renderPost(r, false, false, data.op.board));
  view.append(wrap, postForm(code));
  return data.op.board;
}

async function read(url, signal) {
  const response = await fetch(url, { signal });
  const data = await response.json();
  if (signal?.aborted) throw new DOMException("Navigation changed", "AbortError");
  if (!response.ok) throw new Error(data.error || "could not load mime");
  return data;
}

async function route() {
  if (activeFeed) activeFeed.index = Math.round(view.scrollTop / view.clientHeight);
  activeFeed = null;
  feedObserver?.disconnect();
  feedObserver = null;
  playbackObserver?.disconnect();
  playbackObserver = null;
  view.querySelectorAll("video, audio").forEach((media) => media.pause());
  routeController?.abort();
  routeController = new AbortController();
  const { signal } = routeController;
  window.scrollTo(0, 0);
  document.ondragover = document.ondragleave = document.ondrop = document.onpaste = null;
  const [hash, query] = location.hash.replace(/^#\/?/, "").split("?");
  document.body.classList.toggle("feed", !hash);
  const params = new URLSearchParams(query);
  const page = Math.max(0, parseInt(params.get("page")) || 0);
  view.replaceChildren(el("p", null, "loading…"));
  try {
    if (!hash) await home(page, signal);
    else if (hash.startsWith("t/")) await thread(hash.slice(2), undefined, signal);
    else if (hash.startsWith("media/")) {
      const [, kind, code] = hash.split("/");
      await thread(decodeURIComponent(code || ""), kind, signal);
    } else await board(decodeURIComponent(hash), page, signal);
    if (signal.aborted) return;
    if (params.get("comment") === "1" && (hash.startsWith("t/") || hash.startsWith("media/"))) {
      const comment = view.querySelector("#post textarea");
      comment?.focus();
      comment?.scrollIntoView({ block: "center" });
    }
  } catch (error) {
    if (signal.aborted) return;
    view.replaceChildren(el("p", null, error.message || "could not load mime"));
  }
}

// Keep the same item through orientation changes, as in the tape viewer.
window.addEventListener("resize", () => {
  if (activeFeed) {
    view.scrollTop = activeFeed.index * view.clientHeight;
    activeFeed.viewportHeight = view.clientHeight;
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) view.querySelectorAll("video, audio").forEach((media) => media.pause());
});
window.addEventListener("keydown", (event) => {
  if (!activeFeed || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey ||
      event.target.closest("input, textarea, button, a, audio, video, pre, [contenteditable]")) return;
  const step = { ArrowDown: 1, PageDown: 1, ArrowUp: -1, PageUp: -1 }[event.key];
  if (!step) return;
  event.preventDefault();
  const index = Math.max(0, Math.min(activeFeed.nodes.length - 1, activeFeed.index + step));
  view.scrollTo({ top: index * view.clientHeight,
    behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth" });
});
async function start() {
  const params = new URLSearchParams(location.search);
  if (params.has("state") && (params.has("code") || params.has("error"))) {
    accountAction.disabled = true;
    try {
      const client = await authClient();
      const { appState } = await client.handleRedirectCallback();
      const hash = typeof appState?.hash === "string" && appState.hash.startsWith("#/") ? appState.hash : "#/";
      history.replaceState(null, "", location.pathname + hash);
    } catch (error) {
      accountStatus.textContent = error.message || "could not finish sign-in";
      history.replaceState(null, "", location.pathname + "#/");
    } finally { accountAction.disabled = false; }
  }
  window.onhashchange = route;
  await route();
  await updateIdentity();
}
start();
</script>
