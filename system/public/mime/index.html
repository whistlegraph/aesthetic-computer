<!doctype html>
<!-- Mime — discussion on media. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mime</title>
  <style>
    :root {
      --paper: #ffffee;
      --card: #f0e0d6;
      --card-edge: #d9bfb7;
      --ink: #800000;
      --body: #2b1a12;
      --dim: #9c7a6e;
      --link: #0000ee;
      --green: #789922;
      --accent: #d00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1b1b21;
        --card: #26232b;
        --card-edge: #3a3542;
        --ink: #e8a0a0;
        --body: #d8d2ca;
        --dim: #8a8494;
        --link: #8ab4f8;
        --green: #9fbf4e;
        --accent: #ff6b6b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--body);
      font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      padding-bottom: 4em;
    }
    a { color: var(--link); }
    header { text-align: left; padding: 1em 1em 0.4em; }
    header h1 { margin: 0; color: var(--ink); font-size: 2.2em; letter-spacing: -0.04em; }
    header h1 a { color: inherit; text-decoration: none; }
    nav#boards {
      text-align: center;
      padding: 0.6em 1em;
      border-top: 1px solid var(--card-edge);
      border-bottom: 1px solid var(--card-edge);
      margin: 0.8em 0 1em;
      font-size: 0.9em;
    }
    nav#boards a { margin: 0 0.4em; white-space: nowrap; }
    nav#boards a[aria-current="page"] { color: var(--ink); font-weight: bold; }
    nav#boards:empty { display: none; }
    details { margin-bottom: 1em; }
    summary { cursor: pointer; color: var(--link); margin-bottom: 0.5em; }
    .pages { display: flex; justify-content: space-between; margin-top: 1em; }
    main { max-width: 52em; margin: 0 auto; padding: 0 1em; }
    h2 { color: var(--ink); font-size: 1.2em; }
    h2 a { color: inherit; }

    form#post {
      background: var(--card);
      border: 1px solid var(--card-edge);
      padding: 0.8em;
      margin-bottom: 1.5em;
      display: grid;
      gap: 0.5em;
    }
    form#post input[type="text"], form#post textarea {
      width: 100%;
      background: var(--paper);
      color: var(--body);
      border: 1px solid var(--card-edge);
      padding: 0.4em;
      font: inherit;
    }
    form#post textarea { min-height: 4.5em; resize: vertical; }
    form#post .filerow { display: flex; align-items: center; gap: 0.6em; flex-wrap: wrap; }
    form#post button {
      background: var(--ink); color: var(--paper);
      border: 0; padding: 0.45em 1.2em; font: inherit; cursor: pointer;
      justify-self: start;
    }
    #dest { color: var(--green); font-weight: bold; }
    #formhint { color: var(--dim); font-size: 0.85em; margin: 0; }
    #status { color: var(--accent); }

    .post {
      background: var(--card);
      border: 1px solid var(--card-edge);
      padding: 0.6em 0.8em;
      margin: 0.5em 0;
      overflow-wrap: anywhere;
    }
    .post.op { border-left: 3px solid var(--ink); }
    .post .meta { font-size: 0.85em; color: var(--dim); margin-bottom: 0.3em; }
    .post .meta .name { color: var(--ink); font-weight: bold; }
    .post .meta a { color: var(--dim); }
    .post .filemeta { font-size: 0.8em; color: var(--dim); margin: 0.2em 0; }
    .post .filemeta a.typelink { color: var(--green); }
    .post .body { white-space: pre-wrap; margin-top: 0.4em; }
    .post .body .gt { color: var(--green); }
    .post img, .post video { max-width: 100%; max-height: 24em; display: block; }
    .post audio { width: 100%; max-width: 28em; display: block; }
    .post iframe.doc { width: 100%; height: 24em; border: 1px solid var(--card-edge); background: #fff; }
    .post pre.textfile {
      max-height: 18em; overflow: auto; background: var(--paper);
      border: 1px solid var(--card-edge); padding: 0.6em; font-size: 0.85em;
    }
    .post .specimen { font-size: 2em; line-height: 1.2; }
    .post .blob {
      display: inline-block; background: var(--paper);
      border: 1px dashed var(--card-edge); padding: 0.8em 1.2em;
    }
    .omitted { color: var(--dim); font-size: 0.85em; margin: 0.3em 0; }
    .replies { margin-left: 1.5em; }
    @media (max-width: 40em) { .replies { margin-left: 0.6em; } }

    .dir { display: grid; grid-template-columns: repeat(auto-fill, minmax(14em, 1fr)); gap: 0.5em; }
    .dir a.b {
      background: var(--card); border: 1px solid var(--card-edge);
      padding: 0.6em 0.8em; text-decoration: none; color: var(--body);
    }
    .dir a.b .t { color: var(--ink); font-weight: bold; display: block; }
    .dir a.b .n { color: var(--dim); font-size: 0.8em; }
    body.dragging::after {
      content: "drop file";
      position: fixed; inset: 0; display: grid; place-items: center;
      background: color-mix(in srgb, var(--paper) 80%, transparent);
      color: var(--ink); font-size: 1.4em; pointer-events: none;
    }
    footer { text-align: center; color: var(--dim); font-size: 0.8em; margin-top: 3em; }
  </style>
</head>
<body>
  <header>
    <h1><a href="#/">mime</a></h1>
  </header>
  <nav id="boards"></nav>
  <main id="view"></main>
  <footer><a href="https://aesthetic.computer">aesthetic.computer</a></footer>

<script>
const API = "/api/mime";
const view = document.getElementById("view");
const nav = document.getElementById("boards");
let pendingFile = null; // { name, type, data } staged for the form

const esc = (s) => s ?? "";
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const human = (n) =>
  n == null ? "" : n > 1048576 ? (n / 1048576).toFixed(1) + "MB" : n > 1024 ? (n / 1024).toFixed(0) + "KB" : n + "B";
const ago = (d) => {
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
};

// The type decides the renderer. This is the whole site, really.
function renderFile(file) {
  const [top, sub] = file.type.split("/");
  let media;
  if (top === "image") {
    media = el("img");
    media.src = file.url;
    media.alt = file.name;
    media.loading = "lazy";
  } else if (top === "audio") {
    media = el("audio");
    media.controls = true;
    media.preload = "none";
    media.src = file.url;
  } else if (top === "video") {
    media = el("video");
    media.controls = true;
    media.preload = "metadata";
    media.src = file.url;
  } else if (file.type === "application/pdf" || file.type === "text/html") {
    media = el("iframe", "doc");
    media.setAttribute("sandbox", ""); // markup renders, scripts never run
    media.src = file.url;
    media.title = file.name;
  } else if (top === "text" || ["application/json", "application/xml", "application/javascript"].includes(file.type)) {
    media = el("pre", "textfile", "…");
    fetch(file.url).then((r) => r.text()).then((t) => {
      media.textContent = t.length > 8000 ? t.slice(0, 8000) + "\n…[truncated]" : t;
    }).catch(() => { media.textContent = "file unavailable"; });
  } else if (top === "font") {
    media = el("div", "specimen", "Sphinx of black quartz, judge my vow. 0123456789");
    const face = new FontFace("mc-" + file.url.split("=")[1], `url(${file.url})`);
    face.load().then((f) => {
      document.fonts.add(f);
      media.style.fontFamily = f.family;
    });
  } else {
    media = el("a", "blob", "download " + file.name);
    media.href = file.url;
    media.download = file.name;
  }
  return media;
}

function renderText(text) {
  const body = el("div", "body");
  for (const line of esc(text).split("\n")) {
    let node;
    if (/^>>\w+/.test(line)) {
      node = el("span");
      const code = line.match(/^>>(\w+)/)[1];
      const a = el("a", null, ">>" + code);
      a.href = "#/t/" + code;
      node.append(a, document.createTextNode(line.slice(code.length + 2)));
    } else if (line.startsWith(">")) {
      node = el("span", "gt", line);
    } else {
      node = el("span", null, line);
    }
    body.append(node, document.createTextNode("\n"));
  }
  return body;
}

function renderPost(post, isOp, inThread = false, contextBoard) {
  const div = el("div", "post" + (isOp ? " op" : ""));
  div.id = post.code;
  const meta = el("div", "meta");
  meta.append(el("span", "name", esc(post.name) || "Anonymous"), document.createTextNode(" · " + ago(post.when) + " · "));
  const link = el("a", null, post.media ? (post.media.kind + (post.media.code ? " " + post.media.code : "")) : "No." + post.code);
  link.href = post.media ? post.media.url : "#/t/" + (post.parent || post.code);
  meta.append(link);
  div.append(meta);
  if (post.file) {
    const fm = el("div", "filemeta");
    const tl = el("a", "typelink", post.file.type);
    tl.href = "#/" + post.file.type;
    const dl = el("a", null, esc(post.file.name));
    dl.href = post.file.url;
    dl.download = post.file.name;
    if (post.file.type !== contextBoard) fm.append(tl, document.createTextNode(" · "));
    if (post.file.size != null) fm.append(document.createTextNode(human(post.file.size) + " · "));
    fm.append(dl);
    div.append(fm, renderFile(post.file));
  }
  if (post.text) div.append(renderText(post.text));
  if (!post.parent && !inThread) {
    const discuss = el("a", "discussion", "discuss" + (post.replies ? " (" + post.replies + ")" : ""));
    discuss.href = "#/t/" + post.code;
    div.append(discuss);
  }
  return div;
}

function postForm(parent) {
  const form = el("form");
  form.id = "post";
  const name = el("input");
  name.type = "text";
  name.placeholder = "Anonymous";
  name.setAttribute("aria-label", "Name (optional)");
  name.maxLength = 40;
  const text = el("textarea");
  text.placeholder = parent ? "comment" : "comment (optional)";
  text.setAttribute("aria-label", parent ? "Comment" : "Comment (optional)");
  text.maxLength = 4000;
  const filerow = el("div", "filerow");
  const file = el("input");
  file.type = "file";
  file.setAttribute("aria-label", parent ? "Attach a file (optional)" : "File");
  const dest = el("span");
  dest.id = "dest";
  filerow.append(file, dest);
  const button = el("button", null, parent ? "reply" : "post");
  const status = el("span");
  status.id = "status";
  status.setAttribute("role", "status");
  const hint = el("p", null, "Choose, drop, or paste a file · 8 MB max");
  hint.id = "formhint";
  file.setAttribute("aria-describedby", "formhint");
  if (parent) {
    const attachment = el("details");
    attachment.append(el("summary", null, "attach file"), filerow, hint);
    form.append(text, name, attachment, button, status);
  } else {
    form.append(filerow, hint, text, name, button, status);
  }

  let stagedVersion = 0;
  const stage = (f) => {
    const version = ++stagedVersion;
    pendingFile = null;
    button.disabled = false;
    dest.textContent = "";
    const details = form.closest("details");
    if (details) details.open = true;
    const attachment = file.closest("details");
    if (attachment) attachment.open = true;
    if (f.size > 8 * 1024 * 1024) { status.textContent = "file over 8 MB"; return; }
    status.textContent = "reading file…";
    button.disabled = true;
    const reader = new FileReader();
    reader.onload = () => {
      if (version !== stagedVersion || !form.isConnected) return;
      button.disabled = false;
      status.textContent = "";
      pendingFile = { name: f.name, type: fileType(f), data: reader.result.split(",")[1] };
      dest.textContent = f.name + (parent ? " · " + pendingFile.type : " → /" + pendingFile.type + "/");
    };
    reader.onerror = () => { button.disabled = false; status.textContent = "file unreadable"; };
    reader.readAsDataURL(f);
  };
  file.onchange = () => file.files[0] && stage(file.files[0]);
  document.ondragover = (e) => { e.preventDefault(); document.body.classList.add("dragging"); };
  document.ondragleave = () => document.body.classList.remove("dragging");
  document.ondrop = (e) => {
    e.preventDefault();
    document.body.classList.remove("dragging");
    if (e.dataTransfer.files[0]) stage(e.dataTransfer.files[0]);
  };
  document.onpaste = (e) => {
    const f = [...(e.clipboardData?.files || [])][0];
    if (f) stage(f);
  };

  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!parent && !pendingFile) { status.textContent = "choose a file"; return; }
    if (parent && !text.value.trim() && !pendingFile) { status.textContent = "empty reply"; return; }
    status.textContent = "posting…";
    button.disabled = true;
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name.value, text: text.value, parent, file: pendingFile }),
      });
      const out = await res.json();
      if (!res.ok) { status.textContent = out.error; return; }
      pendingFile = null;
      history.replaceState(null, "", "#/t/" + (parent || out.code));
      await route();
    } catch {
      status.textContent = "could not post — try again";
    } finally {
      button.disabled = false;
    }
  };
  return form;
}

// Use the browser type, then extension, then generic bytes.
function fileType(f) {
  if (f.type) return f.type;
  const ext = f.name.split(".").pop().toLowerCase();
  const map = { lisp: "text/x-lisp", lua: "text/x-lua", mjs: "text/javascript", js: "text/javascript",
    md: "text/markdown", txt: "text/plain", html: "text/html", css: "text/css", json: "application/json",
    mid: "audio/midi", midi: "audio/midi", wasm: "application/wasm", png: "image/png", jpg: "image/jpeg",
    jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp", svg: "image/svg+xml", mp3: "audio/mpeg",
    wav: "audio/wav", ogg: "audio/ogg", mp4: "video/mp4", webm: "video/webm", mov: "video/quicktime",
    pdf: "application/pdf", zip: "application/zip", ttf: "font/ttf", otf: "font/otf", woff: "font/woff", woff2: "font/woff2" };
  return map[ext] || "application/octet-stream";
}

async function loadNav(active) {
  const { boards } = await fetch(API).then((r) => r.json());
  nav.replaceChildren(...boards.flatMap((b, i) => {
    const a = el("a", null, "/" + b.board + "/");
    a.href = "#/" + b.board;
    if (b.board === active) a.setAttribute("aria-current", "page");
    return i ? [document.createTextNode(" "), a] : [a];
  }));
  return boards;
}

function pages(page, hasMore, path) {
  const links = el("nav", "pages");
  links.setAttribute("aria-label", "Pages");
  if (page > 0) {
    const previous = el("a", null, "previous");
    previous.href = path + "?page=" + (page - 1);
    links.append(previous);
  }
  if (hasMore) {
    const next = el("a", null, "next");
    next.href = path + "?page=" + (page + 1);
    links.append(next);
  }
  return links;
}

async function home(page = 0) {
  const data = await read(API + "?page=" + page);
  const upload = el("details");
  upload.append(el("summary", null, "post file"), postForm(null));
  view.replaceChildren(upload);
  const dir = el("div", "dir");
  for (const b of data.boards) {
    const a = el("a", "b");
    a.href = "#/" + b.board;
    a.append(el("span", "t", "/" + b.board + "/"), el("span", "n", b.threads + " thread" + (b.threads === 1 ? "" : "s")));
    dir.append(a);
  }
  if (data.boards.length) view.append(dir);
  else view.append(el("p", null, "no media yet"));
  for (const p of data.recent) view.append(renderPost(p, false));
  view.append(pages(page, data.hasMore, "#/"));
}

async function board(name, page = 0) {
  const data = await read(API + "?board=" + encodeURIComponent(name) + "&page=" + page);
  const upload = el("a", null, "post file");
  upload.href = "#/";
  view.replaceChildren(upload);
  for (const t of data.threads) {
    view.append(renderPost(t.op, true, false, name));
    const omitted = t.replyCount - t.replies.length;
    if (omitted > 0) view.append(el("div", "omitted", omitted + " repl" + (omitted === 1 ? "y" : "ies") + " omitted"));
    const wrap = el("div", "replies");
    for (const r of t.replies) wrap.append(renderPost(r, false, false, name));
    view.append(wrap);
  }
  if (!data.threads.length) view.append(el("p", null, "no posts yet"));
  view.append(pages(page, data.hasMore, "#/" + name));
  return name;
}

async function thread(code, kind) {
  const data = await read(API + (kind ? "?media=" + encodeURIComponent(kind) + "&code=" : "?thread=") + encodeURIComponent(code));
  code = data.op.code;
  if (kind) history.replaceState(null, "", "#/t/" + code);
  view.replaceChildren(renderPost(data.op, true, true, data.op.board));
  const wrap = el("div", "replies");
  for (const r of data.replies) wrap.append(renderPost(r, false, false, data.op.board));
  view.append(wrap, postForm(code));
  return data.op.board;
}

async function read(url) {
  const response = await fetch(url);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "could not load mime");
  return data;
}

async function route() {
  pendingFile = null;
  document.ondragover = document.ondragleave = document.ondrop = document.onpaste = null;
  document.body.classList.remove("dragging");
  const [hash, query] = location.hash.replace(/^#\/?/, "").split("?");
  const page = Math.max(0, parseInt(new URLSearchParams(query).get("page")) || 0);
  view.replaceChildren(el("p", null, "loading…"));
  nav.replaceChildren();
  try {
    let active;
    if (!hash) await home(page);
    else if (hash.startsWith("t/")) active = await thread(hash.slice(2));
    else if (hash.startsWith("media/")) {
      const [, kind, code] = hash.split("/");
      active = await thread(decodeURIComponent(code || ""), kind);
    } else active = await board(decodeURIComponent(hash), page);
    if (hash) await loadNav(active);
  } catch (error) {
    view.replaceChildren(el("p", null, error.message || "could not load mime"));
  }
}

window.onhashchange = route;
route();
</script>
</body>
</html>
