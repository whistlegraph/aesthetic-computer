<script>
// Like Oskiewar's shifting tab lettering, with a stable title for reduced motion.
const tabTitles = ["mime.ac", "𝗺𝗶𝗺𝗲.ac", "𝚖𝚒𝚖𝚎.ac", "𝘮𝘪𝘮𝘦.ac"];
const tabMotion = matchMedia("(prefers-reduced-motion: reduce)");
let tabTimer;
function syncTabAnimation() {
  clearInterval(tabTimer);
  document.title = tabTitles[0];
  if (document.hidden || tabMotion.matches) return;
  let frame = 0;
  tabTimer = setInterval(() => { document.title = tabTitles[++frame % tabTitles.length]; }, 1250);
}
tabMotion.addEventListener("change", syncTabAnimation);
document.addEventListener("visibilitychange", syncTabAnimation);
window.addEventListener("pagehide", () => clearInterval(tabTimer));
window.addEventListener("pageshow", syncTabAnimation);
syncTabAnimation();

const API = "/api/mime";
const view = document.getElementById("view");
const header = document.querySelector("header");
function syncHeader() {
  if (window.scrollY > 80) header.classList.add("compact");
  else if (window.scrollY < 8) header.classList.remove("compact");
}
window.addEventListener("scroll", syncHeader, { passive: true });
let routeController;
let feedCache, activeFeed, feedObserver, playbackObserver;
history.scrollRestoration = "manual";
function feedTop(node) {
  return node.getBoundingClientRect().top + window.scrollY - header.getBoundingClientRect().bottom;
}
function rememberFeed() {
  if (!activeFeed) return;
  const edge = header.getBoundingClientRect().bottom;
  const index = activeFeed.nodes.findIndex((node) => node.getBoundingClientRect().bottom > edge + 1);
  activeFeed.index = Math.max(0, index);
  const node = activeFeed.nodes[activeFeed.index];
  activeFeed.offset = node ? window.scrollY - feedTop(node) : 0;
}
window.addEventListener("scroll", () => {
  if (activeFeed?.viewportWidth === view.clientWidth) rememberFeed();
}, { passive: true });

// Visibility is a proxy for attention, not eye tracking. No account identifier
// or persistent browser identifier leaves this tracker.
const engagementVisit = crypto.randomUUID();
const engagement = new Map();
let exposure = [], exposureAt = performance.now(), engagementFrame = 0;
let engagementActive = !document.hidden && document.hasFocus();
function engagementRecord(code) {
  if (!engagement.has(code)) engagement.set(code, { code, visibleMs: 0, partialMs: 0,
    majorityMs: 0, focusedMs: 0, weightedVisibleMs: 0, maxVisiblePermille: 0,
    commentOpens: 0, originalOpens: 0, dirty: false });
  return engagement.get(code);
}
function sampleEngagement() {
  const now = performance.now();
  // A suspended browser must not turn a delayed timer into hours of attention.
  const elapsed = Math.max(0, Math.min(2000, Math.round(now - exposureAt)));
  for (const item of exposure) {
    const record = engagementRecord(item.node.id);
    const dt = Math.min(elapsed, 86400000 - record.visibleMs);
    record.visibleMs += dt;
    record[item.ratio >= 0.5 ? "majorityMs" : "partialMs"] += dt;
    if (item.focused) record.focusedMs += dt;
    record.weightedVisibleMs += Math.round(dt * item.ratio);
    record.dirty = true;
    delete item.node.dataset.focused;
    delete item.node.dataset.visibleRatio;
  }
  exposureAt = now;
  exposure = [];
  delete view.dataset.focusedPost;
  if (!activeFeed || !engagementActive) return;
  const bounds = { top: header.getBoundingClientRect().bottom, bottom: innerHeight, left: 0, right: document.documentElement.clientWidth };
  for (const node of activeFeed.nodes) {
    const box = node.getBoundingClientRect();
    const width = Math.max(0, Math.min(box.right, bounds.right) - Math.max(box.left, bounds.left));
    const height = Math.max(0, Math.min(box.bottom, bounds.bottom) - Math.max(box.top, bounds.top));
    const area = width * height;
    if (!area || !box.width || !box.height) continue;
    exposure.push({ node, area, ratio: Math.min(1, area / (box.width * box.height)),
      distance: Math.abs((box.top + box.bottom - bounds.top - bounds.bottom) / 2) });
  }
  // Most visible pixels wins; proximity to the center breaks ties.
  const focused = [...exposure].sort((a, b) => b.area - a.area || a.distance - b.distance)[0];
  for (const item of exposure) {
    item.focused = item === focused;
    item.node.dataset.visibleRatio = item.ratio.toFixed(3);
    if (item.focused) {
      item.node.dataset.focused = "true";
      view.dataset.focusedPost = item.node.id;
    }
    const record = engagementRecord(item.node.id);
    record.maxVisiblePermille = Math.max(record.maxVisiblePermille, Math.round(item.ratio * 1000));
    record.dirty = true;
  }
}
function scheduleEngagement() {
  if (!engagementFrame) engagementFrame = requestAnimationFrame(() => {
    engagementFrame = 0;
    sampleEngagement();
  });
}
function flushEngagement() {
  const dirty = [...engagement.values()].filter((p) => p.dirty);
  for (let i = 0; i < dirty.length; i += 24) {
    const records = dirty.slice(i, i + 24);
    const body = JSON.stringify({ visit: engagementVisit,
      posts: records.map(({ dirty, ...counters }) => counters) });
    records.forEach((p) => { p.dirty = false; });
    fetch(API + "?engagement=1", { method: "POST", credentials: "omit",
      headers: { "Content-Type": "application/json" }, body, keepalive: true })
      .then((response) => { if (!response.ok) throw new Error("engagement unavailable"); })
      .catch(() => records.forEach((p) => { p.dirty = true; }));
  }
}
function engagementForeground(active) {
  engagementActive = active;
  sampleEngagement();
  if (!active) flushEngagement();
}
window.addEventListener("scroll", scheduleEngagement, { passive: true });
window.addEventListener("resize", scheduleEngagement);
window.addEventListener("blur", () => engagementForeground(false));
window.addEventListener("focus", () => engagementForeground(!document.hidden));
document.addEventListener("visibilitychange", () => engagementForeground(!document.hidden && document.hasFocus()));
window.addEventListener("pagehide", () => engagementForeground(false));
window.addEventListener("pageshow", () => engagementForeground(!document.hidden && document.hasFocus()));
setInterval(sampleEngagement, 1000);
setInterval(() => flushEngagement(), 15000);
view.addEventListener("click", (event) => {
  const link = event.target.closest("a");
  const post = link?.closest(".feed-post");
  if (!post || !event.isTrusted) return;
  const key = link.matches(".discussion, .all-comments") ? "commentOpens"
    : link.matches(".source-button, .media-label") && link.origin !== location.origin ? "originalOpens" : null;
  if (!key) return;
  sampleEngagement();
  const record = engagementRecord(post.id);
  record[key] = Math.min(10000, record[key] + 1);
  record.dirty = true;
  flushEngagement();
});

const esc = (s) => s ?? "";
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const human = (n) =>
  n == null ? "" : n > 1048576 ? (n / 1048576).toFixed(1) + "MB" : n > 1024 ? (n / 1024).toFixed(0) + "KB" : n + "B";
const ago = (d) => {
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
};

// The type decides the renderer. This is the whole site, really.
function renderFile(file) {
  const [top, sub] = file.type.split("/");
  let media;
  if (top === "image") {
    media = el("img");
    media.src = file.url;
    media.alt = file.name;
    media.loading = "lazy";
  } else if (top === "audio") {
    media = el("audio");
    media.controls = true;
    media.preload = "none";
    media.src = file.url;
  } else if (top === "video") {
    media = el("video");
    media.controls = true;
    media.playsInline = true;
    media.preload = "metadata";
    media.src = file.url;
  } else if (file.type === "application/pdf" || file.type === "text/html") {
    media = el("iframe", "doc");
    media.setAttribute("sandbox", ""); // markup renders, scripts never run
    media.src = file.url;
    media.title = file.name;
  } else if (top === "text" || ["application/json", "application/xml", "application/javascript"].includes(file.type)) {
    media = el("pre", "textfile", "…");
    fetch(file.url).then((r) => r.text()).then((t) => {
      media.textContent = t.length > 8000 ? t.slice(0, 8000) + "\n…[truncated]" : t;
    }).catch(() => { media.textContent = "file unavailable"; });
  } else if (top === "font") {
    media = el("div", "specimen", "Sphinx of black quartz, judge my vow. 0123456789");
    const face = new FontFace("mc-" + file.url.split("=")[1], `url(${file.url})`);
    face.load().then((f) => {
      document.fonts.add(f);
      media.style.fontFamily = f.family;
    });
  } else {
    media = el("a", "blob", "download " + file.name);
    media.href = file.url;
    media.download = file.name;
  }
  return media;
}

function renderText(text) {
  const body = el("div", "body");
  for (const line of esc(text).split("\n")) {
    let node;
    if (/^>>\w+/.test(line)) {
      node = el("span");
      const code = line.match(/^>>(\w+)/)[1];
      const a = el("a", null, ">>" + code);
      a.href = "#/t/" + code;
      node.append(a, document.createTextNode(line.slice(code.length + 2)));
    } else if (line.startsWith(">")) {
      node = el("span", "gt", line);
    } else {
      node = el("span", null, line);
    }
    body.append(node, document.createTextNode("\n"));
  }
  return body;
}

function authorName(name) {
  const label = name || "Anonymous";
  const node = el(label.startsWith("@") ? "a" : "span", "name", label);
  if (node.tagName === "A") node.href = "https://aesthetic.computer/" + encodeURIComponent(label);
  return node;
}
function renderPost(post, isOp, inThread = false, contextBoard, inFeed = false) {
  const root = !post.parent;
  const div = el("article", "post" + (root ? " media-post" : "") + (inFeed ? " feed-post" : ""));
  div.id = post.code;
  const meta = el("div", "meta");
  const avatar = el("span", "avatar", (post.name || "?").replace(/^@/, "").slice(0, 1).toLowerCase());
  avatar.setAttribute("aria-hidden", "true");
  const byline = el("div", "byline");
  byline.append(authorName(post.name));
  if (root) {
    const source = el("a", "media-label", post.media ? post.media.kind + (post.media.code ? " " + post.media.code : "") : post.file?.name || "post " + post.code);
    source.href = post.media?.url || "#/t/" + post.code;
    byline.append(source);
  }
  const time = el("time", null, ago(post.when));
  time.dateTime = post.when;
  time.title = new Date(post.when).toLocaleString();
  meta.append(avatar, byline, time);
  div.append(meta);
  if (post.file) {
    const file = renderFile(post.file);
    const frame = el("div", "feed-media");
    if (inFeed && file.tagName === "VIDEO") { file.muted = true; file.loop = true; }
    frame.append(file);
    div.append(frame);
  }
  if (post.text) div.append(renderText(post.text));
  if (root && !inThread) {
    const actions = el("div", "post-actions");
    const discuss = el("a", "discussion", "comment" + (post.replies ? " · " + post.replies : ""));
    discuss.href = "#/t/" + post.code + "?comment=1";
    actions.append(discuss);
    if (post.media?.url) {
      const source = el("a", "source-button", "open ↗");
      source.href = post.media.url;
      source.setAttribute("aria-label", "Open original " + post.media.kind);
      actions.append(source);
    }
    div.append(actions);
    if (post.preview?.length) {
      const preview = el("div", "comment-preview");
      for (const reply of post.preview) {
        const line = el("p");
        line.append(authorName(reply.name), document.createTextNode(reply.text || ""));
        preview.append(line);
      }
      const all = el("a", "all-comments", "view " + post.replies + " comment" + (post.replies === 1 ? "" : "s"));
      all.href = "#/t/" + post.code;
      preview.append(all);
      div.append(preview);
    }
  }
  return div;
}

const AC_CLIENT = "LVdZaMbyXctkGfZDnpzDATB5nR0ZhmMt";
const AUTH_REDIRECT = location.origin + (location.hostname === "mime.ac" ? "/" : "/mime/");
const accountAction = document.getElementById("account-action");
const accountHandle = document.getElementById("account-handle");
const accountStatus = document.getElementById("account-status");
const AC_CACHE_PREFIX = "@@auth0spajs@@::" + AC_CLIENT + "::";
let identity = { token: null, handle: null };
let authClientPromise, identityPromise;

function hasAcSession() {
  try {
    return Object.keys(localStorage).some((key) => key.startsWith(AC_CACHE_PREFIX));
  } catch { return false; }
}

function hostSessionToken() {
  try {
    const encoded = localStorage.getItem("session-aesthetic");
    if (!encoded || encoded === "null") return null;
    const session = JSON.parse(atob(decodeURIComponent(encoded)));
    return typeof session.accessToken === "string" && session.account ? session.accessToken : null;
  } catch { return null; }
}

function authClient() {
  if (!authClientPromise) authClientPromise = (async () => {
    if (!window.auth0) await new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "/aesthetic.computer/dep/auth0-spa-js.production.js";
      script.onload = resolve;
      script.onerror = () => { script.remove(); reject(new Error("could not load sign-in — try again")); };
      document.head.append(script);
    });
    return new window.auth0.Auth0Client({
      domain: "https://hi.aesthetic.computer", clientId: AC_CLIENT,
      cacheLocation: "localstorage", useRefreshTokens: true,
      authorizationParams: { redirect_uri: AUTH_REDIRECT },
      httpTimeoutInSeconds: 30,
    });
  })().catch((error) => { authClientPromise = null; throw error; });
  return authClientPromise;
}

function refreshIdentity() {
  if (identityPromise) return identityPromise;
  const hostToken = hostSessionToken();
  if (!hostToken && !hasAcSession()) {
    identity = { token: null, handle: null };
    return Promise.resolve();
  }
  identityPromise = (async () => {
    let token = hostToken;
    if (!token) {
      const client = await authClient();
      try { token = await client.getTokenSilently(); }
      catch { throw new Error("sign in again to use your handle"); }
    }
    const response = await fetch(API + "?me=1", { headers: { Authorization: "Bearer " + token } });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "could not verify your handle");
    identity = { token, handle: data.handle };
  })().finally(() => { identityPromise = null; });
  return identityPromise;
}

function showIdentity(input) {
  if (identity.token) input.value = identity.handle || "";
  else if (input.readOnly) input.value = "";
  input.readOnly = !!identity.token;
  input.setAttribute("aria-label", identity.token ? "Commenting as" : "Name (optional)");
}

function showAccount() {
  accountHandle.textContent = identity.handle || "";
  if (identity.handle) accountHandle.href = "https://aesthetic.computer/" + encodeURIComponent(identity.handle);
  else accountHandle.removeAttribute("href");
  accountAction.textContent = identity.token ? "sign out" : "sign in";
}

accountAction.onclick = async () => {
  accountAction.disabled = true;
  accountStatus.textContent = "";
  try {
    const client = await authClient();
    if (identity.token) {
      localStorage.removeItem("session-aesthetic");
      await client.logout({ logoutParams: { returnTo: AUTH_REDIRECT } });
    } else {
      const form = view.querySelector("#post");
      if (form) sessionStorage.setItem("mime-comment-draft", JSON.stringify({
        hash: location.hash, text: form.querySelector("textarea").value,
      }));
      await client.loginWithRedirect({ appState: { hash: location.hash || "#/" },
        authorizationParams: { redirect_uri: AUTH_REDIRECT } });
    }
  } catch (error) {
    accountStatus.textContent = error.message || "could not sign in";
    accountAction.disabled = false;
  }
};

function updateIdentity() {
  return refreshIdentity().then(() => {
    showAccount();
    const input = view.querySelector('[name="commenter"]');
    if (input) showIdentity(input);
  }).catch(() => { accountStatus.textContent = "sign in again to use your handle"; });
}
window.addEventListener("focus", updateIdentity);
window.addEventListener("storage", (event) => {
  if (!event.key || event.key === "session-aesthetic" || event.key.startsWith(AC_CACHE_PREFIX)) updateIdentity();
});

function postForm(parent) {
  const form = el("form");
  form.id = "post";
  const name = el("input");
  name.type = "text";
  name.placeholder = "Anonymous";
  name.setAttribute("aria-label", "Name (optional)");
  name.maxLength = 40;
  const text = el("textarea");
  text.placeholder = "Write a comment…";
  text.setAttribute("aria-label", "Comment");
  text.maxLength = 4000;
  name.name = "commenter";
  const button = el("button", null, "comment");
  const status = el("span");
  status.id = "status";
  status.setAttribute("role", "status");
  form.append(name, text, button, status);
  try {
    const draft = JSON.parse(sessionStorage.getItem("mime-comment-draft"));
    if (draft?.hash === location.hash && typeof draft.text === "string") text.value = draft.text;
  } catch {}
  refreshIdentity().then(() => showIdentity(name)).catch(() => {
    if (form.isConnected) status.textContent = "sign in again to use your handle";
  });

  document.ondragover = (e) => { e.preventDefault(); };
  document.ondrop = (e) => { e.preventDefault(); };

  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!text.value.trim()) { status.textContent = "empty reply"; return; }
    status.textContent = "posting…";
    button.disabled = true;
    try {
      await refreshIdentity();
      showIdentity(name);
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(identity.token ? { Authorization: "Bearer " + identity.token } : {}) },
        body: JSON.stringify({ name: name.value, text: text.value, parent }),
      });
      const out = await res.json();
      if (!res.ok) { status.textContent = out.error; return; }
      sessionStorage.removeItem("mime-comment-draft");
      history.replaceState(null, "", "#/t/" + (parent || out.code));
      await route();
    } catch (error) {
      status.textContent = error.message || "could not post — try again";
    } finally {
      button.disabled = false;
    }
  };
  return form;
}

function pages(page, hasMore, path) {
  const links = el("nav", "pages");
  links.setAttribute("aria-label", "Pages");
  if (page > 0) {
    const previous = el("a", null, "previous");
    previous.href = path + "?page=" + (page - 1);
    links.append(previous);
  }
  if (hasMore) {
    const next = el("a", null, "next");
    next.href = path + "?page=" + (page + 1);
    links.append(next);
  }
  return links;
}

async function home(page = 0, signal) {
  let state = feedCache?.startPage === page ? feedCache : null;
  if (!state) {
    const data = await read(API + "?page=" + page, signal);
    state = { startPage: page, nextPage: page + 1,
      hasMore: data.hasMore, nodes: [], codes: new Set(), index: 0, offset: null };
    for (const post of data.recent) {
      if (state.codes.has(post.code)) continue;
      state.codes.add(post.code);
      state.nodes.push(renderPost(post, false, false, undefined, true));
    }
    feedCache = state;
  }
  if (signal.aborted) return;
  const restoreIndex = state.index;
  const restoreOffset = state.offset;
  const list = el("div", "feed-list");
  list.setAttribute("aria-label", "Media feed");
  list.append(...state.nodes);
  view.replaceChildren(list);
  if (!state.nodes.length) list.append(el("p", null, "no media yet"));
  const more = el("div", "feed-more");
  const button = el("button", null, "load more");
  button.type = "button";
  const status = el("span");
  status.setAttribute("role", "status");
  more.append(button, status);
  const attachMore = () => {
    if (state.hasMore) view.append(more);
    else more.remove();
  };
  attachMore();
  if ("IntersectionObserver" in window) {
    playbackObserver = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        for (const media of entry.target.querySelectorAll("video, audio")) {
          if (!entry.isIntersecting || entry.intersectionRatio < 0.6) media.pause();
          else if (media.tagName === "VIDEO" && !document.hidden) media.play().catch(() => {});
        }
      }
    }, { threshold: [0, 0.6] });
    state.nodes.forEach((node) => playbackObserver.observe(node.querySelector(".feed-media") || node));
  }
  let loading = false;
  const loadMore = async () => {
    if (loading || !state.hasMore || signal.aborted) return;
    loading = true;
    button.disabled = true;
    status.textContent = "loading…";
    list.setAttribute("aria-busy", "true");
    feedObserver?.disconnect();
    try {
      const data = await read(API + "?page=" + state.nextPage, signal);
      if (signal.aborted) return;
      for (const post of data.recent) {
        if (state.codes.has(post.code)) continue;
        state.codes.add(post.code);
        const node = renderPost(post, false, false, undefined, true);
        state.nodes.push(node);
        list.append(node);
        playbackObserver?.observe(node.querySelector(".feed-media") || node);
      }
      state.nextPage++;
      state.hasMore = data.hasMore;
      status.textContent = "";
      button.textContent = "load more";
      attachMore();
      if (state.hasMore) feedObserver?.observe(state.nodes.at(-1) || more);
    } catch (error) {
      if (!signal.aborted) {
        status.textContent = "could not load more posts";
        button.textContent = "try again";
      }
    } finally {
      loading = false;
      button.disabled = false;
      list.removeAttribute("aria-busy");
    }
  };
  button.onclick = loadMore;
  if ("IntersectionObserver" in window) {
    feedObserver = new IntersectionObserver((entries) => {
      if (entries.some((entry) => entry.isIntersecting)) loadMore();
    }, { rootMargin: "150% 0px" });
  }
  state.viewportWidth = view.clientWidth;
  activeFeed = state;
  requestAnimationFrame(() => {
    if (signal.aborted) return;
    window.scrollTo(0, restoreOffset !== null && state.nodes[restoreIndex] ? feedTop(state.nodes[restoreIndex]) + restoreOffset : 0);
    rememberFeed();
    sampleEngagement();
    if (state.hasMore) feedObserver?.observe(state.nodes.at(-1) || more);
  });
}

async function board(name, page = 0, signal) {
  const data = await read(API + "?board=" + encodeURIComponent(name) + "&page=" + page, signal);
  view.replaceChildren();
  for (const t of data.threads) {
    view.append(renderPost(t.op, true, false, name));
    const omitted = t.replyCount - t.replies.length;
    if (omitted > 0) view.append(el("div", "omitted", omitted + " repl" + (omitted === 1 ? "y" : "ies") + " omitted"));
    const wrap = el("div", "replies");
    for (const r of t.replies) wrap.append(renderPost(r, false, false, name));
    view.append(wrap);
  }
  if (!data.threads.length) view.append(el("p", null, "no posts yet"));
  view.append(pages(page, data.hasMore, "#/" + name));
  return name;
}

async function thread(code, kind, signal) {
  const data = await read(API + (kind ? "?media=" + encodeURIComponent(kind) + "&code=" : "?thread=") + encodeURIComponent(code), signal);
  code = data.op.code;
  if (kind) history.replaceState(null, "", "#/t/" + code);
  const cachedIndex = feedCache?.nodes.findIndex((node) => node.id === code);
  if (cachedIndex >= 0) feedCache.nodes[cachedIndex] = renderPost({ ...data.op, preview: data.replies.slice(-2) }, false, false, undefined, true);
  const back = el("a", "back", "← feed");
  back.href = "#/";
  view.replaceChildren(back, renderPost(data.op, true, true, data.op.board));
  const wrap = el("div", "replies");
  for (const r of data.replies) wrap.append(renderPost(r, false, false, data.op.board));
  const heading = el("h2", "comments-title", data.replies.length + " comment" + (data.replies.length === 1 ? "" : "s"));
  view.append(heading, wrap, postForm(code));
  return data.op.board;
}

async function read(url, signal) {
  const response = await fetch(url, { signal });
  const data = await response.json();
  if (signal?.aborted) throw new DOMException("Navigation changed", "AbortError");
  if (!response.ok) throw new Error(data.error || "could not load mime");
  return data;
}

async function route() {
  rememberFeed();
  activeFeed = null;
  sampleEngagement();
  flushEngagement();
  feedObserver?.disconnect();
  feedObserver = null;
  playbackObserver?.disconnect();
  playbackObserver = null;
  view.querySelectorAll("video, audio").forEach((media) => media.pause());
  routeController?.abort();
  routeController = new AbortController();
  const { signal } = routeController;
  window.scrollTo(0, 0);
  syncHeader();
  document.ondragover = document.ondragleave = document.ondrop = document.onpaste = null;
  const [hash, query] = location.hash.replace(/^#\/?/, "").split("?");
  document.body.classList.toggle("feed", !hash);
  const params = new URLSearchParams(query);
  const page = Math.max(0, parseInt(params.get("page")) || 0);
  view.replaceChildren(el("p", null, "loading…"));
  try {
    if (!hash) await home(page, signal);
    else if (hash.startsWith("t/")) await thread(hash.slice(2), undefined, signal);
    else if (hash.startsWith("media/")) {
      const [, kind, code] = hash.split("/");
      await thread(decodeURIComponent(code || ""), kind, signal);
    } else await board(decodeURIComponent(hash), page, signal);
    if (signal.aborted) return;
    if (params.get("comment") === "1" && (hash.startsWith("t/") || hash.startsWith("media/"))) {
      const comment = view.querySelector("#post textarea");
      comment?.focus();
      comment?.scrollIntoView({ block: "center" });
    }
  } catch (error) {
    if (signal.aborted) return;
    view.replaceChildren(el("p", null, error.message || "could not load mime"));
  }
}

// Keep the current card through orientation changes.
window.addEventListener("resize", () => {
  if (activeFeed && activeFeed.viewportWidth !== view.clientWidth) {
    const node = activeFeed.nodes[activeFeed.index];
    if (node) window.scrollTo(0, feedTop(node) + activeFeed.offset);
    activeFeed.viewportWidth = view.clientWidth;
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) view.querySelectorAll("video, audio").forEach((media) => media.pause());
});
window.addEventListener("keydown", (event) => {
  if (!activeFeed?.nodes.length || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey ||
      event.target.closest("input, textarea, button, a, audio, video, pre, [contenteditable]")) return;
  const step = { ArrowDown: 1, PageDown: 1, ArrowUp: -1, PageUp: -1 }[event.key];
  if (!step) return;
  event.preventDefault();
  const index = Math.max(0, Math.min(activeFeed.nodes.length - 1, activeFeed.index + step));
  window.scrollTo({ top: feedTop(activeFeed.nodes[index]),
    behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth" });
});
async function start() {
  const params = new URLSearchParams(location.search);
  if (params.has("state") && (params.has("code") || params.has("error"))) {
    accountAction.disabled = true;
    try {
      const client = await authClient();
      const { appState } = await client.handleRedirectCallback();
      const hash = typeof appState?.hash === "string" && appState.hash.startsWith("#/") ? appState.hash : "#/";
      history.replaceState(null, "", location.pathname + hash);
    } catch (error) {
      accountStatus.textContent = error.message || "could not finish sign-in";
      history.replaceState(null, "", location.pathname + "#/");
    } finally { accountAction.disabled = false; }
  }
  window.onhashchange = route;
  await route();
  await updateIdentity();
}
start();
