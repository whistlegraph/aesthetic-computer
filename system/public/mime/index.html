    :root {
      color-scheme: light;
      --paper: #eee9f1; --card: #fffafc; --card-edge: #b6a5bd;
      --ink: #a52b72; --body: #30253e; --dim: #74667c; --link: #087980;
      --green: #257b55; --accent: #bd3851; --shine: #fff;
      --button: #eed9f0; --button-ink: #592553; --shadow: #86738f;
      --primary: #bbefb8; --primary-ink: #204e37; --media: #e7e1ed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --paper: #171526; --card: #272237; --card-edge: #625271;
        --ink: #ff91c5; --body: #f5eefa; --dim: #b4a5c2; --link: #7de3d7;
        --green: #a6e6b3; --accent: #ff969a; --shine: #796687;

    }
    * { box-sizing: border-box; }
    html { scroll-padding-top: 76px; overflow-anchor: none; }

      background: var(--paper); color: var(--body); font: 16px/1.5 "Berkeley Mono Variable", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

      background: var(--paper); transition: height 220ms ease;
      width: 100%; max-width: 660px; margin: 0 auto; padding: max(10px, env(safe-area-inset-top)) 16px 10px;
      border-bottom: 1px solid var(--card-edge); }
    header h1 { position: absolute; left: 16px; top: calc(10px + env(safe-area-inset-top));
      transform: translateX(0); transition: left 220ms ease, transform 220ms ease, top 220ms ease; margin: 0; color: var(--ink); line-height: 1; }
    .account { position: fixed; z-index: 20; right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom)); max-width: calc(100vw - 24px);

      background: var(--card); box-shadow: 0 3px 0 var(--shadow); display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; font-size: 13px; min-width: 0; }
    #account-handle { overflow-wrap: anywhere; padding: 4px 6px; }

    .account [role="status"] { max-width: 24ch; color: var(--accent); }
    .account [hidden] { display: none; }
    .wordmark { display: inline-flex; align-items: center; min-height: 44px; color: inherit; text-decoration: none; }
    .wordmark svg { display: block; width: 146px; height: 50px; overflow: visible; transition: width 220ms ease, height 220ms ease; }
    .mime-letter { transform-box: fill-box; transform-origin: 50% 65%; animation: mime-float var(--period) ease-in-out var(--phase) infinite; }
    .mime-face { animation: mime-light var(--period) ease-in-out var(--phase) infinite; }
    .mime-shine { animation: mime-shine var(--period) ease-in-out var(--phase) infinite; }
    .wordmark:hover .mime-letter, .wordmark:focus-visible .mime-letter { filter: brightness(1.12); }
    @keyframes mime-float {
      0%, 100% { transform: translateY(1px) rotate(-5deg) skewY(-2deg) scale(0.97, 1.02); }
      50% { transform: translateY(-2.5px) rotate(4deg) skewY(2deg) scale(1.03, 0.98); }
    }
    @keyframes mime-light {
      0%, 100% { filter: brightness(0.94) hue-rotate(-8deg); }
      50% { filter: brightness(1.16) hue-rotate(8deg); }
    }
    @keyframes mime-shine {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mime-letter, .mime-face, .mime-shine { animation: none; }

    .wordmark .suffix-dot { color: #ff91c3; }

    button, a.discussion, a.back, a.source-button {

      padding: 8px 14px; border: 1px solid var(--card-edge); border-radius: 7px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--button) 76%, white), var(--button));
      color: var(--button-ink); box-shadow: inset 1px 1px 0 var(--shine), inset -1px -1px 0 var(--card-edge), 0 3px 0 var(--shadow);
      font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
    }
    button:hover, a.discussion:hover, a.back:hover, a.source-button:hover { filter: brightness(1.08); }
    button:active, a.discussion:active, a.back:active, a.source-button:active { transform: translateY(2px); box-shadow: inset 1px 1px 0 var(--shine), 0 1px 0 var(--shadow); }

    .account button { font-size: 13px; padding: 7px 11px; white-space: nowrap; }
    a.discussion, form#post button { --button: var(--primary); --button-ink: var(--primary-ink); }

    .feed-list { display: grid; gap: 14px; }
    .post { overflow-wrap: anywhere; }
    .post.media-post { background: var(--card); border: 1px solid var(--card-edge); border-radius: 10px; overflow: hidden;
      box-shadow: inset 0 1px 0 var(--shine), 0 3px 0 var(--shadow); }
    .post .meta { display: flex; align-items: center; gap: 10px; padding: 10px 12px; color: var(--dim); font-size: 12px; }
    .avatar { display: grid; place-items: center; flex-shrink: 0; width: 38px; height: 38px; border-radius: 8px;
      background: var(--button); border: 1px solid var(--card-edge); box-shadow: inset 1px 1px 0 var(--shine), 1px 1px 0 var(--shadow);
      color: var(--ink); font: 22px/1 "YWFTProcessing-Regular", sans-serif; }
    .post, .name { --author-light: #a52b72; --author-dark: #ff91c5; --author: var(--author-light); }
    @media (prefers-color-scheme: dark) {
      .post, .name { --author: var(--author-dark); }
    }
    .post .meta { background: color-mix(in srgb, var(--author) 9%, var(--card)); border-top: 3px solid var(--author); }
    .avatar { background: var(--author); color: var(--card); border-color: var(--author); }
    .byline { min-width: 0; flex: 1; }
    .name { font-weight: 650; color: var(--author); font-size: 16px; text-decoration: none; }
    .post time { white-space: nowrap; font-size: 12px; }
    .media-label { display: block; color: var(--ink); font-size: 14px; text-decoration: none; }
    .media-origin { display: block; color: var(--dim); font-size: 12px; text-decoration: none; }
    .feed-media { width: 100%; aspect-ratio: 4 / 3; display: grid; place-items: center;
      grid-template: minmax(0, 1fr) / minmax(0, 1fr); overflow: hidden; background: var(--media);
      border-block: 1px solid var(--card-edge); }
    .feed-media.media-audio { aspect-ratio: auto; min-height: 112px; }
    .feed-media.media-pack { aspect-ratio: var(--media-ratio, 2 / 3);
      width: min(100%, calc(min(55svh, 600px) * var(--pack-ratio, .666667))); margin-inline: auto; }
    .feed-media.media-image, .feed-media.media-video { aspect-ratio: var(--media-ratio, 4 / 3); }
    .feed-media.media-image > img, .feed-media.media-video > video { object-fit: contain; }
    .media-loading { position: absolute; z-index: 1; left: 50%; top: 50%; transform: translate(-50%, -50%);
      padding: 6px 10px; border-radius: 5px; background: var(--card); color: var(--dim); font-size: 12px; pointer-events: none; }
    .feed-media[data-media-state="ready"] > .media-loading,
    .feed-media[data-media-state="error"] > .media-loading { display: none; }
    .media-shield { position: absolute; inset: 0; z-index: 2; touch-action: pan-y pinch-zoom; }
    .media-toggle { position: absolute; right: 10px; bottom: 10px; z-index: 3;
      font-size: 12px; background: var(--card); opacity: .94; }
    .feed-media[data-interacting] { outline: 2px solid var(--link); outline-offset: -2px; }
    .feed-media[data-interacting] > .media-shield { display: none; }
    .tape-player { position: absolute; inset: 0 0 48px; width: 100%; height: calc(100% - 48px); border: 0; background: var(--media); z-index: 2; }
    .feed-media[data-tape][data-interacting] { min-height: 300px; }
    .feed-media[data-tape][data-interacting] > :first-child { visibility: hidden; }
    .feed-media > [inert] { pointer-events: none; user-select: none; }
    .save-ribbon { min-width: 44px; padding: 8px; color: var(--author); background: transparent; border: 0; box-shadow: none; }
    .save-ribbon svg { width: 20px; height: 26px; fill: transparent; stroke: currentColor; stroke-width: 2; }
    .save-ribbon[aria-pressed="true"] svg { fill: currentColor; }
    .saved-link { padding: 8px; font-size: 13px; font-weight: 650; }
    .mime-type { display: block; width: fit-content; margin-top: 2px; color: var(--dim); font-size: 12px; font-weight: 400; }
    .media-error { margin: 20px; padding: 16px; background: var(--card); border-radius: 6px; text-align: center; }
    .feed-media { position: relative; isolation: isolate; }
    .feed-media::before { content: ""; position: absolute; inset: -32px; z-index: -1; pointer-events: none;
      background: repeating-conic-gradient(color-mix(in srgb, var(--author) 18%, var(--media)) 0% 25%, var(--media) 0% 50%) 0 0 / 32px 32px;
      animation: checker-drift 12s linear infinite; animation-play-state: paused; }
    .post[data-visible-ratio] .feed-media::before { animation-play-state: running; }
    @keyframes checker-drift { to { transform: translate(32px, 32px); } }
    @media (prefers-reduced-motion: reduce) { .feed-media::before { animation: none; } }
    .feed-media > * { min-width: 0; min-height: 0; }
    .feed-media > img, .feed-media > video, .feed-media > iframe.doc { display: block; width: 100%; height: 100%; object-fit: contain; border: 0; }
    .feed-media > audio { width: calc(100% - 32px); }
    .feed-media > pre.textfile { width: 100%; height: 100%; margin: 0; padding: 18px; overflow: auto; font-size: 14px; white-space: pre-wrap; background: var(--card); }
    /* Text and HTML flow: the frame takes the document's full height, so the page's own scroll reads it. */
    .feed-media.media-flow, .post.media-post:has(> .media-flow) { overflow: clip; } /* clip, not hidden: no scroll container, so the toggle can stick */
    .feed-media.media-flow { aspect-ratio: auto; display: flex; flex-direction: column; }
    .feed-media.media-flow > pre.textfile { height: auto; overflow: visible; }
    .feed-media.media-flow > iframe.doc { height: 240px; background: var(--card); }
    .feed-media.media-flow > .media-toggle { position: sticky; bottom: 84px; align-self: flex-end; margin: -42px 10px 10px 0; } /* rides along a tall document, clear of the account bar */
    .feed-media.media-page { aspect-ratio: 17 / 22; max-height: 85vh; } /* a PDF sits in a letter-shaped box; its viewer pages inside */
    .piece-preview:not([data-packed="true"]) > iframe:not([data-ready="true"]) { opacity: 0; pointer-events: none;
      position: fixed; top: 0; left: 0; width: var(--warm-width, 100vw); height: var(--warm-height, 100dvh); }
    body:not(.feed) .feed-media.media-nes { aspect-ratio: auto; height: min(720px, 85dvh); min-height: 480px; }
    .piece-preview { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
    .piece-preview > img, .piece-preview > iframe { width: 100%; height: 100%; object-fit: contain; border: 0; }
    .piece-preview > iframe { position: absolute; inset: 0; background: var(--media); }
    .piece-preview > a { position: absolute; padding: 12px; background: var(--card); }
    .specimen { padding: 18px; font-size: 32px; }
    .blob { margin: 16px; }
    .post .body { white-space: pre-wrap; margin: 0; padding: 12px 14px; }
    .body .gt { color: var(--green); }
    .post-actions { display: flex; align-items: center; gap: 10px; padding: 13px 14px 15px; flex-wrap: wrap; }
    .post-actions .source-button { margin-left: auto; font-size: 13px; }
    .post-actions:has(.download-pack) { gap: 8px; }
    .post-actions:has(.download-pack) > * { font-size: 12px; }
    .comment-preview { padding: 0 14px 13px; font-size: 14px; }
    .comment-preview p { margin: 4px 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .comment-preview .name { font-size: inherit; margin-right: 8px; }
    .comment-preview .all-comments { display: inline-block; padding-top: 4px; color: var(--dim); font-size: 13px; }
    .new-pill { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 30;
      padding: 9px 16px; border-radius: 22px; color: #fff; background: rgba(20, 16, 30, .78); border: 1px solid rgba(255, 255, 255, .3);
      font: 700 15px "Comic Relief", "Comic Sans MS", cursive; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); cursor: pointer; }
    .feed-more { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 24px 8px 8px; }
    .feed-more [role="status"], .omitted { color: var(--dim); font-size: 13px; }
    .back { margin: 0 0 16px; font-size: 14px; }
    .comments-title { font-size: 17px; margin: 25px 2px 10px; color: var(--body); }
    .replies { margin-bottom: 16px; }
    .replies .post { border-bottom: 1px solid var(--card-edge); padding: 12px 0; }
    .replies .meta { padding: 0; }
    .replies .avatar { width: 30px; height: 30px; font-size: 18px; }
    .replies .body { padding: 6px 0 0 40px; }
    .replies img, .replies video { max-width: 100%; max-height: 320px; }
    form#post { display: grid; gap: 12px; padding: 16px; background: var(--card);
      border: 1px solid var(--card-edge); border-radius: 10px; box-shadow: inset 0 1px 0 var(--shine), 0 3px 0 var(--shadow); }
    form#post input, form#post textarea { width: 100%; min-width: 0; background: var(--paper); color: var(--body); border: 1px solid var(--card-edge);
      border-radius: 6px; padding: 10px; font: inherit; box-shadow: inset 1px 2px 0 color-mix(in srgb, var(--shadow) 25%, transparent); }
    form#post textarea { min-height: 110px; resize: vertical; }
    form#post input[readonly] { color: var(--ink); background: transparent; border: 0; box-shadow: none; padding: 0; }
    form#post button { justify-self: start; }
    #status { color: var(--accent); font-size: 13px; }
    #status:empty { display: none; }
    .pages { display: flex; justify-content: space-between; margin-top: 20px; }
    .filemeta { font-size: 12px; padding: 12px; }
    @media (max-width: 360px) {
      header { padding-inline: 10px; gap: 6px; }
      .wordmark svg { width: 130px; height: 45px; }
      main { padding-inline: 8px; }
      .post-actions { gap: 8px; padding-inline: 10px; }
      .post-actions a { padding-inline: 10px; }
    }
    header.compact { height: calc(52px + env(safe-area-inset-top)); }
    header.compact h1 { left: 50%; transform: translateX(-50%); top: calc(4px + env(safe-area-inset-top)); }
    header.compact .wordmark svg { width: 108px; height: 37px; }
    @media (prefers-reduced-motion: reduce) {
      header, header h1, .wordmark svg { transition: none; }
    }

    /* The feed as reels: each post is one screen, and a swipe, wheel step or
       arrow key moves exactly one card. The window still scrolls, so the focus,
       playback and engagement code keeps measuring the same way. Caption and
       actions float over the media on a dark fade, light in either theme. */
    html:has(body.feed) { scroll-snap-type: y mandatory; scroll-padding-top: 0; }
    body.feed { background: var(--media); }
    /* Like Instagram: the wordmark rides a banner above the first post, slides
       away as you scroll down and slides back whenever you scroll up. A spacer
       holds its place at the top so the first screen is banner plus first post. */
    /* As the first post scrolls up, the banner fades out and the wordmark slides
       with the scroll to the top-right corner, where it floats over the cards.
       --corner runs 0 → 1 over the first screen (set in syncHeader). */
    body.feed header { position: fixed; top: 0; left: 0; right: 0; max-width: none; height: calc(52px + env(safe-area-inset-top));
      background: color-mix(in srgb, var(--paper) calc((1 - var(--corner, 0)) * 100%), transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--card-edge) calc((1 - var(--corner, 0)) * 100%), transparent);
      pointer-events: none; overflow: hidden; /* .ac rides off the right edge and is clipped */ }
    /* MIME locks 14px from the right edge, shrinking and fading into a watermark. */
    html body.feed header.compact h1 { transition: none; transform-origin: right center;
      transform: translateX(calc((100vw - 100% - 28px) * var(--corner, 0))) scale(calc(1 - .25 * var(--corner, 0)));
      opacity: 1; }
    /* The wordmark sits top-left on its banner, as on Instagram, and nothing else
       crowds the reel; saved and sign in wait on the thread pages. */
    body.feed header h1, body.feed header.compact h1 { left: 14px; transform: none; top: calc(4px + env(safe-area-inset-top)); pointer-events: auto; }
    body.feed .account { display: none; }
    /* "mime" alone is centered; .ac hangs off its right edge, light and outlined over any card. */
    body.feed .wordmark { position: relative; }
    body.feed .wordmark .domain-suffix { position: absolute; left: 100%; top: auto; bottom: 7px; margin: 0 0 0 2px;
      font: 700 19px/1 "Comic Relief", "Comic Sans MS", cursive; color: #fff;
      -webkit-text-stroke: .13em #141414; paint-order: stroke fill; text-shadow: 2px 2px 0 #141414; }
    body.feed .wordmark .suffix-dot { color: #ff91c3; font-size: 1.25em; }
    /* .ac leaves as MIME slides into the corner: gone by halfway, then clipped by the edge. */
    body.feed .wordmark .domain-suffix { opacity: clamp(0, 1 - 2 * var(--corner, 0), 1); }
    body.feed main { max-width: none; padding: 0; }
    body.feed .feed-list { gap: 0; }
    body.feed .feed-post { --author: var(--author-dark); position: relative; height: 100vh; height: 100dvh;
      scroll-snap-align: start; scroll-snap-stop: always;
      display: grid; grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: minmax(0, 1fr) auto auto auto max(14px, env(safe-area-inset-bottom));
      border: 0; border-radius: 0; box-shadow: none; background: var(--media); overflow: hidden; color: #fff; }
    @media (min-width: 760px) { body.feed .feed-post { width: min(100%, 720px); margin-inline: auto; } }

// Load the first card underneath MIME, then scatter the mark when its media is ready.
function loadingMark(signal) {
  const overlay = el("div", "mime-startup");
  overlay.setAttribute("role", "status");
  overlay.setAttribute("aria-label", "Loading MIME");
  const graphic = header.querySelector("svg").cloneNode(true);
  // Prefix the cloned SVG's IDs so its gradients cannot collide with the header.
  for (const node of graphic.querySelectorAll("[id]")) node.id = "startup-" + node.id;
  for (const node of graphic.querySelectorAll("*")) for (const attr of [...node.attributes]) {
    if (attr.value.includes("url(#")) node.setAttribute(attr.name, attr.value.replaceAll("url(#", "url(#startup-"));
  }
  // Break apart on outer groups so each letter keeps its current floating pose.
  // Cancelling the inner animation here would snap it back before departure.

    const fragment = document.createElementNS("http://www.w3.org/2000/svg", "g");
    fragment.classList.add("mime-fragment");
    letter.replaceWith(fragment); fragment.append(letter);
    return fragment;
  });
  overlay.append(graphic);
  document.body.append(overlay);
  document.documentElement.classList.add("mime-starting");
  let observer, breaking = false, removed = false;
  const departures = [];
  const remove = () => {
    if (removed) return;
    removed = true;
    observer?.disconnect(); departures.forEach(animation => animation.cancel()); overlay.remove();
    document.documentElement.classList.remove("mime-starting");
  };
  signal.addEventListener("abort", remove, { once: true });
  const reveal = () => {
    if (breaking || signal.aborted) return;
    breaking = true; observer?.disconnect();
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const seconds = reduced ? 0.2 : parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--mime-breakup-duration")) || 0.8;
    requestAnimationFrame(() => {
      if (signal.aborted) return;
      overlay.classList.add("breaking");
      document.documentElement.classList.remove("mime-starting");
      const paths = [ [-98, -72, -39, 0, 1.08], [-24, 92, 24, .18, .91], [38, -95, -18, .07, 1.17], [112, 66, 47, .28, 1] ];
      fragments.forEach((fragment, i) => {
        const [x, y, angle, delay, duration] = paths[i];
        const frames = reduced ? [{ opacity: 1 }, { opacity: 0 }] : [
          { transform: "translate(0px, 0px) rotate(0deg) scale(1)", opacity: 1 },
          { opacity: 1, offset: .25 },
          { transform: `translate(${x}px, ${y}px) rotate(${angle}deg) scale(.86)`, opacity: 0 },
        ];

    });

    const media = node?.querySelector(".feed-media");
    const check = () => {
      if (!media || !media.dataset.mediaState || ["ready", "error"].includes(media.dataset.mediaState)) reveal();
    };
    if (media) {
      observer = new MutationObserver(check);
      observer.observe(media, { attributes: true, attributeFilter: ["data-media-state"] });
    }
    check();
  };
  return { watch, remove };
}
async function home(page = 0, signal, target) {
  const entrance = !feedCache ? loadingMark(signal) : null;

    const data = await read(API + "?feed=1&page=" + page + "&seed=" + feedSeed, signal).catch(error => { entrance?.remove(); throw error; });
    state = { startPage: page, nextPage: page + 1,
      hasMore: data.hasMore, nodes: [], codes: new Set(), index: 0, offset: null };
    for (const post of data.recent) {
      if (state.codes.has(post.code)) continue;
      state.codes.add(post.code);
      state.nodes.push(renderPost(post, false, false, undefined, true));
    }
    feedCache = state;
  }
  if (target) {
    let index = state.nodes.findIndex(node => node.dataset.permalink === target || node.id === target);
    if (index < 0) {
      const data = await read(API + "?thread=" + encodeURIComponent(target), signal).catch(error => { entrance?.remove(); throw error; });
      if (signal.aborted) return;
      index = state.nodes.findIndex(node => node.id === data.op.code);
      if (index < 0) {
        state.nodes.unshift(renderPost(data.op, false, false, undefined, true));
        state.codes.add(data.op.code);

      }

    state.index = index;

  if (firstImage) { firstImage.loading = "eager"; firstImage.fetchPriority = "high"; }
  if (!state.nodes.length) list.append(el("p", null, "no media yet"));

  button.type = "button";
  const status = el("span");
  status.setAttribute("role", "status");

      if (signal.aborted) return;
      for (const post of data.recent) {
        if (state.codes.has(post.code)) continue;
        state.codes.add(post.code);
        const node = renderPost(post, false, false, undefined, true);
        state.nodes.push(node);
        list.append(node);
        playbackObserver?.observe(node.querySelector(".feed-media") || node);
      }
      state.nextPage++;
      state.hasMore = data.hasMore;
      status.textContent = "";
      button.textContent = "load more";

// While the feed is open, look for work published since it loaded; new work
// leads page one, so a code there we haven't shown means something just landed.
function watchForNew(state, signal) {
  let pill = null, checking = false;
  const check = async () => {
    if (document.hidden || pill || checking || activeFeed !== state) return;
    checking = true;
    try {
      const data = await read(API + "?feed=1&page=0&seed=" + feedSeed, signal);
      const fresh = data.recent.slice(0, 6).filter((post) => !state.codes.has(post.code));
      if (!fresh.length || signal.aborted || activeFeed !== state) return;
      pill = el("button", "new-pill", "↑ new" + (fresh[0].name ? " from " + fresh[0].name : ""));
      pill.type = "button";
      pill.onclick = () => {
        if (signal.aborted || activeFeed !== state) return;
        const posts = fresh.filter(post => !state.codes.has(post.code));
        const nodes = posts.map(post => renderPost(post, false, false, undefined, true));
        const list = view.querySelector(".feed-list");
        if (!nodes.length || !list) { pill.remove(); pill = null; return; }
        exitMediaInteraction();
        document.activeElement?.blur();
        list.prepend(...nodes);
        state.nodes.unshift(...nodes);
        posts.forEach(post => state.codes.add(post.code));
        nodes.forEach(node => playbackObserver?.observe(node.querySelector(".feed-media") || node));
        state.index = 0; state.offset = 0;
        pill.remove(); pill = null;
        // Use the posts already found by the poll. A second fetch can reorder
        // the feed, and rebuilding it discards every running program.
        window.scrollTo({ top: feedTop(nodes[0]), behavior: "instant" });
        rememberFeed(); shakeCardLetters(nodes[0]); sampleEngagement();
      };
      document.body.append(pill);
    } catch {} finally { checking = false; }
  };
  const timer = setInterval(check, 45000);
  document.addEventListener("visibilitychange", check, { signal });
  signal.addEventListener("abort", () => { clearInterval(timer); pill?.remove(); });
}

}

async function read(url, signal) {
  const response = await fetch(url, { signal });
  const data = await response.json();
  if (signal?.aborted) throw new DOMException("Navigation changed", "AbortError");
  if (!response.ok) throw new Error(data.error || "could not load mime");
  return data;
}

async function route() {
  closeComments(true);
  exitMediaInteraction();
  stopPiece();
  rememberFeed(false);
  routedPath = location.pathname;
  activeFeed = null;
  sampleEngagement();
  flushEngagement();
  feedObserver?.disconnect();
  feedObserver = null;
  playbackObserver?.disconnect();
  playbackObserver = null;
  view.querySelectorAll("video, audio").forEach((media) => media.pause());
  routeController?.abort();
  routeController = new AbortController();
  const { signal } = routeController;
  window.scrollTo(0, 0);
  document.ondragover = document.ondragleave = document.ondrop = document.onpaste = null;
  const [hash, query] = location.hash.replace(/^#\/?/, "").split("?");
  document.body.classList.toggle("feed", !hash);
  syncHeader();
  const params = new URLSearchParams(query);
  const page = Math.max(0, parseInt(params.get("page")) || 0);
  view.replaceChildren(el("p", null, "loading…"));
  try {
    if (!hash) await home(page, signal, postFromPath(location.pathname));
    else if (hash === "saved") await savedPosts(page, signal);
    else if (hash.startsWith("t/")) await thread(hash.slice(2), undefined, signal);
    else if (hash.startsWith("media/")) {
      const [, kind, code] = hash.split("/");
      await thread(decodeURIComponent(code || ""), kind, signal);
    } else await board(decodeURIComponent(hash), page, signal);
    if (signal.aborted) return;
    syncSavedButtons();
    if (params.get("comment") === "1" && (hash.startsWith("t/") || hash.startsWith("media/"))) {
      const comment = view.querySelector("#post textarea");
      comment?.focus();
      comment?.scrollIntoView({ block: "center" });
    }
  } catch (error) {
    if (signal.aborted) return;
    view.replaceChildren(el("p", null, error.message || "could not load mime"));
  }
}

// Keep the current card through orientation changes.
window.addEventListener("resize", () => {
  if (activeFeed && activeFeed.viewportWidth !== view.clientWidth) {
    const node = activeFeed.nodes[activeFeed.index];
    if (node) window.scrollTo(0, feedTop(node) + activeFeed.offset);
    activeFeed.viewportWidth = view.clientWidth;
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    exitMediaInteraction();
    clearDirectInteraction();
    view.querySelectorAll("video, audio").forEach((media) => media.pause());
  }
});
window.addEventListener("keydown", (event) => {
  if (document.querySelector("dialog[open]") || !activeFeed?.nodes.length || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey ||
      event.target.closest("input, textarea, button, a, audio, video, pre, [contenteditable]")) return;
  const step = { ArrowDown: 1, PageDown: 1, ArrowUp: -1, PageUp: -1 }[event.key];
  if (!step) return;
  event.preventDefault();
  const index = Math.max(0, Math.min(activeFeed.nodes.length - 1, activeFeed.index + step));
  window.scrollTo({ top: feedTop(activeFeed.nodes[index]),
    behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth" });
});
async function start() {
  let resumeComments;
  const params = new URLSearchParams(location.search);
  if (params.has("state") && (params.has("code") || params.has("error"))) {
    accountAction.disabled = true;
    try {
      const client = await authClient();
      const { appState } = await client.handleRedirectCallback();
      resumeComments = typeof appState?.comment === 'string' ? appState.comment : null;
      const hash = typeof appState?.hash === "string" && appState.hash.startsWith("#/") ? appState.hash : "#/";
      const resumedPost = resumeComments && postFromPath(appState?.commentPath || '');
      const path = resumedPost ? postPath(resumedPost) : location.pathname;
      history.replaceState(null, "", path + hash);
    } catch (error) {
      accountStatus.textContent = error.message || "could not finish sign-in";
      history.replaceState(null, "", location.pathname + "#/");
    } finally { accountAction.disabled = false; }
  }
  window.onhashchange = route;
  window.addEventListener("popstate", () => { if (location.pathname !== routedPath) route(); });
  await route();
  await updateIdentity();
  if (resumeComments) await openComments(resumeComments);
}
start();
</script>
