<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; worker-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Game Boy preview</title><link rel="stylesheet" href="watch.css"></head>
<body class="game"><canvas id="screen" width="160" height="144" tabindex="0" aria-label="Game Boy. WASD or arrows move, Space or X is A, Enter or Z is B, P starts, Shift selects."></canvas>
<p id="game-status" role="status">Loading Game Boy…</p>
<div class="game-controls" aria-label="Game Boy controls"><button data-key="LEFT" aria-label="Left">←</button><button data-key="UP" aria-label="Up">↑</button><button data-key="DOWN" aria-label="Down">↓</button><button data-key="RIGHT" aria-label="Right">→</button><button data-key="B">B</button><button data-key="A">A</button><button data-key="SELECT">Select</button><button data-key="START">Start</button></div>
<button id="pause" hidden>Pause</button>
<script src="/aesthetic.computer/dep/wasmboy/wasmboy.ts.umd.js"></script><script src="gameboy.js"></script></body></html>
