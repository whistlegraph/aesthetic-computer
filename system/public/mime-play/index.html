<!doctype html>
<!-- Mime player: runs one published Whistlegraph piece, for mime.ac's feed.
     /mime-play/?code=wgXxxxx fetches the piece's source from the public
     /api/mime-feed and drops it into an AC runtime on this same origin, the
     way the Whistlegraph app's feed does. No account, no session. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mime player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #19172e; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    p { position: fixed; inset: auto 0 45%; margin: 0; text-align: center; color: #f4efdd; font: 16px "Comic Relief", "Comic Sans MS", cursive; }
  </style>
</head>
<body>
  <p id="note">loading…</p>
<script type="module" src="player.mjs?v=2026-10-14.1"></script>
</body>
</html>
