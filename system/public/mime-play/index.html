<!doctype html>
<!-- Mime player: runs one published Whistlegraph piece, for mime.ac's feed.
     /mime-play/?code=wgXxxxx fetches the piece's source from the public
     /api/mime-feed and drops it into an AC runtime on this same origin, the
     way the Whistlegraph app's feed does. No account, no session. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mime player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #19172e; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    p { position: fixed; inset: auto 0 45%; margin: 0; text-align: center; color: #f4efdd; font: 16px "Comic Relief", "Comic Sans MS", cursive; }
  </style>
</head>
<body>
  <p id="note">loading…</p>
<script>
const note = document.getElementById("note");
const code = new URLSearchParams(location.search).get("code") || "";
const run = async () => {
  if (!/^wg[A-Za-z0-9]{1,32}$/.test(code)) throw new Error("no such piece");
  const response = await fetch("/api/mime-feed?code=" + encodeURIComponent(code));
  if (!response.ok) throw new Error("no such piece");
  const { source } = await response.json();
  if (typeof source !== "string" || !source) throw new Error("this piece has no code yet");
  const frame = document.createElement("iframe");
  frame.title = "Whistlegraph piece " + code;
  frame.allow = "autoplay 'none'; camera 'none'; microphone 'none'";
  frame.src = "/wipe?noauth=true&noplot=true&nogap=true&nolabel=true&preview=walkieware";
  document.body.append(frame);
  // The runtime is same-origin: wait for it to boot, then hand it the piece.
  const poll = setInterval(() => {
    const win = frame.contentWindow;
    if (!win?.preloaded || !win.acSEND) return;
    clearInterval(poll);
    note.remove();
    win.acSEND({ type: "dropped:piece", content: { name: "mime", source,
      search: "noauth=true&noplot=true&nogap=true&nolabel=true", isKidLisp: false } });
  }, 100);
};
run().catch((error) => { note.textContent = error.message || "could not play this piece"; });
</script>
</body>
</html>
