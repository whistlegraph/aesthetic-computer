<!doctype html>
<html lang="{{locale}}">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ prompt.screen.texts.pageTitle | escape }}</title>
  {%- auth0:head -%}
  <style id="ac-login-style">
/* AC's shared Auth0 page. Stable widget hooks only; no generated class names. */
:root {
  --primary-color: #202019;
  --button-font-color: #fff;
  --link-color: #a32770;
  --title-font-color: #202019;
  --font-default-color: #202019;
  --widget-background-color: #fff;
  --input-background-color: #fff;
  --input-border-color: #76736e;
  --secondary-button-border-color: #b8b5ae;
  --secondary-button-text-color: #202019;
  --base-focus-color: #a32770;
  --ac-pink: #ff3fa4;
}
html { font-size: 18px !important; }
body {
  --page-background-color: #eee9df;
  --page-background-image: url(https://oven.aesthetic.computer/kidlisp-backdrop.webp);
  --button-border-width: 1px;
  --social-button-border-width: 1px;
  --button-border-radius: 8px;
  --input-border-radius: 8px;
  --border-radius-outer: 20px;
  --box-border-width: 4px;
  --box-border-color: var(--ac-pink);
  --shadow-component-outer: 0 18px 50px rgba(20, 10, 30, 0.45);
  --title-font-size: 1.5rem;
  --default-font-size: 1rem;
  --ulp-label-font-size: 1rem;
  --logo-height: 64px;
  background: #50465a url(https://oven.aesthetic.computer/kidlisp-backdrop.webp) center / cover no-repeat fixed !important;
}
/* The animated KidLisp backdrop lives on body; keep Auth0's own layer clear. */
body::before { background: transparent !important; background-image: none !important; }
main { min-height: 100svh; padding: 32px 16px !important; }
._prompt-box-outer { width: min(100%, 440px) !important; }
#screen-header { padding-bottom: 16px; }
#screen-header h1 { line-height: 1.25; }
#screen-header h1 .ac-dot { color: var(--ac-pink); } /* the dot in Aesthetic.Computer; template.html wraps it */
#screen-header p:empty { display: none; }
input:not([type=hidden]):not([type=checkbox]) { font-size: 18px !important; min-height: 56px; }
button[data-action-button-primary], button[data-action-button-secondary] {
  min-height: 56px; font-size: 18px !important; border-radius: 8px !important;
}
/* Social buttons: icon pinned left, label centred. */
button[data-provider] { justify-content: center !important; }
button[data-provider] > span[data-provider] { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); }
button[data-provider] > span:not([data-provider]) { text-align: center !important; }
/* "Create account" / "Log in" under the form, centred like the rest of the card. */
p:has(> a[href*="/u/"]) { text-align: center; }
/* The OR divider is the div right before the social-provider forms. */
div:has(+ div > form[data-provider]) { font-size: 1rem !important; letter-spacing: 0.08em; }
div:has(+ div > form[data-provider]) > span { padding: 0 14px; }
/* Auto layout stretches the card to the viewport and reserves a bottom-button band
   (padding-bottom: button-height + spacing, !important). Let the card hug its content. */
._prompt-box-outer > :first-child { flex-grow: 0 !important; }
._prompt-box-outer > * > * { min-height: 0 !important; }
body._widget-auto-layout ._prompt-box-outer > * > * > div:has(form) { padding-bottom: 40px !important; }
a:focus-visible, button:focus-visible { outline: 3px solid #a32770; outline-offset: 3px; }
@media (max-width: 480px) {
  main { padding: 16px !important; }
  ._prompt-box-outer { margin-top: 0 !important; }
}
.ac-switch { width: 100%; min-height: 56px; padding: 12px 16px; margin-top: 12px; border: 1px solid #b8b5ae; border-radius: 8px; background: white; color: #202019; font: inherit; cursor: pointer; }

/* Like Aesel's SignInPanelLayout: lay out once, fit the whole card. The
   challenge iframe scales with its parent; its contents and controls stay intact.
   Without the script the ordinary responsive, scrollable page still works. */
.ac-fit-ready body { margin: 0 !important; }
.ac-fit-ready #ac-login-fit { position: relative; width: 100%; height: 100svh; overflow: clip; }
.ac-fit-ready #ac-login-stage {
  position: absolute; width: 440px; left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--ac-login-scale, 1));
  transform-origin: center;
}
.ac-fit-ready #ac-login-stage main {
  box-sizing: border-box; width: 100%; min-height: 0 !important;
  margin: 0 !important; padding: 0 !important;
}
.ac-fit-ready ._prompt-box-outer { margin: 0 !important; }
  </style>
</head>
<body class="_widget-auto-layout">
  <div id="ac-login-fit"><div id="ac-login-stage">
    {%- auth0:widget -%}
  </div></div>
  <script id="ac-login-fit-script">
// Measure Auth0's rendered widget, including late validation and Turnstile.
// Do not read credentials, replace inputs, navigate, or reach into iframes.
(function () {
  var root = document.documentElement;
  var fit = document.getElementById('ac-login-fit');
  var stage = document.getElementById('ac-login-stage');
  if (!fit || !stage || typeof ResizeObserver === 'undefined') return;
  var pending = false, previous = 0;
  var initialRatio = window.devicePixelRatio;
  function update() {
    pending = false;
    // Explicit browser zoom must remain an accessibility escape hatch.
    if (window.devicePixelRatio !== initialRatio) {
      root.classList.remove('ac-fit-ready');
      return;
    }
    root.classList.add('ac-fit-ready');
    var w = Math.max(stage.offsetWidth, stage.scrollWidth);
    var h = Math.max(stage.offsetHeight, stage.scrollHeight);
    if (!w || !h) return;
    var width = document.documentElement.clientWidth;
    // Use the layout viewport: focusing an input must not shrink the card
    // again when a phone's keyboard opens. Pinch zoom stays browser-controlled.
    var height = window.innerHeight;
    var scale = Math.min(1, Math.max(1, width - 24) / w, Math.max(1, height - 24) / h);
    if (Math.abs(scale - previous) > 0.0001) {
      stage.style.setProperty('--ac-login-scale', String(scale));
      previous = scale;
    }
    fit.style.height = height + 'px';
  }
  function schedule() {
    if (!pending) { pending = true; requestAnimationFrame(update); }
  }
  new ResizeObserver(schedule).observe(stage);
  // Auth0 can replace a screen or add a validation message without navigation.
  new MutationObserver(schedule).observe(stage, { childList: true, subtree: true, characterData: true });
  window.addEventListener('resize', schedule);
  window.addEventListener('pageshow', schedule);
  if (document.fonts) document.fonts.ready.then(schedule);
  schedule();
})();
  </script>
  <script id="ac-login-dot">
    // Paint the dot in "Aesthetic.Computer" pink. The widget markup is Auth0's, so wrap it
    // after render and again if the widget re-renders. Without JS the title is plain text.
    (function () {
      function dot() {
        var h = document.querySelector('#screen-header h1');
        if (!h || h.querySelector('.ac-dot')) return;
        var t = h.textContent, i = t.indexOf('.');
        if (i < 0 || t.indexOf('.', i + 1) >= 0) return;
        h.textContent = '';
        var s = document.createElement('span');
        s.className = 'ac-dot';
        s.textContent = '.';
        h.append(t.slice(0, i), s, t.slice(i + 1));
      }
      dot();
      new MutationObserver(dot).observe(document.body, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
