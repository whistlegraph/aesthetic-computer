<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Aesthetic Computer</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <style>
      @font-face {
        font-family: 'ProggyClean';
        src: url('ProggyClean.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
      body {
        min-height: 100dvh;
        padding: 16px;
        display: grid;
        place-items: center;
        background: rgb(70, 50, 100);
        color: #fff1e0;
        font: 24px/1.2 ProggyClean, monospace;
        -webkit-text-size-adjust: none;
      }
      main {
        width: min(100%, 340px);
        padding: 20px;
        border: 2px solid #ff71bf;
        background: #191325;
      }
      h1 { margin: 0 0 12px; color: #ff71bf; font: inherit; }
      p { margin: 0 0 20px; }
      button {
        border: 0;
        padding: 8px 16px;
        color: #191325;
        background: #ff71bf;
        font: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible { outline: 2px solid #fff1e0; outline-offset: 3px; }
      button:active { background: #fff1e0; }
      button:disabled { opacity: .65; }
      @media (max-height: 260px) {
        body { padding: 8px; font-size: 20px; line-height: 1; }
        main { padding: 12px; }
        h1 { margin-bottom: 8px; }
        p { margin-bottom: 12px; }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="connection-title">
      <h1 id="connection-title">Not connected</h1>
      <p>Connect to start Aesthetic Computer.</p>
      <button id="retry" type="button">Retry</button>
    </main>
    <script>
      // Tell the native host to attempt the live URL even if its path
      // monitor still reads offline (the monitor can lag a few seconds
      // behind a real reconnect, especially on cell handoffs).
      const btn = document.getElementById("retry");
      btn.addEventListener("click", () => {
        btn.disabled = true;
        btn.textContent = "Retrying…";
        try {
          const bridge = window.webkit?.messageHandlers?.iOSApp;
          if (bridge) bridge.postMessage(JSON.stringify({ type: "reload-online" }));
          else window.location.reload();
        } catch (err) {
          // No native bridge (running outside the app) — just reload.
          window.location.reload();
        }
        // Re-enable after a moment so a second tap is possible if the
        // first retry didn't actually swap the view.
        setTimeout(() => {
          btn.disabled = false;
          btn.textContent = "Retry";
        }, 4000);
      });
    </script>
  </body>
</html>
