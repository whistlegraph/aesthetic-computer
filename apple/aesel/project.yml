name: Aesel
options:
  bundleIdPrefix: computer.aesthetic
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: FB5948YR3S
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Aesel:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes:
          - Session
      - path: Resources/Session
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.aesthetic.easel
        PRODUCT_NAME: Aesel
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
  AeselMac:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        excludes:
          - Session
      - path: Resources/Session
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.aesthetic.easel
        PRODUCT_NAME: Aesel
        INFOPLIST_FILE: MacInfo.plist
        CODE_SIGN_ENTITLEMENTS: Mac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: computer.aesthetic.aesel.native
    scheme:
      gatherCoverageData: false
