name: Whistlegraph
options:
  bundleIdPrefix: computer.aesthetic
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Internal: debug
  Release: release
settings:
  configs:
    Internal:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG WHISTLEGRAPH_INTERNAL_PAYMENTS"
  base:
    DEVELOPMENT_TEAM: FB5948YR3S
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "107"
targets:
  Whistlegraph:
    type: application
    platform: iOS
    sources:
      - Sources
      - ../aesel/Sources/NativeSignIn.swift
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/Fixtures
        type: folder
        buildPhase: resources
      - path: Resources/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.aesthetic.walkieware
        PRODUCT_NAME: Whistlegraph
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Reject internal payment archives
        script: |
          if [ "$CONFIGURATION" = "Internal" ] && [ "$ACTION" = "install" ]; then
            echo "error: Internal wallet testing cannot be archived. Use Release for distribution."
            exit 1
          fi
        basedOnDependencyAnalysis: false
    scheme:
      gatherCoverageData: false

  WhistlegraphUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Whistlegraph
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.aesthetic.walkieware.uitests
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - WhistlegraphUITests

schemes:
  WhistlegraphInternal:
    build:
      targets:
        Whistlegraph: all
        WhistlegraphUITests: [test]
    run:
      config: Internal
    test:
      config: Internal
      targets:
        - WhistlegraphUITests
    archive:
      config: Release
