<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Whistlegraph</title>
<style>
@font-face{font-family:Comic;src:url('ComicRelief-Regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#19172e;color:#f4efdd;font-family:Comic,Arial;overflow:hidden}button{font:inherit;border:0;cursor:pointer}button:disabled{opacity:.6}[hidden]{display:none!important}.top{height:68px;padding:16px 21px}.brand{color:#f4efdd;background:none}.stage{position:absolute;inset:0;pointer-events:none}.stage>*{pointer-events:auto}.initial{position:absolute;inset:110px 30px 180px;display:flex;align-items:center;justify-content:center;flex-direction:column}.initial h1{font-size:36px;text-align:center}.mark{margin-bottom:24px}.whistlegraph-dock{position:absolute;bottom:22px;left:21px;right:21px;z-index:7}.speak-button{width:100%;min-height:132px;background:#d9ef9f;color:#262038;border:3px solid #f7f5dc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.speak-button.holding{background:#f7b474}.speak-button svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2}.voice-state{position:absolute;inset:70px 0 165px;padding:30px;display:flex;flex-direction:column;justify-content:center;z-index:8}.voice-state p{white-space:pre-wrap}.wave-bars{display:none}dialog{background:#272139;color:#f4efdd;border:1px solid #665973;border-radius:12px;max-width:90%;font:22px Comic,Arial}dialog button{padding:14px}textarea{font:24px Comic,Arial;width:100%}.toast{position:absolute;top:80px;left:20px;right:20px;z-index:20;background:#4d2840;padding:15px}
</style></head><body class="whistlegraph">
<header class="top"><button class="brand" id="home">whistlegraph</button></header>
<main id="stage" class="stage"><section id="initial" class="initial"><div class="mark"></div><h1>Say what it should do.</h1></section><div id="play-deck" hidden></div></main>
<div id="voice-state" class="voice-state" hidden><div class="wave-bars"></div><h2 id="voice-heading"></h2><p id="voice-transcript"></p></div>
<div class="whistlegraph-dock" id="whistlegraph-dock"><button id="speak" class="speak-button"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg><span id="speak-label">Hold to talk</span></button><p class="voice-note"></p></div>
<dialog id="info"><h2>Whistlegraph</h2><p></p><p></p><form method="dialog"><button>Close</button></form></dialog>
<dialog id="prompt-modal"><form id="words-form"><textarea id="words"></textarea><button>Send</button></form></dialog>
<div id="toast" class="toast" hidden></div><div hidden><button id="export"></button><button id="reset"></button><button id="new"></button><div id="more-menu"></div><canvas id="art"></canvas></div>
<script>
const $=id=>document.getElementById(id);let talking=false,voiceBusy=false,gameMode='edit';let voiceStart=()=>{},voiceEnd=()=>{};const canvas=$('art');function openWords(){$('prompt-modal').showModal()}function toast(text){$('toast').textContent=text;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,5000)}
$('speak').addEventListener('pointerdown',e=>{e.preventDefault();$('speak').setPointerCapture(e.pointerId);voiceStart()});$('speak').addEventListener('pointerup',()=>voiceEnd());$('speak').addEventListener('pointercancel',()=>voiceEnd(true));$('speak').addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();voiceStart()}});$('speak').addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();voiceEnd()}});window.addEventListener('blur',()=>voiceEnd(true));
</script></body></html>
