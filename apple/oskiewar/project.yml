name: Oskiewar
options:
  bundleIdPrefix: computer.aesthetic
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: FB5948YR3S
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Oskiewar:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../../xbox/live/mac-test.html
        buildPhase: resources
      - path: ../../xbox/live/oskiewar.js
        buildPhase: resources
      - path: ../../xbox/live/oskiewar-sfx.mjs
      - path: ../../xbox/live/oskiewar-voice.mjs
        buildPhase: resources
      - path: ../../xbox/live/oskiewar-midi.mjs
        buildPhase: resources
      - path: ../../xbox/live/frame-driver.mjs
        buildPhase: resources
      - path: ../../xbox/live/round-room.mjs
        buildPhase: resources
      - path: ../../system/public/aesthetic.computer/dep/@akamfoad/qr/qr.mjs
        buildPhase: resources
      - path: ../../system/public/aesthetic.computer/lib/product-analytics.mjs
        buildPhase: resources
      - path: ../../system/public/aesthetic.computer/lib/oskiewar-analytics.mjs
        buildPhase: resources
      - path: ../../system/public/papers.aesthetic.computer/foundry/fonts/ComicRelief-Regular.ttf
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.aesthetic.oskiewar
        PRODUCT_NAME: oskiewar
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Oskiewar.entitlements
    scheme:
      gatherCoverageData: false
