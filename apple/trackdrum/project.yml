# XcodeGen spec for TrackDrum on iOS — the phone edition of the Mac
# instrument in slab/tracktramp. Same shape as apple/oskiewar/project.yml:
# generate, never commit, the .xcodeproj.
#
#   cd apple/trackdrum && xcodegen generate
#
# The bundle identifier is the one the Mac app already claims. Apple registers
# it as UNIVERSAL, so an App Store record opened here is the record a Mac App
# Store TrackDrum would later join — one purchase covering both platforms.
# Fork it to computer.aesthetic.trackdrum (the namespace Menu Band's store
# build uses) if the two are meant to be sold apart.

name: TrackDrum

options:
  bundleIdPrefix: computer.aestheticcomputer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: FB5948YR3S
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TrackDrum:
    type: application
    platform: iOS

    sources:
      # The app shell, the touch surface, the audio session, and the one
      # transform that turns a portrait phone into a trackpad.
      - path: Sources

      # Shared with the Mac app, compiled from where they live rather than
      # copied. Each typechecks against the iOS SDK unmodified.
      - path: ../../slab/menuband/Sources/MenuBand/MenuBandPercussion.swift
      - path: ../../slab/menuband/Sources/MenuBand/TrackpadSurfacePhysics.swift
      - path: ../../slab/menuband/Sources/MenuBand/FocusCueBeep.swift
      - path: ../../slab/tracktramp/Sources/TrackDrumContact.swift

      # v1 draws its zones with CoreGraphics. TracktrampShaders.metalsource and
      # the Metal membrane it renders come over when the artwork does.

      # The Mac app's own drum icon, cropped full-bleed and flattened — iOS
      # masks the corners itself and rejects an alpha channel.
      - path: Assets.xcassets
        buildPhase: resources

    settings:
      base:
        PRODUCT_NAME: TrackDrum
        PRODUCT_BUNDLE_IDENTIFIER: computer.aestheticcomputer.trackdrum
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # iPhone only for v1 — the drum is portrait-locked and nothing about an
        # iPad layout has been played or tested. Widen when it has been.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

    scheme:
      gatherCoverageData: false
