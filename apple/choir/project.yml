name: Choir
options:
  bundleIdPrefix: computer.aesthetic
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: FB5948YR3S
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "10"
targets:
  Choir:
    type: application
    platform: iOS
    sources:
      - Sources
      - ../aesel/Sources/AccountDeletion.swift
      - ../aesel/Sources/CurtainAccountButtonStyle.swift
      - ../aesel/Sources/AeselButtonStyle.swift
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.aesthetic.choir
        PRODUCT_NAME: Choir
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Choir.entitlements
      properties:
        aps-environment: development
        keychain-access-groups:
          - $(AppIdentifierPrefix)computer.aesthetic.choir.shared
    dependencies:
      - target: ChoirShare
        embed: true
  ChoirShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.aesthetic.choir.share
        PRODUCT_NAME: ChoirShare
        INFOPLIST_FILE: Share/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    entitlements:
      path: Share/ChoirShare.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)computer.aesthetic.choir.shared
