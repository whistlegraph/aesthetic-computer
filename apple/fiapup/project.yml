name: Fiapup
options:
  bundleIdPrefix: computer.aesthetic
  deploymentTarget:
    macOS: "12.0"
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Fiapup:
    type: application
    platform: macOS
    sources:
      - Sources/Shared
      - Sources/Mac
      - Assets.xcassets
      - path: ../../xbox/fiapup/index.html
        buildPhase: resources
      - path: ../../xbox/fiapup/fiapup.js
        buildPhase: resources
      - path: ../../xbox/live/scene3d-webgl.mjs
        buildPhase: resources
      - path: ../../xbox/live/scene3d.mjs
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: fiapup
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.games
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.aesthetic.fiapup
        PRODUCT_NAME: fiapup
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signed to run locally; a Developer ID lane comes with a real release.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO

  # iPhone and iPad: the same bundle and scheme, full screen, both
  # orientations. Built for the Simulator here; no team, no provisioning.
  FiapupiOS:
    type: application
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/iOS
      - Assets.xcassets
      - path: ../../xbox/fiapup/index.html
        buildPhase: resources
      - path: ../../xbox/fiapup/fiapup.js
        buildPhase: resources
      - path: ../../xbox/live/scene3d-webgl.mjs
        buildPhase: resources
      - path: ../../xbox/live/scene3d.mjs
        buildPhase: resources
    info:
      path: Info-iOS.plist
      properties:
        CFBundleDisplayName: fiapup
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.games
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.aesthetic.fiapup
        PRODUCT_NAME: fiapup
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
