name: Fiapup
options:
  bundleIdPrefix: computer.aesthetic
  deploymentTarget:
    macOS: "12.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Fiapup:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: ../../xbox/fiapup/index.html
        buildPhase: resources
      - path: ../../xbox/fiapup/fiapup.js
        buildPhase: resources
      - path: ../../xbox/live/scene3d-webgl.mjs
        buildPhase: resources
      - path: ../../xbox/live/scene3d.mjs
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: fiapup
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.games
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.aesthetic.fiapup
        PRODUCT_NAME: fiapup
        # Signed to run locally; a Developer ID lane comes with a real release.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
