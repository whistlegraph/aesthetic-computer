name: Mime
options:
  bundleIdPrefix: computer.aesthetic
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: FB5948YR3S
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "10"
targets:
  Mime:
    type: application
    platform: iOS
    sources:
      - Sources
      - ../whistlegraph/Sources
      - ../aesel/Sources/NativeSignIn.swift
      - ../aesel/Sources/CurtainAccountButtonStyle.swift
      - ../aesel/Sources/AeselButtonStyle.swift
      - path: ../whistlegraph/Resources/Web
        type: folder
        buildPhase: resources
      - path: ../whistlegraph/Resources/Fixtures
        type: folder
        buildPhase: resources
      - path: ../../system/public/mime-layout.json
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.aesthetic.mime
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MIME_APP"
        PRODUCT_NAME: Mime
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - MimeUITests
  MimeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Mime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.aesthetic.mime.uitests
        GENERATE_INFOPLIST_FILE: YES
