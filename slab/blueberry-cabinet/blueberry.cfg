<?xml version="1.0"?>
<!-- Persistent Blueberry QWERTY controls. Loaded with: -ctrlr blueberry -->
<mameconfig version="10">
    <system name="default">
        <input>
            <port type="P1_JOYSTICK_UP"><newseq type="standard">KEYCODE_W</newseq></port>
            <port type="P1_JOYSTICK_DOWN"><newseq type="standard">KEYCODE_S</newseq></port>
            <port type="P1_JOYSTICK_LEFT"><newseq type="standard">KEYCODE_A</newseq></port>
            <port type="P1_JOYSTICK_RIGHT"><newseq type="standard">KEYCODE_D</newseq></port>
            <port type="P1_BUTTON1"><newseq type="standard">KEYCODE_J</newseq></port>
            <port type="P1_BUTTON2"><newseq type="standard">KEYCODE_K</newseq></port>
            <port type="P1_BUTTON3"><newseq type="standard">KEYCODE_L</newseq></port>
            <port type="P1_BUTTON4"><newseq type="standard">KEYCODE_N</newseq></port>
            <port type="P1_BUTTON5"><newseq type="standard">KEYCODE_M</newseq></port>
            <port type="P1_BUTTON6"><newseq type="standard">KEYCODE_COMMA</newseq></port>
            <port type="START1"><newseq type="standard">KEYCODE_1</newseq></port>
            <port type="COIN1"><newseq type="standard">KEYCODE_ENTER</newseq></port>
        </input>
    </system>
</mameconfig>
