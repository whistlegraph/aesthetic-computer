<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wordplay</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f7f2e7;color:#202b29;font:20px system-ui,sans-serif}
  main{max-width:940px;margin:auto;padding:36px 28px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:70px}
  h1{font-size:28px;letter-spacing:-1px;margin:0}#score{font-variant-numeric:tabular-nums;font-size:17px}
  #progress{font-size:16px;color:#58615a}h2{font-size:clamp(32px,5vw,54px);line-height:1.13;letter-spacing:-1.7px;margin:20px 0 38px;max-width:820px}
  #choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{font:inherit;cursor:pointer;border:2px solid #c9cfbe;border-radius:15px;color:inherit;background:#fffdf7;padding:24px;text-align:left;min-height:80px;transition:background .12s}
  button:hover:not(:disabled){background:#e7edda;border-color:#53714a}button:focus-visible{outline:3px solid #3867be;outline-offset:4px}
  button:disabled{cursor:default;opacity:.65}button.correct{background:#d7ebbf;border-color:#527b32;opacity:1}button.wrong{background:#f6dbd6;border-color:#b66857;opacity:1}
  #feedback{min-height:34px;font-weight:650;margin:25px 0 12px}#next,#again{background:#223f35;color:white;border-color:#223f35;min-height:58px;padding:14px 24px;text-align:center}
  #history{padding:0;list-style:none;color:#58615a;font-size:16px;line-height:1.8;margin-top:30px}#history li{border-top:1px solid #d8daca;padding:7px 0}
  [hidden]{display:none!important}@media(max-width:540px){main{padding:24px 20px}header{margin-bottom:45px}#choices{grid-template-columns:1fr}button{padding:18px;min-height:64px}}
</style>
<main>
  <header><h1>Wordplay</h1><output id="score">Score: 0 / 0</output></header>
  <div id="progress"></div>
  <h2 id="clue"></h2>
  <div id="choices" aria-labelledby="clue"></div>
  <p id="feedback" role="status" aria-live="polite"></p>
  <button id="next" hidden>Next word</button>
  <button id="again" hidden>Play again</button>
  <ol id="history" aria-label="Round history"></ol>
</main>
<script type="module" src="./game.mjs"></script>
</html>
