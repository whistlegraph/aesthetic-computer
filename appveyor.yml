version: 1.0.{build}
image: Visual Studio 2022
clone_depth: 1

only_commits:
  files:
    - xbox/
    - appveyor.yml

clone_script:
  - cmd: git init .
  - cmd: git remote add origin https://github.com/whistlegraph/aesthetic-computer.git
  - cmd: git config core.sparseCheckout true
  - cmd: echo xbox/assets/>>.git\info\sparse-checkout
  - cmd: echo xbox/live/>>.git\info\sparse-checkout
  - cmd: echo xbox/native-bios/>>.git\info\sparse-checkout
  - cmd: echo xbox/runtime/>>.git\info\sparse-checkout
  - cmd: echo xbox/tools/>>.git\info\sparse-checkout
  - cmd: echo xbox/test-native-windows.cmd>>.git\info\sparse-checkout
  - cmd: echo system/backend/kidlisp-ast.mjs>>.git\info\sparse-checkout
  - cmd: echo system/public/type/webfonts/ywft-processing-regular.ttf>>.git\info\sparse-checkout
  - cmd: echo system/public/papers.aesthetic.computer/foundry/fonts/ComicRelief-Regular.ttf>>.git\info\sparse-checkout
  - cmd: echo appveyor.yml>>.git\info\sparse-checkout
  - cmd: git fetch --depth=1 --filter=blob:none origin %APPVEYOR_REPO_COMMIT%
  - cmd: git checkout --detach FETCH_HEAD

environment:
  package_dir: C:\projects\aesthetic-computer\artifacts\
  cert_password: aesthetic-xbox-ci
  # The GDK desktop lane moved here from .github/workflows/xbox-gdk-desktop.yml,
  # which cannot run: that account is billing-locked and every job is refused
  # before it starts. Pinned edition — bumping it is a deliberate act, and the
  # cache key follows appveyor.yml.
  gdk_package: microsoft.gdk.windows
  gdk_version: 2604.3.7874

cache:
  - .gdk -> appveyor.yml

install:
  - ps: |
      Add-Type -AssemblyName System.Drawing
      $master = [Drawing.Image]::FromFile((Join-Path $env:APPVEYOR_BUILD_FOLDER 'xbox\assets\pals.png'))
      function Write-Asset($assets, $name, $width, $height) {
        $bitmap = [Drawing.Bitmap]::new($width, $height)
        $graphics = [Drawing.Graphics]::FromImage($bitmap)
        $graphics.Clear([Drawing.Color]::FromArgb(18, 15, 26))
        $graphics.InterpolationMode = [Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
        $scale = [Math]::Min($width / $master.Width, $height / $master.Height)
        $drawWidth = [int]($master.Width * $scale)
        $drawHeight = [int]($master.Height * $scale)
        $left = [int](($width - $drawWidth) / 2)
        $top = [int](($height - $drawHeight) / 2)
        $graphics.DrawImage($master, $left, $top, $drawWidth, $drawHeight)
        $bitmap.Save((Join-Path $assets $name), [Drawing.Imaging.ImageFormat]::Png)
        $graphics.Dispose(); $bitmap.Dispose()
      }
      $password = ConvertTo-SecureString $env:cert_password -AsPlainText -Force
      foreach ($project in @('xbox\native-bios')) {
        $root = Join-Path $env:APPVEYOR_BUILD_FOLDER $project
        $assets = Join-Path $root 'Assets'
        New-Item -ItemType Directory -Force $assets | Out-Null
        Write-Asset $assets 'Square150x150Logo.png' 150 150
        Write-Asset $assets 'Square44x44Logo.png' 44 44
        Write-Asset $assets 'Wide310x150Logo.png' 310 150
        Write-Asset $assets 'SplashScreen.png' 620 300
        Write-Asset $assets 'StoreLogo.png' 50 50
        $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=AestheticComputerDev' `
          -KeyUsage DigitalSignature -KeyExportPolicy Exportable -HashAlgorithm SHA256 `
          -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3') `
          -FriendlyName 'AC Xbox CI' -CertStoreLocation 'Cert:\CurrentUser\My'
        $key = 'NativeBios_TemporaryKey.pfx'
        Export-PfxCertificate -Cert $cert -FilePath (Join-Path $root $key) -Password $password | Out-Null
      }
      $master.Dispose()
  # The public GDK arrives as a NuGet payload rather than an installer, which is
  # the whole reason a hosted runner can build the PC target at all. Only the PC
  # target: the Xbox Extensions that produce Gaming.Xbox.Scarlett.x64 are gated
  # behind the NDA program.
  - ps: |
      $ErrorActionPreference = 'Stop'
      $root = Join-Path $env:APPVEYOR_BUILD_FOLDER '.gdk'
      if (Test-Path (Join-Path $root 'windows\include\XGameRuntime.h')) {
        Write-Host 'GDK payload restored from cache'
      } else {
        $url = "https://api.nuget.org/v3-flatcontainer/$env:gdk_package/$env:gdk_version/$env:gdk_package.$env:gdk_version.nupkg"
        $nupkg = Join-Path $env:TEMP 'gdk.nupkg'
        Write-Host "GET $url"
        Invoke-WebRequest -Uri $url -OutFile $nupkg -UseBasicParsing
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $archive = [IO.Compression.ZipFile]::OpenRead($nupkg)
        try {
          # Every header, and only the binaries this target links or is about
          # to. The rest is ARM64 and the multi-hundred-megabyte XSAPI debug
          # libs; taking all of lib/x64 would cache ~600 MB.
          $wanted = '^native/\d+/(windows/(?:include/.+|(?:lib|bin)/x64/(?:xgameruntime[^/]*|GameInput\.lib|libHttpClient\.(?:lib|dll)|XCurl\.(?:lib|dll))))$'
          $kept = 0
          foreach ($entry in $archive.Entries) {
            if (-not $entry.Name) { continue }  # directory entry
            if ($entry.FullName -match $wanted) {
              $target = Join-Path $root ($Matches[1] -replace '/', '\')
              New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $target, $true)
              $kept++
            }
          }
          Write-Host "extracted $kept files"
        } finally { $archive.Dispose() }
        if (-not (Test-Path (Join-Path $root 'windows\include\XGameRuntime.h'))) {
          throw 'GDK payload is missing XGameRuntime.h'
        }
      }
      $grdk = Get-Content (Join-Path $root 'windows\include\grdk.h') -Raw
      if ($grdk -match '#define\s+_GRDK_EDITION\s+(\d{6})') {
        Write-Host "GDK edition $($Matches[1])"
      } else { throw 'could not read _GRDK_EDITION from grdk.h' }

build_script:
  - cmd: call xbox\test-native-windows.cmd
  # Gaming.Desktop, stock x64 plus GDK include/lib paths (the October 2025
  # layout). Built before the MSIX because it is the fast one, and a break in
  # shared code should be named in a minute rather than twenty.
  - cmd: >-
      msbuild xbox\native-bios\gdk\NativeBiosGdk.vcxproj /m /v:minimal
      /p:Configuration=Release /p:Platform=x64
      /p:GDKCrossPlatformPath=%APPVEYOR_BUILD_FOLDER%\.gdk\
  # The point of the lane: the spike runs QuickJS, D3D11 and oskiewar.js, prints
  # a verdict per check, and sets the exit code on any required one.
  - cmd: artifacts\native-bios-gdk\Release\NativeBiosGdk.exe
  - cmd: >-
      msbuild "xbox\native-bios\NativeBios.sln" /restore /m
      /p:Configuration=Release /p:Platform=x64
      /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Never
      /p:UapAppxPackageBuildMode=SideloadOnly
      /p:PackageCertificatePassword=%cert_password%
      /p:AppxPackageDir=%package_dir%native-bios\
  - ps: |
      Add-Type -AssemblyName System.IO.Compression.FileSystem
      $package = Get-ChildItem -Path (Join-Path $env:package_dir 'native-bios') `
        -Filter '*.msix' -Recurse | Select-Object -First 1
      if (-not $package) { throw 'Native BIOS MSIX was not produced' }
      $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
      try {
        $font = $archive.Entries | Where-Object {
          $_.FullName -eq 'Assets/ComicRelief-Regular.ttf'
        }
        if (-not $font) { throw 'Comic Relief is missing from Native BIOS MSIX' }
      } finally { $archive.Dispose() }

artifacts:
  - path: artifacts\native-bios\**\*
    name: xbox-native-bios-x64

branches:
  only:
    - main
