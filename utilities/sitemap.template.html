<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/icon/128x128/prompt.png" type="image/png">
<title>aesthetic.computer is home to &middot; Aesthetic Computer</title>
<meta name="description" content="Public products, creative tools and supported interfaces in the Aesthetic Computer network.">
<link rel="canonical" href="https://sitemap.aesthetic.computer/">
<meta property="og:title" content="aesthetic.computer is home to">
<meta property="og:description" content="Public products, creative tools and supported interfaces in the Aesthetic Computer network.">
<meta property="og:image" content="https://aesthetic.computer/preview/1200x630/prompt.png">
<meta property="og:url" content="https://sitemap.aesthetic.computer">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://aesthetic.computer/preview/1200x630/prompt.png">
<style>
  ::-webkit-scrollbar { display: none; }
  html {
    cursor: url("/aesthetic.computer/cursors/precise.svg") 12 12, auto;
  }
  body {
    margin: 0;
    font-size: 15px;
    font-family: monospace;
    -webkit-text-size-adjust: none;
    overflow-x: hidden;
    line-height: 1.45;
  }
  h1 {
    font-weight: normal;
    font-size: 15px;
    margin: 0 0 0.35em;
  }
  h1 a, h1 a:visited {
    color: inherit;
    cursor: inherit;
    text-decoration: none;
  }
  #pals {
    position: fixed;
    bottom: 5px;
    right: 12px;
    user-select: none;
    z-index: 10;
  }
  section.main {
    margin: 8px 12px;
  }
  .stats {
    display: flex;
    gap: 0.5em;
    flex-wrap: wrap;
    margin-bottom: 0.75em;
    font-size: 0.85em;
  }
  .stat {
    padding: 0.25em 0.5em;
    border-radius: 3px;
  }
  .stat strong { font-size: 1.1em; }
  #search {
    border: 1px solid;
    padding: 0.3em 0.5em;
    font-family: inherit;
    font-size: 1em;
    width: 100%;
    max-width: 22em;
    border-radius: 3px;
    margin-bottom: 0.75em;
    outline: none;
    cursor: inherit;
  }
  #search::placeholder { opacity: 0.4; }
  .card {
    border-radius: 3px;
    margin-bottom: 0.4em;
    overflow: hidden;
  }
  details > summary {
    padding: 0.35em 0.6em;
    cursor: inherit;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 0.4em;
    list-style: none;
    font-size: 0.9em;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before {
    content: "\25b6";
    font-size: 0.5em;
    transition: transform 0.2s;
    opacity: 0.4;
  }
  details[open] > summary::before { transform: rotate(90deg); }
  .tag {
    font-size: 0.55em;
    padding: 1px 4px;
    border-radius: 2px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .section-title { font-weight: bold; font-size: 0.95em; }
  .section-count { opacity: 0.35; font-size: 0.75em; margin-left: auto; }
  .section-desc {
    font-size: 0.78em;
    opacity: 0.6;
    padding: 0.2em 0.6em 0.4em;
    line-height: 1.5;
  }
  .routes {
    padding: 0.3em 0.6em;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(13em, 1fr));
    gap: 0.1em 0.6em;
    max-height: 32em;
    overflow-y: auto;
  }
  .routes.single-col { grid-template-columns: 1fr; }
  .route {
    font-size: 0.78em;
    padding: 1px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .route::before { content: "/"; opacity: 0.3; }
  .route.full-url::before { content: ""; }
  .route a { color: inherit; text-decoration: none; }
  .route a:hover { color: rgb(205, 92, 155); text-decoration: underline; }
  .route-group-label {
    font-size: 0.68em;
    padding: 0.4em 0.6em 0.1em;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: bold;
    grid-column: 1 / -1;
  }
  .redirect-row {
    font-size: 0.76em;
    padding: 2px 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr auto;
    gap: 0.3em;
    align-items: center;
  }
  .redirect-from { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .redirect-arrow { opacity: 0.3; }
  .redirect-to { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .redirect-status {
    font-size: 0.65em;
    padding: 1px 3px;
    border-radius: 2px;
    font-weight: bold;
  }
  .dynamic-pattern {
    font-size: 0.76em;
    padding: 2px 0;
    font-style: italic;
  }
  .dynamic-pattern::before { content: "\2731 "; }
  .note {
    font-size: 0.7em;
    opacity: 0.35;
    padding: 0.3em 0.6em;
  }
  .hidden { display: none !important; }

  /* Status lights inline */
  .service-light {
    width: 0.55em;
    height: 0.55em;
    border-radius: 50%;
    flex-shrink: 0;
    display: inline-block;
  }
  .service-light-green {
    background: rgb(92, 205, 155);
    box-shadow: 0 0 0 1px rgba(92, 205, 155, 0.25), 0 0 0.3em rgba(92, 205, 155, 0.5);
  }
  .service-light-yellow {
    background: rgb(205, 155, 92);
    box-shadow: 0 0 0 1px rgba(205, 155, 92, 0.25), 0 0 0.3em rgba(205, 155, 92, 0.4);
  }
  .service-light-red {
    background: rgb(230, 102, 102);
    box-shadow: 0 0 0 1px rgba(230, 102, 102, 0.25), 0 0 0.3em rgba(230, 102, 102, 0.5);
  }
  .service-light-unknown {
    background: rgba(200, 200, 200, 0.4);
    box-shadow: 0 0 0 1px rgba(200, 200, 200, 0.15);
  }
  .live-status-bar {
    font-size: 0.7em;
    opacity: 0.5;
    padding: 0.5em 0 0.25em;
  }

  .card-thumb {
    width: 24px;
    height: 24px;
    border-radius: 3px;
    object-fit: cover;
    flex-shrink: 0;
    display: block;
  }

  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    body {
      background-color: rgb(64, 56, 74);
      color: rgba(255, 255, 255, 0.85);
    }
    h1 a:hover { color: rgb(205, 92, 155); }
    .stat { background: rgba(255,255,255,0.06); }
    .stat strong { color: rgb(92, 205, 155); }
    #search {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.85);
    }
    #search:focus { border-color: rgb(205, 92, 155); }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }
    details > summary:hover { background: rgba(255,255,255,0.04); }
    .tag-primary { background: rgb(205, 92, 155); color: #fff; }
    .tag-subdomain { background: rgb(92, 205, 155); color: rgb(20, 40, 30); }
    .tag-redirect { background: rgb(205, 155, 92); color: rgb(40, 30, 20); }
    .tag-api { background: rgb(92, 155, 205); color: rgb(20, 30, 40); }
    .tag-external { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.7); }
    .tag-infra { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.7); }
    .route-group-label { color: rgb(92, 205, 155); }
    .redirect-to { color: rgb(92, 205, 155); }
    .dynamic-pattern { color: rgb(155, 120, 205); }
    .dynamic-pattern::before { color: rgb(205, 92, 155); }
    .status-200 { background: rgba(92, 205, 155, 0.2); color: rgb(92, 205, 155); }
    .status-301 { background: rgba(205, 155, 92, 0.2); color: rgb(205, 155, 92); }
    .status-302 { background: rgba(155, 120, 205, 0.2); color: rgb(155, 120, 205); }
    a, a:visited { color: rgb(205, 92, 155); }
    .card-thumb { background: rgba(255,255,255,0.06); }
  }

  /* Light mode */
  @media (prefers-color-scheme: light) {
    body {
      background-color: rgba(244, 235, 250);
      color: rgb(64, 56, 74);
    }
    h1 a:hover { color: rgb(205, 92, 155); }
    .stat { background: rgba(64, 56, 74, 0.06); }
    .stat strong { color: rgb(30, 120, 80); }
    #search {
      background: rgba(64, 56, 74, 0.04);
      border-color: rgba(64, 56, 74, 0.2);
      color: rgb(64, 56, 74);
    }
    #search:focus { border-color: rgb(205, 92, 155); }
    .card {
      background: rgba(64, 56, 74, 0.04);
      border: 1px solid rgba(64, 56, 74, 0.08);
    }
    details > summary:hover { background: rgba(64, 56, 74, 0.04); }
    .tag-primary { background: rgb(180, 72, 135); color: #fff; }
    .tag-subdomain { background: rgb(30, 140, 90); color: #fff; }
    .tag-redirect { background: rgb(180, 130, 60); color: #fff; }
    .tag-api { background: rgb(60, 120, 180); color: #fff; }
    .tag-external { background: rgba(64, 56, 74, 0.15); color: rgb(64, 56, 74); }
    .tag-infra { background: rgba(64, 56, 74, 0.15); color: rgb(64, 56, 74); }
    .route-group-label { color: rgb(30, 140, 90); }
    .redirect-to { color: rgb(30, 140, 90); }
    .dynamic-pattern { color: rgb(120, 80, 180); }
    .dynamic-pattern::before { color: rgb(180, 72, 135); }
    .status-200 { background: rgba(30, 140, 90, 0.15); color: rgb(20, 100, 60); }
    .status-301 { background: rgba(180, 130, 60, 0.15); color: rgb(140, 100, 40); }
    .status-302 { background: rgba(120, 80, 180, 0.15); color: rgb(100, 60, 160); }
    a, a:visited { color: rgb(180, 72, 135); }
    .card-thumb { background: rgba(64,56,74,0.06); }
  }

  @media (max-width: 600px) {
    .routes { grid-template-columns: 1fr; }
    .redirect-row { grid-template-columns: 1fr; gap: 0.1em; }
    .stats { flex-direction: column; }
  }
  #search { box-sizing: border-box; }
  .route.full-url { white-space: normal; overflow-wrap: anywhere; }
  .section-desc { opacity: 0.85; }
  .directory-links { font-size: 0.85em; }
</style>
</head>
<body>
<main><section class="main">
<h1><a href="https://aesthetic.computer/">aesthetic.computer</a> is home to</h1>
<p class="directory-links"><a href="https://aesthetic.computer/network.json">Network JSON</a> · <a href="https://aesthetic.computer/api?format=json">Public API JSON</a> · <a href="https://aesthetic.computer/llms.txt">Machine guide</a></p>
<input type="search" id="search" aria-label="Filter products, pieces and APIs" placeholder="Filter products, pieces and APIs…">
<!-- generated:directory -->
<p id="empty" class="hidden" role="status">No matches.</p>
</section></main>
<script>
const search = document.getElementById("search");
const cards = [...document.querySelectorAll(".card")];
const initiallyOpen = new Set(cards.filter(card => card.querySelector("details").open));
search.addEventListener("input", () => {
  const q = search.value.toLowerCase().trim();
  let matches = 0;
  for (const card of cards) {
    const details = card.querySelector("details");
    const headingMatch = card.querySelector("summary").textContent.toLowerCase().includes(q) ||
      (card.querySelector(".section-desc")?.textContent || "").toLowerCase().includes(q);
    let visible = false;
    for (const row of card.querySelectorAll(".route")) {
      const match = !q || headingMatch || row.textContent.toLowerCase().includes(q);
      row.classList.toggle("hidden", !match);
      visible ||= match;
    }
    card.classList.toggle("hidden", !visible);
    details.open = q ? visible : initiallyOpen.has(card);
    if (visible) matches++;
  }
  document.getElementById("empty").classList.toggle("hidden", matches > 0);
});
</script>
</body>
</html>
